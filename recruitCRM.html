// ── Global Search ─────────────────────────────────────────────────────────
function GlobalSearch({setPage}){
  const [q,setQ]=useState("");
  const [savedList,setSavedList]=useState(null);
  const [results,setResults]=useState(null);
  const [open,setOpen]=useState(false);
  const [loading,setLoading]=useState(false);
  const ref=React.useRef();

  useEffect(()=>{
    if(!q.trim()){setResults(null);return;}
    if(isBooleanQuery(q)){setResults({candidates:[],jobs:[],companies:[],boolean:true});return;}
    const t=setTimeout(async()=>{
      setLoading(true);
      const term=q.trim();
      const cf="id,name,role,location,current_employer";
      // Three simple searches (name, location, role) merged together, so typing
      // a town such as "Birmingham" finds everyone based there.
      const [cn,cl,cr,j,co]=await Promise.all([
        db.from("candidates").select(cf).ilike("name",`%${term}%`).limit(15),
        db.from("candidates").select(cf).ilike("location",`%${term}%`).limit(25),
        db.from("candidates").select(cf).or(`role.ilike.%${term.replace(/[,()]/g," ")}%,current_employer.ilike.%${term.replace(/[,()]/g," ")}%`).limit(15),
        db.from("jobs").select("id,title,status,companies(name)").ilike("title",`%${term}%`).limit(5),
        db.from("companies").select("id,name,industry").ilike("name",`%${term}%`).limit(4),
      ]);
      const errs=[cn,cl,cr,j,co].map(r=>r.error&&r.error.message).filter(Boolean);
      const seen=new Set(),cands=[];
      [...(cn.data||[]),...(cl.data||[]),...(cr.data||[])].forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);cands.push(c);}});
      setResults({candidates:cands.slice(0,25),jobs:j.data||[],companies:co.data||[],error:errs[0]||""});
      setLoading(false);
    },300);
    return()=>clearTimeout(t);
  },[q]);

  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[]);

  // Keyboard shortcut: Cmd/Ctrl+K
  useEffect(()=>{
    const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();ref.current?.querySelector("input")?.focus();setOpen(true);}};
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[]);

  // Open the full results page for the current search
  const seeAll=()=>{
    const term=q.trim();
    if(!term)return;
    setOpen(false);
    window._pendingSearch=term;
    window.dispatchEvent(new CustomEvent("globalSearch",{detail:term}));
  };

  const total=(results?.candidates?.length||0)+(results?.jobs?.length||0)+(results?.companies?.length||0);

  // Open the candidate's record, not just the Candidates page
  const openCand=async(c)=>{
    setQ("");setOpen(false);
    // Search results only carry a few fields, so fetch the full record first
    const{data}=await db.from("candidates")
      .select("id,name,role,location,email,phone,status,experience,salary,notice,skills,notes,cv_url,cv_path,cv_filename,created_at")
      .eq("id",c.id).single();
    const full=data||c;
    window._pendingOpenCandidate=full;
    setPage("candidates");
    setTimeout(()=>window.dispatchEvent(new CustomEvent("openCandidate",{detail:full})),400);
  };

  return <div ref={ref} style={{position:"relative"}}>
    <div style={{display:"flex",alignItems:"center",gap:6,background:"var(--bg2)",border:"0.5px solid var(--brm)",borderRadius:8,padding:"5px 10px",width:220}} className="global-search">
      <span onClick={seeAll} title="See all results" style={{color:"var(--t3)",cursor:"pointer"}}><Icon n="search" size={14}/></span>
      <input type="text" value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}} onFocus={()=>{setOpen(true);db.from("saved_searches").select("id,name,query,include_cv").order("name").then(({data,error})=>setSavedList(error?[]:data||[]));}}
        onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();seeAll();}if(e.key==="Escape")setOpen(false);}}
        placeholder="Search… (⌘K)" style={{border:"none",background:"transparent",outline:"none",fontSize:12,color:"var(--t1)",width:"100%",padding:0}}/>
      {q&&<button onClick={()=>{setQ("");setResults(null);}} style={{background:"none",border:"none",cursor:"pointer",color:"var(--t3)",fontSize:11,padding:0}}>✕</button>}
    </div>
    {open&&!q&&savedList&&savedList.length>0&&<div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"var(--bg)",border:"0.5px solid var(--brm)",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,0.15)",zIndex:600,minWidth:300,maxHeight:380,overflowY:"auto"}}>
      <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.5px"}}>⭐ Saved searches</div>
      {savedList.map(x=><div key={x.id} onMouseDown={e=>{e.preventDefault();setOpen(false);window.dispatchEvent(new CustomEvent("globalSearch",{detail:{q:x.query,cv:x.include_cv}}));}}
        style={{padding:"8px 14px",cursor:"pointer",borderBottom:"0.5px solid var(--br)"}} onMouseOver={e=>e.currentTarget.style.background="var(--bg2)"} onMouseOut={e=>e.currentTarget.style.background=""}>
        <div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>{x.name}{x.include_cv?" 📄":""}</div>
        <div style={{fontSize:11,color:"var(--t3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.query}</div>
      </div>)}
    </div>}
    {open&&q&&<div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"var(--bg)",border:"0.5px solid var(--brm)",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,0.15)",zIndex:600,minWidth:300,maxHeight:380,overflowY:"auto"}}>
      {loading&&<div style={{padding:"12px 14px",fontSize:12,color:"var(--t3)"}}>Searching…</div>}
      {!loading&&results?.error&&<div style={{padding:"10px 14px",fontSize:12,color:"#a32d2d"}}>Search error: {results.error}</div>}
      {!loading&&results?.boolean&&<div onClick={seeAll} style={{padding:"14px",fontSize:12,color:ACCENT,textAlign:"center",cursor:"pointer",fontWeight:600}}>Boolean search — press Enter to see results →</div>}
      {!loading&&results&&!results.boolean&&total===0&&<div style={{padding:"16px 14px",fontSize:12,color:"var(--t3)",textAlign:"center"}}>No results for "{q}"</div>}
      {!loading&&results&&total>0&&<>
        {results.candidates.length>0&&<>
          <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.5px"}}>Candidates</div>
          {results.candidates.map(c=><div key={c.id} onClick={()=>openCand(c)} style={{padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,borderBottom:"0.5px solid var(--br)"}} onMouseOver={e=>e.currentTarget.style.background="var(--bg2)"} onMouseOut={e=>e.currentTarget.style.background=""}>
            <Av name={c.name} size={26}/><div><div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>{c.name}</div><div style={{fontSize:11,color:"var(--t2)"}}>{c.role||"—"}{c.location?` · ${c.location}`:""}</div></div>
          </div>)}
        </>}
        {results.jobs.length>0&&<>
          <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.5px"}}>Jobs</div>
          {results.jobs.map(j=><div key={j.id} onClick={()=>{setPage("jobs");setQ("");setOpen(false);}} style={{padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,borderBottom:"0.5px solid var(--br)"}} onMouseOver={e=>e.currentTarget.style.background="var(--bg2)"} onMouseOut={e=>e.currentTarget.style.background=""}>
            <span style={{fontSize:18}}>💼</span><div><div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>{j.title}</div><div style={{fontSize:11,color:"var(--t2)"}}>{j.companies?.name||"—"} · <Pill label={j.status||"Open"}/></div></div>
          </div>)}
        </>}
        {results.companies.length>0&&<>
          <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.5px"}}>Companies</div>
          {results.companies.map(c=><div key={c.id} onClick={()=>{setPage("companies");setQ("");setOpen(false);}} style={{padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8}} onMouseOver={e=>e.currentTarget.style.background="var(--bg2)"} onMouseOut={e=>e.currentTarget.style.background=""}>
            <span style={{fontSize:18}}>🏢</span><div><div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>{c.name}</div><div style={{fontSize:11,color:"var(--t2)"}}>{c.industry||"—"}</div></div>
          </div>)}
        </>}
        <div onClick={seeAll} style={{position:"sticky",bottom:0,background:"var(--bg)",borderTop:"0.5px solid var(--brm)",padding:"10px 14px",fontSize:12,fontWeight:600,color:ACCENT,cursor:"pointer",textAlign:"center"}}>
          See all results for "{q.trim()}" →  <span style={{fontWeight:400,color:"var(--t3)"}}>(or press Enter)</span>
        </div>
      </>}
    </div>}
  </div>;
}

// ── Boolean search engine ──────────────────────────────────────────────────
// Supports: AND, OR, NOT (any case), -word, "exact phrase", (brackets), ecolog* wildcards.
// Words next to each other with no operator are treated as AND.
function isBooleanQuery(q){
  return /\b(AND|OR|NOT)\b/.test(q)||/["()*]/.test(q)||/(^|\s)-\S/.test(q);
}
function boolNorm(s){
  return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[–—]/g," ");
}
function boolTermRegex(text){
  const wild=text.endsWith("*");
  const core=boolNorm(wild?text.slice(0,-1):text).trim();
  if(!core)return null;
  const body=core.split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s+");
  return new RegExp("(?<![a-z0-9])"+body+(wild?"":"(?![a-z0-9])"));
}
function parseBoolean(q){
  const toks=[];
  const re=/\s*(\(|\)|"[^"]*"?|[^\s()"]+)/g;let m;
  while((m=re.exec(q))!==null){
    const t=m[1];
    if(t==="("||t===")")toks.push({k:t});
    else if(t.startsWith('"'))toks.push({k:"term",text:t.replace(/"/g,""),phrase:true});
    else if(/^(and|or|not)$/i.test(t))toks.push({k:t.toUpperCase()});
    else if(t.length>1&&t.startsWith("-")){toks.push({k:"NOT"});toks.push({k:"term",text:t.slice(1)});}
    else toks.push({k:"term",text:t});
  }
  let i=0;
  const peek=()=>toks[i];
  const parseOr=()=>{
    let l=parseAnd();
    while(peek()&&peek().k==="OR"){i++;l={op:"OR",a:l,b:parseAnd()};}
    return l;
  };
  const parseAnd=()=>{
    let l=parseNot();
    while(peek()&&peek().k!=="OR"&&peek().k!==")"){
      if(peek().k==="AND")i++;
      l={op:"AND",a:l,b:parseNot()};
    }
    return l;
  };
  const parseNot=()=>{
    if(peek()&&peek().k==="NOT"){i++;return{op:"NOT",a:parseNot()};}
    return parsePrimary();
  };
  const parsePrimary=()=>{
    const t=peek();
    if(!t)throw new Error("Search ends too early — check for a missing word after AND / OR / NOT");
    if(t.k==="("){i++;const e=parseOr();if(!peek()||peek().k!==")")throw new Error("Missing closing bracket )");i++;return e;}
    if(t.k==="term"){i++;const r=boolTermRegex(t.text);if(!r)throw new Error("Empty search term");return{op:"TERM",re:r,text:t.text};}
    throw new Error(`Unexpected "${t.k}" — check your brackets and operators`);
  };
  if(!toks.length)throw new Error("Type something to search for");
  const ast=parseOr();
  if(i<toks.length)throw new Error(toks[i].k===")"?"Extra closing bracket )":"Couldn't understand the search");
  return ast;
}
function evalBoolean(ast,text){
  switch(ast.op){
    case "TERM":return ast.re.test(text);
    case "NOT":return !evalBoolean(ast.a,text);
    case "AND":return evalBoolean(ast.a,text)&&evalBoolean(ast.b,text);
    case "OR":return evalBoolean(ast.a,text)||evalBoolean(ast.b,text);
  }
  return false;
}
// The terms that count towards a match (anything not under a NOT)
function positiveTerms(ast,neg=false,out=[]){
  if(ast.op==="TERM"){if(!neg)out.push(ast.re);}
  else if(ast.op==="NOT")positiveTerms(ast.a,!neg,out);
  else{positiveTerms(ast.a,neg,out);positiveTerms(ast.b,neg,out);}
  return out;
}
// Fetch every row of a table in pages (Supabase returns at most 1000 at a time)
// Supabase returns at most 1,000 rows per request. allRows keeps asking for
// the next 1,000 until it has them all, so lists don't silently stop at 1,000.
async function allRows(make){
  const out=[];
  for(let from=0;;from+=1000){
    const{data,error}=await make().range(from,from+999);
    if(error)return{data:out.length?out:null,error};
    out.push(...(data||[]));
    if(!data||data.length<1000)break;
  }
  return{data:out,error:null};
}
async function fetchAll(table,cols){
  const out=[];
  for(let from=0;;from+=1000){
    const{data,error}=await db.from(table).select(cols).range(from,from+999);
    if(error)throw error;
    out.push(...(data||[]));
    if(!data||data.length<1000)break;
  }
  return out;
}

// ── Full search results page ───────────────────────────────────────────────
// Opened by pressing Enter (or "See all results") in the top search bar.
// Finds every candidate whose name, location or role matches, plus jobs and companies.
function SearchResultsPage({query,cvFlag,nonce,setPage}){
  const [term,setTerm]=useState(query||"");
  const [input,setInput]=useState(query||"");
  const [res,setRes]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [tab,setTab]=useState("candidates");
  const [detail,setDetail]=useState(null);
  const [editRow,setEditRow]=useState(null);
  const [selected,setSelected]=useState(new Set());
  const [hotlists,setHotlists]=useState([]);
  const [hlPick,setHlPick]=useState("");
  const [msg,setMsg]=useState("");
  const [includeCv,setIncludeCv]=useState(false);
  const [showHelp,setShowHelp]=useState(false);
  const [mode,setMode]=useState("simple");

  // A new search from the top bar replaces the current one
  useEffect(()=>{setTerm(query||"");setInput(query||"");setIncludeCv(!!cvFlag);},[nonce]);

  // ── Saved searches ──
  const [saved,setSaved]=useState([]);
  const [savedErr,setSavedErr]=useState("");
  const loadSaved=useCallback(async()=>{
    const{data,error}=await db.from("saved_searches").select("*").order("name");
    if(error)setSavedErr(/saved_searches/.test(error.message)?"Saved searches aren't set up yet"+UPGRADE_HINT:error.message);
    else{setSavedErr("");setSaved(data||[]);}
  },[]);
  useEffect(()=>{loadSaved();},[loadSaved]);
  const saveSearch=async()=>{
    const t=(term||"").trim();if(!t)return;
    const name=prompt("Name this search (e.g. \"Senior ecologists – Midlands\")",t.length>40?t.slice(0,40)+"…":t);
    if(!name||!name.trim())return;
    const{error}=await db.from("saved_searches").insert({name:name.trim(),query:t,include_cv:includeCv});
    if(error){setErr(error.message+(/saved_searches/.test(error.message)?UPGRADE_HINT:""));return;}
    setMsg(`Saved "${name.trim()}"`);setTimeout(()=>setMsg(""),2500);loadSaved();
  };
  const runSaved=x=>{setInput(x.query);setIncludeCv(!!x.include_cv);setTerm(x.query);};
  const delSaved=async x=>{if(!confirm(`Remove saved search "${x.name}"?`))return;await db.from("saved_searches").delete().eq("id",x.id);loadSaved();};
  const isSaved=saved.some(x=>x.query===term&&!!x.include_cv===includeCv);

  const run=useCallback(async()=>{
    const t=(term||"").trim();
    if(!t){setRes(null);return;}
    setLoading(true);setErr("");setSelected(new Set());
    if(isBooleanQuery(t)||includeCv){
      setMode("boolean");
      let ast;
      try{ast=parseBoolean(t);}catch(e){setErr(e.message);setRes({candidates:[],jobs:[],companies:[]});setLoading(false);return;}
      try{
        const base="id,name,role,location,email,status,skills,notes,experience,cv_url,cv_path,cv_filename";
        const cv=includeCv?",cv_text":"";
        // Include the ecology fields when they exist; fall back if the upgrade SQL hasn't run
        const candRows=()=>fetchAll("candidates",base+",licences,cieem_level"+cv).catch(()=>fetchAll("candidates",base+cv));
        const [allC,allJ,allCo]=await Promise.all([
          candRows(),
          fetchAll("jobs","id,title,status,salary,industry,description,companies(name)"),
          fetchAll("companies","id,name,industry,status,website"),
        ]);
        const pos=positiveTerms(ast);
        const fields=[["Name",c=>c.name],["Role",c=>c.role],["Location",c=>c.location],
          ["Skills",c=>(c.skills||[]).join(" ")],["Licences",c=>(c.licences||[]).join(" · ")+" "+(c.cieem_level||"")],["Notes",c=>c.notes],["Experience",c=>c.experience],["Email",c=>c.email]];
        if(includeCv)fields.push(["CV",c=>c.cv_text]);
        const cands=[];
        allC.forEach(c=>{
          const texts=fields.map(([l,f])=>[l,boolNorm(f(c))]);
          const all=texts.map(x=>x[1]).join(" \n ");
          if(!evalBoolean(ast,all))return;
          const hit=texts.filter(([,tx])=>pos.some(re=>re.test(tx))).map(([l])=>l);
          const{cv_text,...rest}=c;
          cands.push({...rest,_match:hit.length?hit:["—"]});
        });
        cands.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
        const jobs=allJ.filter(j=>evalBoolean(ast,boolNorm([j.title,j.industry,j.description,j.salary,j.companies?.name].join(" \n "))));
        const cos=allCo.filter(c=>evalBoolean(ast,boolNorm([c.name,c.industry,c.website].join(" \n "))));
        setRes({candidates:cands,jobs,companies:cos});
        setTab(cands.length?"candidates":jobs.length?"jobs":cos.length?"companies":"candidates");
      }catch(e){setErr(e.message||String(e));}
      setLoading(false);
      return;
    }
    setMode("simple");
    const cf="id,name,role,location,current_employer,email,status,skills,cv_url,cv_path,cv_filename";
    const [cn,cl,cr,j,co]=await Promise.all([
      db.from("candidates").select(cf).ilike("name",`%${t}%`).limit(1000),
      db.from("candidates").select(cf).ilike("location",`%${t}%`).limit(1000),
      db.from("candidates").select(cf).or(`role.ilike.%${t.replace(/[,()]/g," ")}%,current_employer.ilike.%${t.replace(/[,()]/g," ")}%`).limit(1000),
      db.from("jobs").select("id,title,status,salary,companies(name)").ilike("title",`%${t}%`).limit(200),
      db.from("companies").select("id,name,industry,status").ilike("name",`%${t}%`).limit(200),
    ]);
    const e=[cn,cl,cr,j,co].map(r=>r.error&&r.error.message).filter(Boolean);
    if(e.length)setErr(e[0]);
    // Merge, remembering which field(s) matched
    const map=new Map();
    const add=(rows,field)=>(rows||[]).forEach(c=>{
      const ex=map.get(c.id);
      if(ex)ex._match.push(field);else map.set(c.id,{...c,_match:[field]});
    });
    add(cn.data,"Name");add(cl.data,"Location");add(cr.data,"Role");
    const cands=[...map.values()].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    setRes({candidates:cands,jobs:j.data||[],companies:co.data||[]});
    setTab(cands.length?"candidates":(j.data||[]).length?"jobs":(co.data||[]).length?"companies":"candidates");
    setLoading(false);
  },[term,includeCv]);
  useEffect(()=>{run();},[run]);

  useEffect(()=>{
    db.from("hotlists").select("id,name").order("created_at",{ascending:false}).then(({data})=>setHotlists(data||[]));
  },[]);

  const cands=res?.candidates||[];
  const toggle=id=>setSelected(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleAll=()=>setSelected(s=>s.size===cands.length?new Set():new Set(cands.map(c=>c.id)));

  const addToHotlist=async()=>{
    if(!hlPick||!selected.size)return;
    const{data:existing}=await db.from("hotlist_candidates").select("candidate_id").eq("hotlist_id",hlPick);
    const have=new Set((existing||[]).map(r=>r.candidate_id));
    const rows=[...selected].filter(id=>!have.has(id)).map(id=>({hotlist_id:hlPick,candidate_id:id}));
    if(rows.length){
      const{error}=await db.from("hotlist_candidates").insert(rows);
      if(error){setErr(error.message);return;}
    }
    const name=hotlists.find(h=>h.id===hlPick)?.name||"hotlist";
    const skipped=selected.size-rows.length;
    setMsg(`Added ${rows.length} to "${name}"${skipped?` (${skipped} already on it)`:""}`);
    setTimeout(()=>setMsg(""),3000);
    setSelected(new Set());setHlPick("");
  };

  const exportCSV=()=>{
    const list=selected.size?cands.filter(c=>selected.has(c.id)):cands;
    const head=["Name","Role","Location","Email","Status"];
    const rows=[head,...list.map(c=>[c.name,c.role,c.location,c.email,c.status].map(v=>`"${(v||"").toString().replace(/"/g,'""')}"`))];
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(rows.map(r=>r.join(",")).join("\n"));
    a.download=`search_${term.replace(/[^a-z0-9]+/gi,"_")}.csv`;
    a.click();
  };

  // The list only holds a few fields, so fetch the full record before opening it
  const openCand=async c=>{
    const{data}=await db.from("candidates").select("*").eq("id",c.id).single();
    setDetail(data||c);
  };

  const counts={candidates:cands.length,jobs:res?.jobs?.length||0,companies:res?.companies?.length||0};
  const tabBtn=(k,l)=><button key={k} onClick={()=>setTab(k)} style={{fontSize:12,padding:"5px 12px",borderRadius:20,border:"0.5px solid var(--brm)",cursor:"pointer",background:tab===k?ACCENT:"transparent",color:tab===k?"#fff":"var(--t2)",fontFamily:"inherit"}}>{l} ({counts[k]})</button>;

  return <div>
    {detail&&<CandidateDetailPanel cand={detail} onClose={()=>setDetail(null)} onEdit={c=>{setDetail(null);setEditRow(c);}} onRefresh={run}/>}
    {editRow&&<CandModal cand={editRow} onClose={()=>setEditRow(null)} onSaved={run}/>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>
        {loading?"Searching…":res?`${counts.candidates+counts.jobs+counts.companies} result${counts.candidates+counts.jobs+counts.companies!==1?"s":""} for: ${term}`:"Search"}
      </span>
      <div style={{display:"flex",gap:8}}>
        <input type="text" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter")setTerm(input.trim());}}
          placeholder={'e.g. ("senior ecologist" OR principal) AND birmingham'} style={{width:340}}/>
        <button className="btn-a" onClick={()=>setTerm(input.trim())}>Search</button>
      </div>
    </div>

    <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",marginBottom:12,fontSize:12,color:"var(--t2)"}}>
      <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
        <input type="checkbox" checked={includeCv} onChange={e=>setIncludeCv(e.target.checked)} style={{width:15,height:15,accentColor:ACCENT}}/>
        Also search inside CVs
      </label>
      <span style={{color:"var(--t3)"}}>{mode==="boolean"?"Boolean search · searching name, role, location, licences, skills, notes"+(includeCv?" and CV text":""):"Simple search · name, location and role"}</span>
      <span style={{flex:1}}/>
      <button onClick={()=>setShowHelp(h=>!h)} style={{background:"none",border:"none",color:ACCENT,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}}>{showHelp?"Hide":"How to"} Boolean search</button>
    </div>
    {showHelp&&<div style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:10,padding:"12px 16px",marginBottom:12,fontSize:12,color:"var(--t2)",lineHeight:1.9}}>
      {[
        ['ecologist AND birmingham','both words'],
        ['bristol OR bath','either word'],
        ['ecologist NOT junior','leave out anyone mentioning junior (-junior also works)'],
        ['"bat licence"','exact phrase'],
        ['ecolog*','word starting with ecolog — ecologist, ecology, ecological'],
        ['("senior ecologist" OR "principal ecologist") AND (birmingham OR coventry)','brackets to group'],
      ].map(([ex,d])=><div key={ex}><code style={{background:"var(--bg2)",borderRadius:5,padding:"2px 7px",color:"var(--t1)",cursor:"pointer"}} onClick={()=>{setInput(ex);setTerm(ex);}} title="Click to try it">{ex}</code> <span style={{color:"var(--t3)"}}>— {d}</span></div>)}
      <div style={{marginTop:6,color:"var(--t3)"}}>Words side by side count as AND. Matches whole words, so "bat" won't match "battery" (use bat* for that). Tick "Also search inside CVs" to include CV text — slower the first time.</div>
    </div>}

    {/* Saved searches */}
    {(saved.length>0||term)&&<div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:12}}>
      {saved.length>0&&<span style={{fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.5px",marginRight:2}}>⭐ Saved</span>}
      {saved.map(x=><span key={x.id} style={{display:"inline-flex",alignItems:"center",gap:4,background:x.query===term?"rgba(95,169,43,0.18)":"var(--bg)",border:"0.5px solid "+(x.query===term?ACCENT:"var(--brm)"),borderRadius:16,padding:"3px 4px 3px 10px",fontSize:12}}>
        <span onClick={()=>runSaved(x)} title={x.query+(x.include_cv?" (incl. CVs)":"")} style={{cursor:"pointer",color:"var(--t1)"}}>{x.name}{x.include_cv?" 📄":""}</span>
        <button onClick={()=>delSaved(x)} title="Remove" style={{background:"none",border:"none",cursor:"pointer",color:"var(--t3)",fontSize:11,padding:"0 4px"}}>✕</button>
      </span>)}
      <span style={{flex:1}}/>
      {term&&!isSaved&&!savedErr&&<button className="btn-o" style={{fontSize:12,padding:"4px 12px"}} onClick={saveSearch}>☆ Save this search</button>}
      {term&&isSaved&&<span style={{fontSize:12,color:ACCENT}}>★ Saved</span>}
    </div>}
    {savedErr&&<div style={{fontSize:11,color:"var(--t3)",marginBottom:8}}>{savedErr}</div>}

    <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
      {tabBtn("candidates","Candidates")}{tabBtn("jobs","Jobs")}{tabBtn("companies","Companies")}

// ── Send to Client Email Draft ─────────────────────────────────────────────
function SendToClientSection({cand}){
  const [open,setOpen]=useState(false);
  const [loading,setLoading]=useState(false);
  const [draft,setDraft]=useState("");
  const [copied,setCopied]=useState(false);

  const generate=async()=>{
    setLoading(true);setDraft("");
    try{
      await claude(
        "You are a recruitment consultant writing a brief, professional email to a client introducing a candidate. Keep it to 3 short paragraphs: why you're reaching out, a 2-sentence candidate summary, and a call to action. Warm but concise. No bullet points.",
        `Candidate: ${cand.name}, ${cand.role||"not specified"}, ${cand.experience||"?"} experience, based in ${cand.location||"?"}, salary expectation ${cand.salary||"?"}. Skills: ${(cand.skills||[]).join(", ")||"not listed"}. Notice period: ${cand.notice||"unknown"}.`,
        chunk=>setDraft(d=>d+chunk)
      );
    }catch(e){setDraft("Error: "+e.message);}
    setLoading(false);
  };

  const copy=()=>{navigator.clipboard?.writeText(draft);setCopied(true);setTimeout(()=>setCopied(false),2000);};

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:8}}>
      <span>Send to client</span>
      <button onClick={()=>{setOpen(o=>!o);if(!open&&!draft)generate();}} style={{background:"none",border:"0.5px solid var(--brm)",borderRadius:6,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"var(--t2)"}}>
        {open?"Hide":"✦ Draft email"}
      </button>
    </div>
    {open&&<div style={{background:"var(--bg2)",borderRadius:8,padding:"12px 14px"}}>
      {(loading||draft)&&<>
        <AiTag/>
        <div style={{fontSize:12,color:"var(--t1)",lineHeight:1.7,whiteSpace:"pre-wrap",marginBottom:10}}>{draft}{loading&&<span style={{display:"inline-block",width:6,height:12,background:ACCENT,marginLeft:2,verticalAlign:"middle",borderRadius:1,animation:"blink 1s step-end infinite"}}/>}</div>
        {!loading&&draft&&<div style={{display:"flex",gap:6}}>
          <button className="btn-o" style={{fontSize:11,padding:"4px 10px"}} onClick={copy}>{copied?"✓ Copied!":"📋 Copy"}</button>
          <button className="btn-o" style={{fontSize:11,padding:"4px 10px"}} onClick={generate}>↺ Regenerate</button>
        </div>}
      </>}
      {!loading&&!draft&&<button className="btn-a" style={{width:"100%",justifyContent:"center",fontSize:12}} onClick={generate}>✦ Generate email draft</button>}
    </div>}
  </div>;
}

function AddTaskModal({cand,onClose,onSaved}){

  const [priority,setPriority]=useState("normal");
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const save=async()=>{
    if(!title.trim()){setErr("Give the task a title");return;}
    setSaving(true);setErr("");
    const{error}=await db.from("tasks").insert({
      title:title.trim(),due_date:due||null,due_time:time||null,priority,done:false,
      candidate_id:String(cand.id),candidate_name:cand.name||null,
    });
    setSaving(false);
    if(error){setErr(error.message+(/candidate_/i.test(error.message)?TASK_SQL_HINT:""));return;}
    if(onSaved)onSaved();

  return <div className="modal-overlay" style={{zIndex:1100}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:420}}>
      <h3>✅ New task <span style={{fontWeight:400,color:"var(--t2)"}}>— {cand.name}</span></h3>

      <div className="fr2">
        <div><label>Due date</label><input type="date" value={due} onChange={e=>setDue(e.target.value)}/></div>
        <div><label>Remind me at (optional)</label><input type="time" value={time} onChange={e=>setTime(e.target.value)}/></div>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10,fontSize:11}}>
        <span style={{color:"var(--t3)"}}>Quick:</span>
        {[["Today",todayStr()],["Tomorrow",tomorrowStr()],["Next week",(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)})()]].map(([l,v])=>
          <span key={l} onClick={()=>setDue(v)} style={{color:ACCENT,cursor:"pointer",textDecoration:"underline"}}>{l}</span>)}
      </div>
      <div className="fr"><label>Priority</label>
        <select value={priority} onChange={e=>setPriority(e.target.value)}>

      </div>

// ─── CANDIDATE DOCUMENTS ──────────────────────────────────────────────────
// Extra files kept against a candidate (follow-up summaries, references,
// certificates…). Stored privately in the candidate-cvs bucket under docs/,
// listed in the candidate_documents table. The CV keeps its own slot above.
function CandidateDocuments({candidateId}){
  const [docs,setDocs]=useState([]);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const ref=React.useRef();
  const load=()=>{ if(!candidateId)return;
    db.from("candidate_documents").select("*").eq("candidate_id",candidateId).order("doc_date",{ascending:false,nullsFirst:false})
      .then(({data,error})=>{ if(error)setErr(error.message); else setDocs(data||[]); });
  };
  useEffect(load,[candidateId]);
  const open=async(d)=>{
    const tab=window.open("","_blank");
    const{data,error}=await db.storage.from("candidate-cvs").createSignedUrl(d.file_path,3600);
    if(error||!data?.signedUrl){ if(tab)tab.close(); setErr("Could not open: "+(error?.message||"not found")); return; }
    if(tab)tab.location.href=data.signedUrl; else window.location.href=data.signedUrl;
  };
  const upload=async(e)=>{
    const files=[...(e.target.files||[])]; e.target.value="";
    if(!files.length)return;
    setBusy(true);setErr("");
    for(const f of files){
      if(f.size>15*1024*1024){setErr(f.name+" is too large (max 15MB)");continue;}
      const safe=f.name.replace(/[^\w.\- ]+/g,"_");
      const path=`docs/${candidateId}/${Date.now()}_${safe}`;
      const{error:upErr}=await db.storage.from("candidate-cvs").upload(path,f,{contentType:f.type||undefined});
      if(upErr){setErr(upErr.message);continue;}
      const{error:dbErr}=await db.from("candidate_documents").insert({candidate_id:candidateId,name:f.name,file_path:path,kind:"Other",doc_date:new Date().toISOString()});
      if(dbErr)setErr(dbErr.message);
    }
    setBusy(false);load();
  };
  const remove=async(d)=>{
    if(!confirm(`Delete "${d.name}" from this candidate?`))return;
    await db.storage.from("candidate-cvs").remove([d.file_path]);
    await db.from("candidate_documents").delete().eq("id",d.id);
    load();
  };
  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <div style={{fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px"}}>Documents{docs.length?` (${docs.length})`:""}</div>
      <button onClick={()=>ref.current?.click()} disabled={busy} style={{background:"transparent",border:"0.5px solid var(--brm)",borderRadius:6,padding:"3px 9px",fontSize:11,cursor:"pointer",color:"var(--t2)"}}>{busy?"Uploading…":"+ Add"}</button>
    </div>
    {docs.length===0&&<div style={{fontSize:12,color:"var(--t3)"}}>No documents yet.</div>}
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {docs.map(d=><div key={d.id} style={{border:"0.5px solid var(--brm)",borderRadius:8,padding:"8px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
          <span style={{color:"var(--t3)"}}><Icon n="doc" size={16}/></span>
          <div style={{minWidth:0}}>
            <div title={d.name} style={{fontSize:12,fontWeight:500,color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
            <div style={{fontSize:11,color:"var(--t3)"}}>{d.kind||"Document"}{d.doc_date?" · "+new Date(d.doc_date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          <button onClick={()=>open(d)} style={{background:ACCENT,color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>Open</button>
          <button onClick={()=>remove(d)} title="Delete" style={{background:"transparent",border:"0.5px solid #f09595",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",color:"#a32d2d"}}>✕</button>
        </div>
      </div>)}
    </div>
    <input ref={ref} type="file" multiple style={{display:"none"}} onChange={upload}/>
    {err&&<div style={{fontSize:11,color:"#a32d2d",marginTop:6}}>⚠️ {err}</div>}
  </div>;
}

function CandidateDetailPanel({cand:candProp, onClose, onEdit, onRefresh}){
  // The list only carries the columns it displays, so fetch the whole record
  // here — that way any field added to the table later still shows up.
  const [full,setFull]=useState(candProp);
  const cand=full||candProp;
  useEffect(()=>{
    setFull(candProp);
    if(!candProp?.id)return;
    let cancelled=false;
    db.from("candidates").select("*").eq("id",candProp.id).single()
      .then(({data})=>{ if(!cancelled&&data) setFull(data); });
    return()=>{cancelled=true;};
  },[candProp?.id]);

  const [activities,setActivities]=useState([]);
  const [actTick,setActTick]=useState(0);
  // One-tap logging: tapping Call or Email logs it straight away (with Undo);
  // LinkedIn asks once whether a message was actually sent.
  const [autoNote,setAutoNote]=useState(null);
  const outlook=useOutlook();
  const [composeOpen,setComposeOpen]=useState(false);
  const autoLog=async(type,subject)=>{
    const{data,error}=await db.from("activity_log").insert({entity_type:"candidate",entity_id:c.id,entity_name:c.name||"",activity_type:type,subject,body:null}).select("id").single();
    if(error){setAutoNote({err:error.message});return;}
    if(type==="Call")await markActiveIfNew(c.id);
    setAutoNote({id:data.id,type});setActTick(t=>t+1);
  };
  const undoAuto=async()=>{if(autoNote?.id){await db.from("activity_log").delete().eq("id",autoNote.id);setActTick(t=>t+1);}setAutoNote(null);};
  const [jobs,setJobs]=useState([]);
  const [loadingActs,setLoadingActs]=useState(true);
  const [cvUploading,setCvUploading]=useState(false);
  const [cvUrl,setCvUrl]=useState(cvStoragePath(cand));
  const [cvErr,setCvErr]=useState("");
  const cvRef=React.useRef();

  useEffect(()=>{
    if(!cand)return;
    setCvUrl(cvStoragePath(cand));
    setLoadingActs(true);
    Promise.all([
      db.from("activity_log").select("*").eq("entity_id",cand.id).order("created_at",{ascending:false}).limit(10),
      db.from("job_candidates").select("*,jobs(title,status,companies(name))").eq("candidate_id",cand.id),
    ]).then(([{data:acts},{data:jcs}])=>{
      setActivities(acts||[]);
      setJobs((jcs||[]).map(jc=>({...jc.jobs,stage:jc.stage,jcId:jc.id})));
      setLoadingActs(false);
    });
  },[cand,actTick]);
  const afterLog=()=>{
    setActTick(t=>t+1);
    db.from("candidates").select("*").eq("id",cand.id).single().then(({data})=>{if(data)setFull(data);});
    if(onRefresh)onRefresh();
  };

  const uploadCV=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const maxMB=10;
    if(file.size>maxMB*1024*1024){setCvErr(`File too large (max ${maxMB}MB)`);return;}
    setCvUploading(true);setCvErr("");
    const ext=file.name.split(".").pop();
    const path=`cvs/${cand.id}_${Date.now()}.${ext}`;
    const{error:upErr}=await db.storage.from("candidate-cvs").upload(path,file,{upsert:true,contentType:file.type});
    if(upErr){setCvErr(upErr.message);setCvUploading(false);return;}
    const{data:urlData}=db.storage.from("candidate-cvs").getPublicUrl(path);
    const url=urlData?.publicUrl;
    const cvText=await extractFileText(file,file.name);
    const{error:dbErr}=await db.from("candidates").update({cv_url:url,cv_path:path,cv_filename:file.name,cv_text:cvText||null}).eq("id",cand.id);
    if(dbErr){setCvErr(dbErr.message);setCvUploading(false);return;}
    setCvUrl(url);
    cand.cv_url=url;cand.cv_path=path;cand.cv_filename=file.name;
    setCvUploading(false);
    if(onRefresh)onRefresh();
  };

  const removeCV=async()=>{
