// ─── BULK CV MATCH ────────────────────────────────────────────────────────
// Pick a folder's worth of CVs at once. Each file's text is read in the
// browser, matched to a candidate by name, shown for review, then uploaded
// exactly like the single "Replace" button in the candidate panel.
function cvBaseName(fname){
  // "Mary Haine CV 2026 (1) (1).pdf" -> "mary haine cv 2026.pdf" so repeat downloads collapse
  const dot=fname.lastIndexOf(".");
  const stem=dot>0?fname.slice(0,dot):fname;
  const ext=dot>0?fname.slice(dot):"";
  return (stem.replace(/(\s*\(\d+\))+\s*$/,"")+ext).toLowerCase();
}
function cvNorm(s){
  return " "+(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/['’]/g,"").replace(/[^a-z]+/g," ").trim()+" ";
}
function cvNameParts(name){
  // Ignore credentials (ACIEEM, MCIEEM, CEnv…) and anything after | , or (
  const clean=(name||"").split(/[|,(]/)[0].trim();
  let toks=clean.split(/\s+/).filter(Boolean);
  const allCaps=t=>t.length>1&&t===t.toUpperCase()&&/[A-Z]/.test(t);
  if(!toks.every(allCaps)) toks=toks.filter(t=>!allCaps(t));
  const words=toks.map(t=>cvNorm(t).trim()).filter(Boolean);
  if(words.length<2) return null;
  return {first:words[0],last:words[words.length-1]};
}
function cvScore(p,fileN,headN,textN){
  const full=" "+p.first+" "+p.last+" ";
  let s=0;
  // Filename evidence
  if(fileN.includes(full)) s=Math.max(s,3);
  else if(fileN.includes(" "+p.first[0]+p.last+" ")) s=Math.max(s,2);            // JFreemantle CV.pdf
  else if(fileN.includes(" "+p.last+" ")&&(fileN.includes(" "+p.first+" ")||fileN.includes(" "+p.first[0]+" "))) s=Math.max(s,2);
  // CV text evidence: the name near the top is strong, further down could be a referee
  if(headN.includes(full)) s=Math.max(s,3);
  else if(headN.includes(" "+p.first+" ")&&headN.includes(" "+p.last+" ")) s=Math.max(s,2); // middle name
  else if(textN.includes(full)) s=Math.max(s,1);
  return s;
}
const CV_CONF={3:"Strong",2:"Likely",1:"Weak",0:"No match"};

function BulkCvMatch({candidates,onClose,onDone}){
  const [stage,setStage]=useState("pick"); // pick | reading | review | attaching | done
  const [progress,setProgress]=useState({done:0,total:0});
  const [items,setItems]=useState([]);
  const [showNoMatch,setShowNoMatch]=useState(false);
  const [results,setResults]=useState(null);
  const [skipped,setSkipped]=useState(0);
  const [finding,setFinding]=useState(null); // {done,total} while AI reads unmatched files
  const [findErr,setFindErr]=useState("");
  const fileRef=React.useRef();

  const byId={};candidates.forEach(c=>{byId[c.id]=c;});
  const sorted=[...candidates].filter(c=>c.name).sort((a,b)=>a.name.localeCompare(b.name));
  const indexed=candidates.map(c=>({c,p:cvNameParts(c.name)})).filter(x=>x.p);

  const readFiles=async(e)=>{
    const all=[...(e.target.files||[])].filter(f=>/\.(pdf|docx?|DOCX?|PDF)$/i.test(f.name));
    // Collapse "file.pdf", "file (1).pdf", "file (1) (1).pdf" into one (newest kept)
    const seen={};
    all.forEach(f=>{const k=cvBaseName(f.name);if(!seen[k]||f.lastModified>seen[k].lastModified)seen[k]=f;});
    const files=Object.values(seen);
    setSkipped(all.length-files.length);
    if(!files.length){alert("No PDF or Word files were selected.");return;}
    if(files.length>150&&!confirm(files.length+" files selected. Large batches can be slow on a Chromebook — carry on? (Choosing fewer files at a time is safer.)")){e.target.value="";return;}
    setStage("reading");setProgress({done:0,total:files.length});
    const out=[];
    for(let i=0;i<files.length;i++){
      const f=files[i];
      let text="";
      // Only the first 2 pages are needed to find a name — full text is read at attach time
      if(f.size<=10*1024*1024) text=(await extractFileText(f,f.name,2)).slice(0,4000);
      await new Promise(res=>setTimeout(res,0)); // let the browser tidy up between files
      const fileN=cvNorm(f.name.replace(/\.[^.]+$/,"").replace(/[_\-.]+/g," ").replace(/([a-z])([A-Z])/g,"$1 $2")+" "+f.name.replace(/\.[^.]+$/,""));
      const textN=cvNorm(text);
      const headN=textN.slice(0,600);
      let best=0,matches=[];
      indexed.forEach(({c,p})=>{
        const s=cvScore(p,fileN,headN,textN);
        if(s>best){best=s;matches=[c];}
        else if(s===best&&s>0&&!matches.some(m=>m.id===c.id))matches.push(c);
      });
      const tie=matches.length>1;
      const cand=best>0?matches[0]:null;
      let note="";
      if(f.size>10*1024*1024) note="Over 10MB, can't upload";
      else if(!text) note="Couldn't read text (scanned?), matched on filename only";
      if(tie) note="Also matches "+matches.slice(1).map(m=>m.name).join(", ");
      out.push({key:i,file:f,hasText:!!text,snippet:text,newCand:null,candId:cand?cand.id:"",score:best,manual:false,note,
        tooBig:f.size>10*1024*1024,
        include:!!cand&&best>=2&&!tie&&f.size<=10*1024*1024});
      setProgress({done:i+1,total:files.length});
    }
    // Only one file per candidate: keep the newest, untick the rest
    const groups={};
    out.filter(r=>r.include).forEach(r=>{(groups[r.candId]=groups[r.candId]||[]).push(r);});
    Object.values(groups).forEach(g=>{
      if(g.length<2)return;
      g.sort((a,b)=>b.file.lastModified-a.file.lastModified);
      g.slice(1).forEach(r=>{r.include=false;r.note="A newer file is also matched to this person";});
    });
    // Don't silently overwrite a CV that's already on file
    out.forEach(r=>{
      if(r.include&&r.candId&&hasCv(byId[r.candId])){r.include=false;r.note=r.note||"Already has a CV — tick to replace it";}
    });
    out.sort((a,b)=>(b.score-a.score)||a.file.name.localeCompare(b.file.name));
    setItems(out);setStage("review");
  };

  const update=(key,patch)=>setItems(list=>list.map(r=>r.key===key?{...r,...patch}:r));

  // Read unmatched files with AI: is it a CV, and whose? Creates "new candidate" rows.
  const findNew=async()=>{
    const todo=items.filter(r=>!r.candId&&!r.newCand&&r.snippet&&!r.tooBig&&!r.checked);
    if(!todo.length)return;
    setFindErr("");setFinding({done:0,total:todo.length});
    const existing=indexed.map(x=>({c:x.c,k:x.p.first+" "+x.p.last}));
    const found={}; // name key -> newest item key, so one person isn't created twice
    const patches={};
    for(let i=0;i<todo.length;i++){
      const r=todo[i];
      try{
        let raw="";
        await claude(
          "You are a CV parser. Decide whether the document is a person's CV/resume, then extract details. Respond ONLY with a JSON object (no markdown) with keys: is_cv (true only for a CV/resume; false for job descriptions, letters, invoices, reports or anything else), name, role, email, phone, location, experience, salary, notice, skills (array of strings), notes (2-sentence summary). Use null for unknown fields.",
          "DOCUMENT FILENAME: "+r.file.name+"\n\nDOCUMENT TEXT:\n"+r.snippet.slice(0,4000),
          chunk=>{raw+=chunk;}
        );
        const m=raw.match(/\{[\s\S]*\}/);
        const obj=m?JSON.parse(m[0]):null;
        if(obj&&obj.is_cv&&obj.name&&cvNameParts(obj.name)){
          const p=cvNameParts(obj.name);const k=p.first+" "+p.last;
          const already=existing.find(x=>x.k===k);
          if(already){
            patches[r.key]={candId:already.c.id,score:2,checked:true,include:!hasCv(already.c),
              note:hasCv(already.c)?"Already has a CV — tick to replace it":"Matched by reading the CV"};
          }else{
            const prev=found[k];
            if(prev===undefined||r.file.lastModified>(items.find(x=>x.key===prev)?.file.lastModified||0)){
              if(prev!==undefined)patches[prev]={newCand:null,candId:"",include:false,checked:true,note:"A newer CV for this person is in the list"};
              found[k]=r.key;
              patches[r.key]={newCand:obj,candId:"__new__",include:true,checked:true,note:""};
            }else{
              patches[r.key]={checked:true,note:"A newer CV for this person is in the list"};
            }
          }
        }else{
          patches[r.key]={checked:true,note:obj&&obj.is_cv===false?"Not a CV":"Couldn't find a name"};
        }
      }catch(e){
        setFindErr(e.message);
        if(/API key|api key|401|credit/i.test(e.message))break;
      }
      setFinding({done:i+1,total:todo.length});
    }
    setItems(list=>list.map(r=>patches[r.key]?{...r,...patches[r.key]}:r));
    setFinding(null);setShowNoMatch(true);
  };

  const attach=async()=>{
    const todo=items.filter(r=>r.include&&r.candId&&!r.tooBig);
    setStage("attaching");setProgress({done:0,total:todo.length});
    const ok=[],failed=[];let inboxed=0,inboxSkipped=0;
    for(let i=0;i<todo.length;i++){
      const r=todo[i];let c=byId[r.candId];
      // Unmatched CV the user chose to keep for later
      if(r.candId==="__inbox__"){
        const res=await storeInInbox(r.file);
        if(res.ok)inboxed++;else if(res.skipped)inboxSkipped++;
        else failed.push({file:r.file.name,name:"CV inbox",msg:res.error+(/cv_inbox/.test(res.error)?INBOX_HINT:"")});
        setProgress({done:i+1,total:todo.length});
        continue;
      }
      try{
        if(r.candId==="__new__"){
          const{is_cv,...parsed}=r.newCand;
          const payload={...parsed,skills:Array.isArray(parsed.skills)?parsed.skills:[],status:"New",initials:ini(parsed.name),
            notes:[parsed.notes,"Added from CV file: "+r.file.name].filter(Boolean).join("\n")};
          const{data:created,error:insErr}=await db.from("candidates").insert(payload).select("id,name,cv_path,cv_url").single();
          if(insErr)throw insErr;
          c=created;created.isNew=true;
        }
        const ext=(r.file.name.split(".").pop()||"pdf").toLowerCase();
        const path=`cvs/${c.id}_${Date.now()}.${ext}`;
        const{error:upErr}=await db.storage.from("candidate-cvs").upload(path,r.file,{upsert:true,contentType:r.file.type||undefined});
        if(upErr)throw upErr;
        const{data:urlData}=db.storage.from("candidate-cvs").getPublicUrl(path);
        const fullText=await extractFileText(r.file,r.file.name);
        const oldPath=cvStoragePath(c);
        const{error:dbErr}=await db.from("candidates")
          .update({cv_url:urlData?.publicUrl,cv_path:path,cv_filename:r.file.name,cv_text:fullText||null})
          .eq("id",c.id);
        if(dbErr)throw dbErr;
        if(oldPath&&oldPath!==path) await db.storage.from("candidate-cvs").remove([oldPath]);
        ok.push({file:r.file.name,name:c.name,isNew:!!c.isNew});
      }catch(err){ failed.push({file:r.file.name,name:c?.name,msg:err.message||String(err)}); }
      setProgress({done:i+1,total:todo.length});
    }
    setResults({ok,failed,inboxed,inboxSkipped});setStage("done");
    if(onDone)onDone();
  };

  const matched=items.filter(r=>r.candId);
  const noMatch=items.filter(r=>!r.candId);
  const unchecked=noMatch.filter(r=>r.snippet&&!r.tooBig&&!r.checked).length;
  const newCount=items.filter(r=>r.candId==="__new__"&&r.include).length;
  const shown=showNoMatch?items:matched;
  const ticked=items.filter(r=>r.include&&r.candId&&!r.tooBig).length;
  const confColour=s=>s>=3?"#1d9e75":s===2?"#8a6d00":"#a32d2d";

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget&&stage!=="reading"&&stage!=="attaching")onClose();}}>
    <div className="modal" style={{maxWidth:stage==="review"?900:500}}>
      <h3>Bulk CV match</h3>

      {stage==="pick"&&<>
        <p style={{fontSize:13,color:"var(--t2)",lineHeight:1.55,marginBottom:14}}>
          Select all the CVs in a folder at once (Ctrl + A in the file picker). Each one is read and matched to a candidate by name.
          You'll review every match before anything is saved.
        </p>
        <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx" style={{display:"none"}} onChange={readFiles}/>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button className="btn-o" onClick={onClose}>Cancel</button>
          <button className="btn-a" onClick={()=>fileRef.current&&fileRef.current.click()}>Choose files</button>
        </div>
      </>}

      {stage==="reading"&&<div style={{padding:"24px 0",textAlign:"center",fontSize:13,color:"var(--t2)"}}>
        <span className="spin"></span>Reading file {progress.done} of {progress.total}…
      </div>}

      {stage==="review"&&<>
        <p style={{fontSize:12,color:"var(--t2)",marginBottom:10,lineHeight:1.5}}>
          {matched.length} of {items.length} files matched a candidate{skipped>0?` (${skipped} repeat download${skipped>1?"s":""} ignored)`:""}.
          Check each row, change the person if needed, and untick anything that shouldn't be attached.
        </p>
        <div style={{overflowX:"auto",border:"0.5px solid var(--br)",borderRadius:8,maxHeight:"55vh",overflowY:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              <th className="th" style={{width:36}}></th>
              <th className="th">File</th>
              <th className="th">Candidate</th>
              <th className="th">Match</th>
            </tr></thead>
            <tbody>
              {shown.map(r=>{
                const c=byId[r.candId];
                return <tr key={r.key} style={{opacity:r.include?1:0.7}}>
                  <td className="td"><input type="checkbox" checked={r.include} disabled={!r.candId||r.tooBig}
                    onChange={e=>update(r.key,{include:e.target.checked})}/></td>
                  <td className="td" style={{maxWidth:260,wordBreak:"break-word",fontSize:12}}>
                    {r.file.name}
                    {r.note&&<div style={{fontSize:11,color:"var(--t3)",marginTop:2}}>{r.note}</div>}
                    {r.candId==="__new__"&&r.newCand&&<div style={{fontSize:11,color:"var(--t2)",marginTop:2}}>
                      {[r.newCand.role,r.newCand.location,r.newCand.email].filter(Boolean).join(" · ")||"No other details found"}</div>}
                    {c&&hasCv(c)&&r.include&&<div style={{fontSize:11,color:"#a32d2d",marginTop:2}}>Will replace {c.cv_filename||"their current CV"}</div>}
                  </td>
                  <td className="td">
                    <select value={r.candId} style={{fontSize:12,width:"100%",minWidth:180}}
                      onChange={e=>update(r.key,{candId:e.target.value,manual:e.target.value!=="__new__"&&e.target.value!=="__inbox__",include:!!e.target.value&&!r.tooBig})}>
                      <option value="">Skip this file</option>
                      <option value="__inbox__">📥 Keep in CV inbox for later</option>
                      {r.newCand&&<option value="__new__">➕ New candidate: {r.newCand.name}</option>}
                      {sorted.map(s=><option key={s.id} value={s.id}>{s.name}{hasCv(s)?" (has CV)":""}</option>)}
                    </select>
                  </td>
                  <td className="td" style={{fontSize:12,whiteSpace:"nowrap",color:r.manual?"var(--t2)":confColour(r.score)}}>
                    {r.candId==="__inbox__"?<span style={{color:"#993556"}}>📥 CV inbox</span>:r.candId==="__new__"?<span style={{color:"#1d6fa5"}}>New candidate</span>:r.manual?"Set by you":CV_CONF[r.score]}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginTop:8}}>
          {noMatch.length>0&&<button className="btn-o" style={{fontSize:11}} onClick={()=>setShowNoMatch(v=>!v)}>
            {showNoMatch?"Hide":"Show"} {noMatch.length} file{noMatch.length>1?"s":""} with no match
          </button>}
          {unchecked>0&&!finding&&<button className="btn-o" style={{fontSize:11}} onClick={findNew}
            title="Uses your Anthropic API key to read each unmatched file">
            ✦ Find new candidates in {unchecked} unmatched file{unchecked>1?"s":""}
          </button>}
          {finding&&<span style={{fontSize:12,color:"var(--t2)"}}><span className="spin"></span>Reading file {finding.done+1} of {finding.total}…</span>}
          {(()=>{const left=items.filter(r=>!r.candId&&!r.tooBig);return left.length>0&&!finding&&<button className="btn-o" style={{fontSize:11}}
            onClick={()=>{setItems(list=>list.map(r=>!r.candId&&!r.tooBig?{...r,candId:"__inbox__",include:true}:r));setShowNoMatch(true);}}
            title="Save them in the CV inbox until you create the candidates">📥 Store {left.length} unmatched in CV inbox</button>;})()}
        </div>
        {findErr&&<Err msg={"AI read stopped: "+findErr}/>}
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>
          <button className="btn-o" onClick={onClose}>Cancel</button>
          <button className="btn-a" disabled={!ticked||!!finding} onClick={attach}>
            {(()=>{const inb=items.filter(r=>r.include&&r.candId==="__inbox__").length;const att=ticked-inb;
              const parts=[newCount>0?`create ${newCount}`:"",att-0>0?`attach ${att} CV${att===1?"":"s"}`:"",inb>0?`store ${inb} in inbox`:""].filter(Boolean).join(" + ");
              return parts.charAt(0).toUpperCase()+parts.slice(1)||"Attach";})()}</button>
        </div>
      </>}

      {stage==="attaching"&&<div style={{padding:"24px 0",textAlign:"center",fontSize:13,color:"var(--t2)"}}>
        <span className="spin"></span>Attaching CV {progress.done} of {progress.total}…
      </div>}

      {stage==="done"&&results&&<>
        <p style={{fontSize:13,color:"var(--t1)",marginBottom:10}}>
          Attached {results.ok.length} CV{results.ok.length===1?"":"s"}
          {results.ok.some(o=>o.isNew)&&`, including ${results.ok.filter(o=>o.isNew).length} new candidate${results.ok.filter(o=>o.isNew).length===1?"":"s"}`}.
          {results.failed.length>0&&` ${results.failed.length} failed.`}
        </p>
        {results.inboxed>0&&<p style={{fontSize:13,color:"var(--t1)",marginBottom:10}}>
          📥 Stored {results.inboxed} CV{results.inboxed===1?"":"s"} in the CV inbox{results.inboxSkipped?` (${results.inboxSkipped} were already there)`:""}.{" "}
          <span style={{color:ACCENT,cursor:"pointer",textDecoration:"underline"}} onClick={()=>{onClose();window.dispatchEvent(new CustomEvent("nav",{detail:"cvinbox"}));}}>Open CV inbox →</span>
        </p>}
        {results.failed.length>0&&<div className="err">
          {results.failed.map((f,i)=><div key={i}>{f.file} → {f.name}: {f.msg}</div>)}
        </div>}
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
          <button className="btn-a" onClick={onClose}>Done</button>
        </div>
      </>}
    </div>
  </div>;
}
function CandidatesPage(){
  const [rows,setRows]=useState([]);const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");const [statusF,setStatusF]=useState("All");
  const [modal,setModal]=useState(false);const [editRow,setEditRow]=useState(null);
  const [err,setErr]=useState("");const [delId,setDelId]=useState(null);
  const [detailCand,setDetailCand]=useState(null);
  const [selected,setSelected]=useState(new Set());
  const [bulkStatus,setBulkStatus]=useState("");
  const [lastContacted,setLastContacted]=useState({});
  const [bulkCv,setBulkCv]=useState(false);
  const [taskFor,setTaskFor]=useState(null);
  const [taskMsg,setTaskMsg]=useState("");
  const [hotFor,setHotFor]=useState(null); // candidates being added to a hotlist
  // Ecology / GDPR filters
  const [showFilters,setShowFilters]=useState(false);
  const [licF,setLicF]=useState("");
  const [cieemF,setCieemF]=useState("");
  const [driveF,setDriveF]=useState(false);
  const [maxSal,setMaxSal]=useState("");
  const [sourceF,setSourceF]=useState("");
  const [reviewMode,setReviewMode]=useState(false);
  const [needsUpgrade,setNeedsUpgrade]=useState(false);

  const load=useCallback(async()=>{
    setLoading(true);
    // Deliberately NOT select("*") — that would pull every CV's full text
    // into the browser on every page load. CV text is only needed for the
    // server-side search, and the detail panel fetches the full row itself.
    const base="id,name,role,location,email,phone,status,experience,salary,notice,skills,notes,cv_url,cv_path,cv_filename,created_at,linkedin";
    const extra=",source,licences,cieem_level,driving_licence,salary_expect,current_employer";
    const[cRes,{data:acts}]=await Promise.all([
      allRows(()=>db.from("candidates").select(base+extra).order("created_at",{ascending:false}).order("id")),
      allRows(()=>db.from("activity_log").select("entity_id,created_at").order("created_at",{ascending:false}).order("id")),
    ]);
    let{data,error}=cRes;
    // New columns not added yet? Load without them so the page still works
    if(error&&/source|licences|cieem|driving|salary_expect|current_employer/i.test(error.message)){
      setNeedsUpgrade(true);
      ({data,error}=await allRows(()=>db.from("candidates").select(base).order("created_at",{ascending:false}).order("id")));
    }else setNeedsUpgrade(false);
    if(error)setErr(error.message);else setRows(data||[]);
    // Build last-contacted map
    const lc={};
    (acts||[]).forEach(a=>{if(!lc[a.entity_id])lc[a.entity_id]=a.created_at;});
    setLastContacted(lc);
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  // Listen for openCandidate event fired from Dashboard
  useEffect(()=>{
    // Check if there's a pending candidate queued before we mounted
    const pending=window._pendingOpenCandidate;
    if(pending){window._pendingOpenCandidate=null;setDetailCand(pending);}
    const h=e=>{if(e.detail){setDetailCand(e.detail);window._pendingOpenCandidate=null;}};
    window.addEventListener("openCandidate",h);
    return()=>window.removeEventListener("openCandidate",h);
  },[]);

  // Keyboard shortcut: N = add candidate
  useEffect(()=>{
    const h=e=>{
      if(e.key==="n"&&!e.metaKey&&!e.ctrlKey&&document.activeElement.tagName==="BODY"){
        setModal(true);
      }
    };
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[]);

  const del=async id=>{if(!confirm("Delete this candidate?"))return;setDelId(id);await db.from("candidates").delete().eq("id",id);setDelId(null);load();};

  const statuses=["All",...new Set(rows.map(r=>r.status).filter(Boolean))];
  const ALL_STATUSES=["New","Active","Pipeline","Interview","Offer stage","Placed","On hold","Closed"];

  // Deep search asks Postgres to look inside CV text as well as the fields on
  // screen. Quotes work for phrases, - excludes a word, OR broadens.
  const [deep,setDeep]=useState(false);
  const [deepIds,setDeepIds]=useState(null);
  const [deepBusy,setDeepBusy]=useState(false);
  const [deepErr,setDeepErr]=useState("");

  useEffect(()=>{
    if(!deep||!search.trim()){setDeepIds(null);setDeepErr("");return;}
    let cancelled=false;
    setDeepBusy(true);setDeepErr("");
    const t=setTimeout(async()=>{
      const{data,error}=await db.from("candidates")
        .select("id")
        .textSearch("search_vector",search.trim(),{type:"websearch",config:"english"})
        .limit(1000);
      if(cancelled)return;
      if(error){setDeepErr(error.message);setDeepIds(new Set());}
      else{setDeepIds(new Set((data||[]).map(r=>r.id)));}
      setDeepBusy(false);
    },350);
    return()=>{cancelled=true;clearTimeout(t);};
  },[deep,search]);

  // Index CVs that were uploaded before text extraction existed
  const [indexing,setIndexing]=useState(null);
  const indexCVs=async()=>{
    // rows no longer carries cv_text, so ask the database which CVs lack it
    const{data:pending}=await db.from("candidates")
      .select("id,cv_path,cv_url,cv_filename")
      .not("cv_path","is",null)
      .is("cv_text",null);
    const todo=pending||[];
    if(todo.length===0){alert("Every CV on file is already indexed.");return;}
    setIndexing({done:0,total:todo.length});
    for(let i=0;i<todo.length;i++){
      const c=todo[i];
      try{
        const{data,error}=await db.storage.from("candidate-cvs").download(cvStoragePath(c));
        if(!error&&data){
          const text=await extractFileText(data,c.cv_filename||cvStoragePath(c));
          if(text) await db.from("candidates").update({cv_text:text}).eq("id",c.id);
        }
      }catch(e){ console.warn("Could not index CV for",c.name,e); }
      setIndexing({done:i+1,total:todo.length});
    }
    setIndexing(null);
    load();
  };

  // GDPR: no contact (or added, if never contacted) for 2+ years
  const REVIEW_DAYS=730;
  const lastTouch=r=>lastContacted[r.id]||r.created_at;
  const isStale=r=>{const d=lastTouch(r);return d&&(Date.now()-new Date(d))/(864e5)>REVIEW_DAYS;};
  const staleCount=rows.filter(isStale).length;
  const noSourceCount=rows.filter(r=>!r.source).length;
  const maxSalNum=salaryNum(maxSal);
  const activeFilters=[licF,cieemF,driveF,maxSalNum,sourceF].filter(Boolean).length;

  const filtered=rows.filter(r=>{
    const ms=deep&&deepIds
      ?deepIds.has(r.id)
      :(!search||[r.name,r.role,r.current_employer,r.location,r.email].some(v=>v?.toLowerCase().includes(search.toLowerCase())));
    const mf=statusF==="All"||r.status===statusF;
    if(!(ms&&mf))return false;
    if(reviewMode&&!isStale(r))return false;
    if(licF){
      const L=r.licences||[];
      // "Bat (any)" style family filters, or an exact licence
      if(licF.endsWith("(any)")){if(!L.some(l=>l.startsWith(licF.replace(" (any)",""))))return false;}
      else if(!L.includes(licF))return false;
    }
    if(cieemF&&CIEEM_RANK(r.cieem_level)<CIEEM_RANK(cieemF))return false;
    if(cieemF&&!r.cieem_level)return false;
    if(driveF&&r.driving_licence!=="Yes")return false;
    if(maxSalNum){const se=r.salary_expect||salaryNum(r.salary);if(!se||se>maxSalNum)return false;}
    if(sourceF==="__none__"&&r.source)return false;
    if(sourceF&&sourceF!=="__none__"&&r.source!==sourceF)return false;
    return true;
  });
  const clearFilters=()=>{setLicF("");setCieemF("");setDriveF(false);setMaxSal("");setSourceF("");setReviewMode(false);};

  const toggleSelect=id=>setSelected(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleAll=()=>setSelected(s=>s.size===filtered.length?new Set():new Set(filtered.map(c=>c.id)));

  // Delete selected candidates, including their CV files (GDPR erasure)
  const bulkDelete=async()=>{
    if(!selected.size)return;
    if(!confirm(`Permanently delete ${selected.size} candidate${selected.size!==1?"s":""} and their CVs?\n\nThis can't be undone.`))return;
    const ids=[...selected];
    const paths=rows.filter(r=>selected.has(r.id)).map(cvStoragePath).filter(Boolean);
    if(paths.length)await db.storage.from("candidate-cvs").remove(paths);
    await db.from("hotlist_candidates").delete().in("candidate_id",ids);
    await db.from("job_candidates").delete().in("candidate_id",ids);
    const{error}=await db.from("candidates").delete().in("id",ids);
    if(error)setErr("Some couldn't be deleted: "+error.message);
    setSelected(new Set());load();
  };

  const bulkUpdateStatus=async()=>{
    if(!bulkStatus||selected.size===0)return;
    await Promise.all([...selected].map(id=>db.from("candidates").update({status:bulkStatus}).eq("id",id)));
    setSelected(new Set());setBulkStatus("");load();
  };

  const exportCSV=()=>{
    const toExport=selected.size>0?filtered.filter(c=>selected.has(c.id)):filtered;
    const headers=["Name","Role","Location","Email","Phone","Status","Experience","Salary","Salary expectation","Notice","Licences","CIEEM","Driving licence","Source","Skills","Notes"];
    const rows=[headers,...toExport.map(c=>[c.name,c.role,c.location,c.email,c.phone,c.status,c.experience,c.salary,c.salary_expect,c.notice,(c.licences||[]).join("; "),c.cieem_level,c.driving_licence,c.source,(c.skills||[]).join("; "),c.notes].map(v=>`"${(v||"").toString().replace(/"/g,'""')}"`))];
    const csv=rows.map(r=>r.join(",")).join("\n");
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download=`candidates_${new Date().toISOString().split("T")[0]}.csv`;
    a.click();
  };

  const daysSince=id=>{
    const d=lastContacted[id];
    if(!d)return null;
    return Math.floor((Date.now()-new Date(d))/(1000*60*60*24));
  };

  return <div>
    {modal&&<CandModal onClose={()=>setModal(false)} onSaved={load}/>}
    {hotFor&&<HotlistPicker cands={hotFor} onClose={()=>{setHotFor(null);setSelected(new Set());}}/>}
    {taskFor&&<AddTaskModal cand={taskFor} onClose={()=>setTaskFor(null)} onSaved={()=>{setTaskMsg(`Task added for ${taskFor.name}`);setTimeout(()=>setTaskMsg(""),3000);}}/>}
    {taskMsg&&<div style={{position:"fixed",bottom:20,right:20,zIndex:1200,background:"rgba(95,169,43,0.16)",border:"0.5px solid #97c459",color:"#3b6d11",borderRadius:8,padding:"10px 14px",fontSize:12,boxShadow:"0 4px 16px rgba(0,0,0,0.12)"}}>✓ {taskMsg} · <span style={{cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.dispatchEvent(new CustomEvent("nav",{detail:"tasks"}))}>View tasks</span></div>}
    {bulkCv&&<BulkCvMatch candidates={rows} onClose={()=>setBulkCv(false)} onDone={load}/>}
    {editRow&&<CandModal cand={editRow} onClose={()=>{setEditRow(null);}} onSaved={()=>{load();setDetailCand(null);}}/>}
    {detailCand&&<CandidateDetailPanel cand={detailCand} onClose={()=>setDetailCand(null)} onEdit={c=>{setDetailCand(null);setEditRow(c);}} onRefresh={load}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>Candidates ({filtered.length})</span>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <input type="text" placeholder={deep?"Search names, skills and CV text…":"Search… (or press N)"} value={search} onChange={e=>setSearch(e.target.value)} style={{width:deep?260:200}}/>
        <button className={deep?"btn-a":"btn-o"} style={{fontSize:12,padding:"6px 12px"}}
          onClick={()=>setDeep(d=>!d)}
          title="Also search the text inside uploaded CVs">
          {deepBusy?<><span className="spin"></span>Searching…</>:<><Icon n="search" size={13}/>Search CVs</>}
        </button>
        <select value={statusF} onChange={e=>setStatusF(e.target.value)} style={{width:"auto"}}>{statuses.map(s=><option key={s}>{s}</option>)}</select>
        <button className={showFilters||activeFilters?"btn-a":"btn-o"} style={{fontSize:12,padding:"6px 12px"}} onClick={()=>setShowFilters(v=>!v)}>
          <Icon n="list" size={13}/>Filters{activeFilters?` (${activeFilters})`:""}
        </button>
        <button className="btn-o" style={{fontSize:12}} onClick={exportCSV} title="Export to CSV"><Icon n="upload" size={13} style={{transform:"rotate(180deg)"}}/>Export CSV</button>
        <button className="btn-o" style={{fontSize:12}} onClick={()=>setBulkCv(true)} title="Match a batch of CV files to candidates"><Icon n="doc" size={13}/>Bulk CV match</button>
        <button className="btn-a" onClick={()=>setModal(true)}>+ Add candidate <span style={{opacity:0.6,fontSize:10,marginLeft:2}}>N</span></button>
      </div>
    </div>
    {deep&&<div style={{background:"rgba(95,169,43,0.10)",border:"0.5px solid rgba(95,169,43,0.35)",borderRadius:8,padding:"8px 14px",marginBottom:10,fontSize:12,color:"var(--t2)",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <span>Searching inside CV text. <strong>"bat licence"</strong> for an exact phrase, <strong>-junior</strong> to exclude, <strong>bats OR newts</strong> to broaden.</span>
      <span style={{flex:1}}/>
      {indexing
        ?<span style={{color:"var(--g-deep)"}}><span className="spin"></span>Indexing CV {indexing.done} of {indexing.total}…</span>
        :<button className="btn-o" style={{fontSize:11,padding:"3px 10px"}} onClick={indexCVs}>Index CVs uploaded earlier</button>}
    </div>}
    {deepErr&&<Err msg={deepErr}/>}

    {needsUpgrade&&<div className="err" style={{marginBottom:10}}>The new ecology and source fields aren't set up yet — run <strong>crm-upgrade.sql</strong> in Supabase, then refresh.</div>}

    {showFilters&&<div style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:10,alignItems:"end"}}>
        <div><label style={{fontSize:11,color:"var(--t2)",display:"block",marginBottom:4}}>Licence</label>
          <select value={licF} onChange={e=>setLicF(e.target.value)}>
            <option value="">Any</option>
            <option value="Bat (any)">🦇 Any bat licence</option>
            <option value="GCN (any)">🦎 Any GCN licence</option>
            {LICENCES.map(l=><option key={l} value={l}>{l}</option>)}
          </select></div>
        <div><label style={{fontSize:11,color:"var(--t2)",display:"block",marginBottom:4}}>CIEEM (at least)</label>
          <select value={cieemF} onChange={e=>setCieemF(e.target.value)}>
            <option value="">Any</option>{CIEEM_LEVELS.map(l=><option key={l}>{l}</option>)}
          </select></div>
        <div><label style={{fontSize:11,color:"var(--t2)",display:"block",marginBottom:4}}>Max salary expectation</label>
          <input type="text" value={maxSal} onChange={e=>setMaxSal(e.target.value)} placeholder="e.g. 40k"/></div>
        <div><label style={{fontSize:11,color:"var(--t2)",display:"block",marginBottom:4}}>Source</label>
          <select value={sourceF} onChange={e=>setSourceF(e.target.value)}>
            <option value="">Any</option><option value="__none__">⚠️ Not recorded ({noSourceCount})</option>
            {SOURCES.map(x=><option key={x}>{x}</option>)}
          </select></div>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--t2)",cursor:"pointer",paddingBottom:8}}>
          <input type="checkbox" checked={driveF} onChange={e=>setDriveF(e.target.checked)} style={{width:15,height:15,accentColor:ACCENT}}/> 🚗 Driving licence
        </label>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10,flexWrap:"wrap",fontSize:12}}>
        <button onClick={()=>setReviewMode(v=>!v)} className={reviewMode?"btn-a":"btn-o"} style={{fontSize:12,padding:"5px 12px"}}>
          🛡 GDPR review — no contact in 2+ years ({staleCount})
        </button>
        <span style={{flex:1}}/>
        {(activeFilters>0||reviewMode)&&<button onClick={clearFilters} style={{background:"none",border:"none",color:ACCENT,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>Clear filters</button>}
      </div>
      {reviewMode&&<div style={{marginTop:10,fontSize:12,color:"var(--t2)",lineHeight:1.55,background:"var(--bg2)",borderRadius:8,padding:"8px 12px"}}>
        These candidates haven't been contacted (or added) in over 2 years. Under UK GDPR you shouldn't keep personal data longer than you need it —
        either get back in touch (which logs fresh contact) or tick them and use <strong>Delete selected</strong>, which also removes their CVs.
      </div>}
    </div>}

    {selected.size>0&&<div style={{background:"rgba(95,169,43,0.10)",border:"0.5px solid rgba(95,169,43,0.35)",borderRadius:8,padding:"8px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <span style={{fontSize:13,fontWeight:500,color:ACCENT}}>{selected.size} selected</span>
      <select value={bulkStatus} onChange={e=>setBulkStatus(e.target.value)} style={{width:"auto",fontSize:12}}>
        <option value="">Change status…</option>
        {ALL_STATUSES.map(s=><option key={s}>{s}</option>)}
      </select>
      <button className="btn-a" style={{fontSize:12,padding:"5px 12px"}} onClick={bulkUpdateStatus} disabled={!bulkStatus}>Apply</button>
      <button className="btn-o" style={{fontSize:12,padding:"5px 10px"}} onClick={exportCSV}>⬇ Export selected</button>
      <button className="btn-o" style={{fontSize:12,padding:"5px 10px"}} onClick={()=>setHotFor(rows.filter(r=>selected.has(r.id)))}>🔥 Add to hotlist</button>
      <button className="btn-d" style={{fontSize:12,padding:"5px 10px"}} onClick={bulkDelete}>🗑 Delete selected</button>
      <button onClick={()=>setSelected(new Set())} style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",fontSize:12,marginLeft:"auto"}}>✕ Clear</button>
    </div>}
    <Err msg={err}/>
    <Panel title={`${filtered.length} records`}>
      {loading?<Spin/>:filtered.length===0
        ?(rows.length>0
          ?<div style={{padding:"36px 20px",textAlign:"center",color:"var(--t3)",fontSize:13}}>No candidates match these filters. <span onClick={()=>{clearFilters();setSearch("");setStatusF("All");}} style={{color:ACCENT,cursor:"pointer",textDecoration:"underline"}}>Clear filters</span></div>
          :<EmptyState icon="users" title="No candidates yet" sub="Add your first candidate to get started tracking your talent pool." action="+ Add candidate" onAction={()=>setModal(true)}/>)
        :<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:760}}>
          <colgroup>
            <col style={{width:36}}/>
            <col style={{width:"28%"}}/>
            <col style={{width:"33%"}}/>
            <col style={{width:"15%"}}/>
            <col style={{width:"11%"}}/>
            <col style={{width:"13%"}}/>
          </colgroup>
          <thead><tr>
            <th className="th"><input type="checkbox" checked={selected.size===filtered.length&&filtered.length>0} onChange={toggleAll} style={{cursor:"pointer"}}/></th>
            <th className="th">Candidate</th><th className="th">Role</th><th className="th">Location</th>
            <th className="th">Last contact</th><th className="th">Status</th>
          </tr></thead>
          <tbody>{filtered.map(c=>{
            const ds=daysSince(c.id);
            const lcColor=ds===null?"var(--t3)":ds>14?"#e24b4a":ds>7?"#ba7517":"#3b6d11";
            return <tr key={c.id} className="cand-row" style={{cursor:"pointer",background:selected.has(c.id)?"rgba(160,208,69,0.12)":""}} onClick={()=>setDetailCand(c)}>
            <td className="td" onClick={e=>{e.stopPropagation();toggleSelect(c.id);}}><input type="checkbox" checked={selected.has(c.id)} onClick={e=>e.stopPropagation()} onChange={()=>toggleSelect(c.id)} style={{cursor:"pointer"}}/></td>
            <td className="td"><div style={{display:"flex",alignItems:"center",gap:8}}><Av name={c.name}/><div style={{minWidth:0}}>
              <div title={c.name} style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--t1)"}}>{c.name}{hasCv(c)&&<span title="CV attached" style={{marginLeft:6,fontSize:9,fontWeight:700,letterSpacing:"0.5px",background:"rgba(95,169,43,0.16)",color:"var(--g-deep)",borderRadius:5,padding:"1px 5px",verticalAlign:"1px"}}>CV</span>}</div>
              {c.email&&<div style={{fontSize:11,color:"var(--t3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email}</div>}
            </div></div></td>
            <td className="td" title={c.role||""} style={{color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cleanTitle(c.role)||"—"}{c.current_employer&&<div style={{fontSize:11,color:"var(--t3)",overflow:"hidden",textOverflow:"ellipsis"}}>{c.current_employer}</div>}</td>
            <td className="td" style={{color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.location||"—"}</td>
            <td className="td"><span style={{fontSize:11,color:lcColor,fontWeight:ds!==null?500:400}}>{ds===null?"Never":ds===0?"Today":ds===1?"Yesterday":`${ds}d ago`}</span></td>
            <td className="td" style={{position:"relative",overflow:"visible"}}><Pill label={c.status||"New"}/>
              <div className="acts row-acts" onClick={e=>e.stopPropagation()}>
              {c.linkedin
                ?<a className="act li" href={c.linkedin} target="_blank" rel="noreferrer" title="Open LinkedIn profile">in</a>
                :<a className="act li-find" href={linkedinSearchUrl(c)} target="_blank" rel="noreferrer" title="No LinkedIn saved — search LinkedIn for them">in</a>}
              <button className="act hot" onClick={()=>setHotFor([c])} title="Add to hotlist"><IconFlame/></button>
              <button className="act task" onClick={()=>setTaskFor(c)} title="Add a task"><IconTask/></button>
              <button className="act" onClick={()=>setEditRow(c)} title="Edit candidate"><IconEdit/></button>
              <button className="act danger" onClick={()=>del(c.id)} disabled={delId===c.id} title="Delete candidate">{delId===c.id?<span className="spin" style={{margin:0}}></span>:<IconTrash/>}</button>
              </div></td>
          </tr>;})}
          </tbody>
        </table></div>}
    </Panel>
  </div>;
}

// ── Company Contact Modal ──────────────────────────────────────────────────
function ContactModal({contact, companyId, companyName, onClose, onSaved}){
  const blank={name:"",job_title:"",email:"",phone:"",linkedin:"",notes:""};
  const [f,setF]=useState(contact?{...blank,...contact,job_title:contact.role||contact.job_title||""}:blank);
  const [saving,setSaving]=useState(false);const [err,setErr]=useState("");
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const save=async()=>{
    if(!f.name.trim()){setErr("Name required");return;}
    setSaving(true);setErr("");
    // The contacts table calls the job title "role"
    const payload={name:f.name,email:f.email||null,phone:f.phone||null,notes:f.notes||null,role:f.job_title||null,linkedin:f.linkedin||null,company_id:companyId};
    const{error}=contact
      ?await db.from("contacts").update(payload).eq("id",contact.id)
      :await db.from("contacts").insert(payload);
    setSaving(false);
    if(error){setErr(error.message);return;}
    onSaved();onClose();
  };
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h3>{contact?"Edit contact":"Add contact"} {companyName&&<span style={{fontWeight:400,color:"var(--t2)"}}>— {companyName}</span>}</h3>
      <div className="fr2">
        <div><label>Full name *</label><input type="text" value={f.name} onChange={s("name")} placeholder="Jane Smith"/></div>
        <div><label>Job title</label><input type="text" value={f.job_title||""} onChange={s("job_title")} placeholder="Head of Ecology"/></div>
      </div>
      <div className="fr2">
        <div><label>Email</label><div style={{display:"flex",gap:6}}><input type="email" value={f.email||""} onChange={s("email")} placeholder="jane@company.com" style={{flex:1}}/>{f.email&&<CopyButton text={f.email}/>}</div></div>
        <div><label>Phone</label><input type="tel" value={f.phone||""} onChange={s("phone")} placeholder="+44 7700 000000"/></div>
      </div>
      <div className="fr"><label>LinkedIn URL</label>
        <div style={{display:"flex",gap:6}}>
          <input type="text" value={f.linkedin||""} onChange={s("linkedin")} placeholder="https://linkedin.com/in/username" style={{flex:1}}/>
          {f.linkedin&&<a href={f.linkedin} target="_blank" rel="noreferrer" style={{background:"#0a66c2",color:"#fff",borderRadius:7,padding:"7px 12px",fontSize:12,textDecoration:"none",whiteSpace:"nowrap",display:"flex",alignItems:"center"}}>Open ↗</a>}
        </div>
      </div>
      <div className="fr"><label>Notes</label><textarea value={f.notes||""} onChange={s("notes")} placeholder="Key contact notes…" style={{minHeight:70}}/></div>
      <Err msg={err}/>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
        <button className="btn-o" onClick={onClose}>Cancel</button>
        <button className="btn-a" onClick={save} disabled={saving}>{saving?<><span className="spin"></span>Saving…</>:"Save contact"}</button>
      </div>
    </div>
  </div>;
}

// ── Company Detail Panel ───────────────────────────────────────────────────
function CompanyDetailPanel({company, onClose, onEdit, onRefresh}){
  const [contacts,setContacts]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [contactModal,setContactModal]=useState(false);
  const [editContact,setEditContact]=useState(null);
  const c=company;
  // Terms of business document
  const tobRef=React.useRef(null);
  const [tobPath,setTobPath]=useState(company?.terms_doc_path||null);
  const [tobName,setTobName]=useState(company?.terms_doc_filename||null);
  const [tobUploading,setTobUploading]=useState(false);
  const [tobErr,setTobErr]=useState("");
  const [tobSigned,setTobSigned]=useState(!!company?.terms_signed);

  const uploadToB=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>10*1024*1024){setTobErr("File too large (max 10MB)");return;}
    setTobUploading(true);setTobErr("");
    const ext=(file.name.split(".").pop()||"pdf").toLowerCase();
    const path=`terms/${c.id}_${Date.now()}.${ext}`;
    const{error:upErr}=await db.storage.from("company-docs").upload(path,file,{upsert:true,contentType:file.type});
    if(upErr){setTobErr(upErr.message);setTobUploading(false);return;}
    // Uploading a signed document implies the terms are signed. The date is
    // left blank on purpose — the upload date is not the signature date.
    const{error:dbErr}=await db.from("companies")
      .update({terms_doc_path:path,terms_doc_filename:file.name,terms_signed:true}).eq("id",c.id);
    if(dbErr){setTobErr(dbErr.message);setTobUploading(false);return;}
    setTobPath(path);setTobName(file.name);setTobSigned(true);
    c.terms_doc_path=path;c.terms_doc_filename=file.name;c.terms_signed=true;
    setTobUploading(false);
    if(e.target)e.target.value="";
    if(onRefresh)onRefresh();
  };

  // The bucket is private, so generate a short-lived signed link on demand.
  // The tab is opened first, synchronously, so pop-up blockers don't stop it.
  const viewToB=async()=>{
    if(!tobPath)return;
    const tab=window.open("","_blank");
    const{data,error}=await db.storage.from("company-docs").createSignedUrl(tobPath,3600);
    if(error||!data?.signedUrl){setTobErr(error?.message||"Could not open document");if(tab)tab.close();return;}
    if(tab)tab.location.href=data.signedUrl; else window.location.href=data.signedUrl;
  };

  const removeToB=async()=>{
    if(!confirm("Remove the terms of business document for this company?"))return;
    if(tobPath) await db.storage.from("company-docs").remove([tobPath]);
    await db.from("companies").update({terms_doc_path:null,terms_doc_filename:null}).eq("id",c.id);
    setTobPath(null);setTobName(null);
    c.terms_doc_path=null;c.terms_doc_filename=null;
    if(onRefresh)onRefresh();
  };

  const loadContacts=useCallback(async()=>{
    setLoading(true);
    const[{data:ct},{data:jb}]=await Promise.all([
      db.from("contacts").select("*").eq("company_id",c.id).order("name"),
      db.from("jobs").select("id,title,status").eq("company_id",c.id).order("created_at",{ascending:false}),
    ]);
    setContacts(ct||[]);setJobs(jb||[]);setLoading(false);
  },[c.id]);

  useEffect(()=>{loadContacts();},[loadContacts]);

  const delContact=async id=>{
    if(!confirm("Remove this contact?"))return;
    await db.from("contacts").delete().eq("id",id);
    loadContacts();
  };

  const termsStr=c.fee_type==="percentage"&&c.fee_percentage?`${c.fee_percentage}% of salary`:c.fee_type==="fixed"&&c.fee_fixed?`Fixed £${parseFloat(c.fee_fixed).toLocaleString()}`:"Not set";

  return <>
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:500}}/>
    <div style={{position:"fixed",top:0,right:0,bottom:0,width:440,maxWidth:"95vw",background:"var(--bg)",zIndex:501,display:"flex",flexDirection:"column",boxShadow:"-8px 0 40px rgba(0,0,0,0.15)",overflowY:"auto"}}>
      {contactModal&&<ContactModal companyId={c.id} companyName={c.name} onClose={()=>setContactModal(false)} onSaved={loadContacts}/>}
      {editContact&&<ContactModal contact={editContact} companyId={c.id} companyName={c.name} onClose={()=>setEditContact(null)} onSaved={()=>{setEditContact(null);loadContacts();}}/>}
      {/* Header */}
      <div style={{padding:"20px 20px 16px",borderBottom:"0.5px solid var(--br)",position:"sticky",top:0,background:"var(--bg)",zIndex:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <button onClick={onClose} style={{background:"none",border:"0.5px solid var(--brm)",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",color:"var(--t2)"}}>✕ Close</button>
          <button className="btn-o" style={{fontSize:12,padding:"5px 12px"}} onClick={()=>onEdit(c)}>Edit</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <CoLogo company={c} size={52}/>
          <div>
            <div style={{fontWeight:600,fontSize:16,color:"var(--t1)"}}>{c.name}</div>
            <div style={{fontSize:13,color:"var(--t2)",marginTop:2}}>{c.industry||"No industry set"}</div>
            <div style={{marginTop:6}}><Pill label={c.status||"Active"}/></div>
          </div>
        </div>
      </div>
      {/* Body */}
      <div style={{padding:20,display:"flex",flexDirection:"column",gap:18,flex:1}}>
        {/* Client activity — calls, meetings, emails with this company */}
        <CompanyActivity company={c}/>
        <EmailHistory companyId={c.id}/>
        {/* Details */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:8}}>Details</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 16px"}}>
            {[["🌐 Website",c.website]].map(([l,v])=>v?<div key={l}><div style={{fontSize:11,color:"var(--t3)"}}>{l}</div><div style={{fontSize:13,color:"var(--t1)",marginTop:1,wordBreak:"break-all"}}>{v}</div></div>:null)}
          </div>
        </div>
        {/* Terms of business */}
        <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px"}}>Terms of business</div>
            <span style={{fontSize:10,fontWeight:500,borderRadius:10,padding:"2px 9px",
              background:tobSigned?"rgba(95,169,43,0.16)":"rgba(186,117,23,0.14)",color:tobSigned?"#3b6d11":"#854f0b"}}>
              {tobSigned?"✓ Signed":"Not signed"}
            </span>
          </div>
          <div style={{background:"var(--bg2)",borderRadius:8,padding:"12px 14px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px 16px"}}>
              {[
                ["Fee",termsStr],
                ["Rebate period",c.terms_rebate],
                ["Payment terms",c.terms_payment_days?`${c.terms_payment_days} days from invoice`:null],
                ["Invoice raised",c.terms_invoice_trigger],
                ["Date signed",fmtDate(c.terms_signed_date)],
              ].map(([l,v])=>v?<div key={l}>
                <div style={{fontSize:11,color:"var(--t3)"}}>{l}</div>
                <div style={{fontSize:13,color:"var(--t1)",marginTop:1}}>{v}</div>
              </div>:null)}
            </div>
            {/* Signed ToB document */}
            <div style={{marginTop:10,paddingTop:10,borderTop:"0.5px solid var(--br)"}}>
              <div style={{fontSize:11,color:"var(--t3)",marginBottom:5}}>Signed document</div>
              <input ref={tobRef} type="file" accept=".pdf,.doc,.docx" style={{display:"none"}} onChange={uploadToB}/>
              {tobPath
                ?<div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:180}}>📄 {tobName||"Terms of business"}</span>
                  <button onClick={viewToB} style={{background:"none",border:"0.5px solid var(--brm)",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",color:ACCENT}}>View ↗</button>
                  <button onClick={()=>tobRef.current&&tobRef.current.click()} disabled={tobUploading} style={{background:"none",border:"0.5px solid var(--brm)",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",color:"var(--t2)"}}>{tobUploading?"Uploading…":"Replace"}</button>
                  <button onClick={removeToB} style={{background:"none",border:"0.5px solid #f09595",borderRadius:6,padding:"3px 9px",fontSize:11,cursor:"pointer",color:"#a32d2d"}}>✕</button>
                </div>
                :<button onClick={()=>tobRef.current&&tobRef.current.click()} disabled={tobUploading} style={{background:"none",border:"1px dashed var(--brm)",borderRadius:7,padding:"9px 12px",fontSize:12,cursor:"pointer",color:"var(--t2)",width:"100%"}}>
                  {tobUploading?<><span className="spin"></span>Uploading…</>:"⬆ Upload signed ToB (PDF or Word)"}
                </button>}
              {c.terms_doc_url&&<div style={{marginTop:7}}>
                <a href={c.terms_doc_url} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:ACCENT,textDecoration:"none"}}>🔗 External link to terms →</a>
              </div>}
              {tobPath&&!c.terms_signed_date&&<div style={{fontSize:11,color:"var(--t3)",marginTop:6}}>
                Marked as signed. Add the date it was signed via Edit.
              </div>}
              {tobErr&&<div style={{fontSize:11,color:"#a32d2d",marginTop:6}}>{tobErr}</div>}
            </div>
            {c.terms_notes&&<div style={{marginTop:10,paddingTop:10,borderTop:"0.5px solid var(--br)"}}>
              <div style={{fontSize:11,color:"var(--t3)",marginBottom:2}}>Other terms</div>
              <div style={{fontSize:12,color:"var(--t1)",lineHeight:1.55,whiteSpace:"pre-wrap"}}>{c.terms_notes}</div>
            </div>}
            {!c.terms_rebate&&!c.terms_payment_days&&!c.terms_notes&&termsStr==="Not set"&&
              <div style={{fontSize:12,color:"var(--t3)",fontStyle:"italic",marginTop:4}}>No terms recorded yet — click Edit to add them.</div>}
          </div>
        </div>
        {/* Contacts */}
        <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px"}}>Contacts ({contacts.length})</div>
