// ─── JOB DESCRIPTION LIBRARY ──────────────────────────────────────────────
// JD files live in the PRIVATE "job-descriptions" bucket; text is stored in
// jd_text so the library can be searched.
function jdTitleFromFile(fname){
  return fname.replace(/\.[^.]+$/,"").replace(/(\s*\(\d+\))+\s*$/,"")
    .replace(/[_]+/g," ").replace(/\s+/g," ").replace(/\s*\bJD\b\s*$/i,"").trim()||fname;
}
async function openJdFile(path){
  if(!path)return;
  const tab=window.open("","_blank");
  const{data,error}=await db.storage.from("job-descriptions").createSignedUrl(path,3600);
  if(error||!data?.signedUrl){if(tab)tab.close();alert("Could not open file: "+(error?.message||"not found"));return;}
  if(tab)tab.location.href=data.signedUrl;else window.location.href=data.signedUrl;
}

function JdModal({jd,companies,jobs,onClose,onSaved}){
  const [f,setF]=useState({title:"",company_id:"",job_id:"",notes:"",jd_text:"",file_path:null,file_name:null});
  const [loading,setLoading]=useState(!!jd);
  const [saving,setSaving]=useState(false);
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const fileRef=React.useRef();

  useEffect(()=>{
    if(!jd)return;
    db.from("job_descriptions").select("*").eq("id",jd.id).single().then(({data,error})=>{
      if(error)setErr(error.message);
      else setF({title:data.title||"",company_id:data.company_id||"",job_id:data.job_id||"",notes:data.notes||"",
        jd_text:data.jd_text||"",file_path:data.file_path,file_name:data.file_name});
      setLoading(false);
    });
  },[jd]);

  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const jobList=f.company_id?jobs.filter(j=>String(j.company_id)===String(f.company_id)):jobs;

  const pickFile=async(e)=>{
    const file=e.target.files[0];e.target.value="";
    if(!file)return;
    if(file.size>10*1024*1024){setErr("File too large (max 10MB)");return;}
    setBusy("Uploading…");setErr("");
    const ext=(file.name.split(".").pop()||"pdf").toLowerCase();
    const path=`jds/${Date.now()}.${ext}`;
    const{error}=await db.storage.from("job-descriptions").upload(path,file,{upsert:true,contentType:file.type||undefined});
    if(error){setErr(error.message);setBusy("");return;}
    const text=await extractFileText(file,file.name);
    const old=f.file_path;
    setF(p=>({...p,file_path:path,file_name:file.name,
      title:p.title||jdTitleFromFile(file.name),
      jd_text:p.jd_text&&!confirm("Replace the text below with the text from this file?")?p.jd_text:(text||p.jd_text)}));
    if(old&&jd) await db.storage.from("job-descriptions").remove([old]);
    setBusy("");
  };

  const save=async()=>{
    if(!f.title.trim()){setErr("Give the JD a title");return;}
    setSaving(true);setErr("");
    const payload={title:f.title.trim(),company_id:f.company_id||null,job_id:f.job_id||null,notes:f.notes||null,
      jd_text:f.jd_text||null,file_path:f.file_path||null,file_name:f.file_name||null};
    const{error}=jd?await db.from("job_descriptions").update(payload).eq("id",jd.id):await db.from("job_descriptions").insert(payload);
    setSaving(false);
    if(error){setErr(error.message);return;}
    onSaved();onClose();
  };

  const copyText=async()=>{
    try{await navigator.clipboard.writeText(f.jd_text||"");setMsg("Text copied");setTimeout(()=>setMsg(""),2000);}
    catch(e){setErr("Couldn't copy — select the text and press Ctrl + C instead");}
  };
  const pushToJob=async()=>{
    const job=jobs.find(j=>String(j.id)===String(f.job_id));
    if(!job)return;
    if(!confirm(`Replace the description on "${job.title}" with this JD's text?`))return;
    const{error}=await db.from("jobs").update({description:f.jd_text||""}).eq("id",job.id);
    if(error)setErr(error.message);else{setMsg("Copied to "+job.title);setTimeout(()=>setMsg(""),2500);}
  };

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget&&!busy&&!saving)onClose();}}>
    <div className="modal" style={{maxWidth:720}}>
      <h3>{jd?"Job description":"New job description"}</h3>
      {loading?<Spin/>:<div className="fr">
        <div style={{marginBottom:10}}><label>Title *</label>
          <input type="text" value={f.title} onChange={s("title")} placeholder="Senior Ecologist – Bristol"/></div>
        <div className="fr2">
          <div><label>Company</label>
            <select value={f.company_id} onChange={e=>setF(p=>({...p,company_id:e.target.value,job_id:""}))}>
              <option value="">None</option>
              {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select></div>
          <div><label>Linked job</label>
            <select value={f.job_id} onChange={s("job_id")}>
              <option value="">None</option>
              {jobList.map(j=><option key={j.id} value={j.id}>{j.title}{j.companies?.name?` (${j.companies.name})`:""}</option>)}
            </select></div>
        </div>
        <div style={{marginBottom:10}}><label>File</label>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {f.file_path
              ?<><span style={{fontSize:12,color:"var(--t1)"}}>📄 {f.file_name}</span>
                <button className="btn-o" onClick={()=>openJdFile(f.file_path)}>Open</button>
                <button className="btn-o" onClick={()=>fileRef.current.click()} disabled={!!busy}>Replace</button></>
              :<button className="btn-o" onClick={()=>fileRef.current.click()} disabled={!!busy}>⬆ Upload PDF or Word file</button>}
            {busy&&<span style={{fontSize:12,color:"var(--t3)"}}><span className="spin"></span>{busy}</span>}
          </div>
          <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" style={{display:"none"}} onChange={pickFile}/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <label style={{marginBottom:0}}>Description text</label>
            <div style={{display:"flex",gap:6}}>
              <button className="btn-o" style={{fontSize:11,padding:"3px 10px"}} onClick={copyText} disabled={!f.jd_text}>Copy text</button>
              {f.job_id&&<button className="btn-o" style={{fontSize:11,padding:"3px 10px"}} onClick={pushToJob} disabled={!f.jd_text}>Copy to linked job</button>}
            </div>
          </div>
          <textarea value={f.jd_text} onChange={s("jd_text")} placeholder="Paste the job description here, or upload a file above to fill this in"
            style={{minHeight:260,lineHeight:1.5}}/>
        </div>
        <div style={{marginBottom:10}}><label>Notes</label>
          <input type="text" value={f.notes} onChange={s("notes")} placeholder="Salary band, hiring manager, anything else"/></div>
        {msg&&<div style={{fontSize:12,color:"#1d9e75",marginBottom:6}}>{msg}</div>}
        <Err msg={err}/>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:12}}>
          <button className="btn-o" onClick={onClose} disabled={!!busy||saving}>Cancel</button>
          <button className="btn-a" onClick={save} disabled={!!busy||saving}>{saving?"Saving…":"Save"}</button>
        </div>
      </div>}
    </div>
  </div>;
}

function JDLibraryPage(){
  const [rows,setRows]=useState([]);
  const [companies,setCompanies]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState("");
  const [search,setSearch]=useState("");
  const [textHits,setTextHits]=useState(null);
  const [modal,setModal]=useState(null); // null | "new" | jd row
  const [upload,setUpload]=useState(null);
  const bulkRef=React.useRef();

  const load=useCallback(async()=>{
    setLoading(true);
    const[{data,error},{data:co},{data:jb}]=await Promise.all([
      db.from("job_descriptions").select("id,created_at,title,company_id,job_id,notes,file_path,file_name,companies(name),jobs(title)").order("created_at",{ascending:false}),
      db.from("companies").select("id,name").order("name"),
      db.from("jobs").select("id,title,company_id,companies(name)").order("title"),
    ]);
    if(error)setErr(error.message.includes("job_descriptions")?"The job descriptions table isn't set up yet — run the setup SQL in Supabase first.":error.message);
    else setRows(data||[]);
    setCompanies(co||[]);setJobs(jb||[]);
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  // Search inside JD text on the server as well as the titles on screen
  useEffect(()=>{
    const q=search.trim().replace(/[%,()*]/g," ").trim();
    if(q.length<2){setTextHits(null);return;}
    const t=setTimeout(async()=>{
      const{data}=await db.from("job_descriptions").select("id").ilike("jd_text",`%${q}%`).limit(500);
      setTextHits(new Set((data||[]).map(r=>r.id)));
    },300);
    return()=>clearTimeout(t);
  },[search]);

  const bulkUpload=async(e)=>{
    const all=[...(e.target.files||[])];e.target.value="";
    const seen={};all.forEach(f=>{const k=cvBaseName(f.name);if(!seen[k]||f.lastModified>seen[k].lastModified)seen[k]=f;});
    const files=Object.values(seen);
    if(!files.length)return;
    setUpload({done:0,total:files.length,failed:[]});
    const failed=[];
    for(let i=0;i<files.length;i++){
      const file=files[i];
      try{
        if(file.size>10*1024*1024)throw new Error("over 10MB");
        const ext=(file.name.split(".").pop()||"pdf").toLowerCase();
        const path=`jds/${Date.now()}_${i}.${ext}`;
        const{error:upErr}=await db.storage.from("job-descriptions").upload(path,file,{upsert:true,contentType:file.type||undefined});
        if(upErr)throw upErr;
        const text=await extractFileText(file,file.name);
        const{error:dbErr}=await db.from("job_descriptions").insert({title:jdTitleFromFile(file.name),file_path:path,file_name:file.name,jd_text:text||null});
        if(dbErr)throw dbErr;
      }catch(er){failed.push(file.name+": "+(er.message||er));}
      setUpload({done:i+1,total:files.length,failed});
      await new Promise(r=>setTimeout(r,0));
    }
    setUpload(failed.length?{done:files.length,total:files.length,failed}:null);
    load();
  };

  const del=async(r)=>{
    if(!confirm(`Delete "${r.title}"?`))return;
    if(r.file_path)await db.storage.from("job-descriptions").remove([r.file_path]);
    await db.from("job_descriptions").delete().eq("id",r.id);
    load();
  };

  const q=search.trim().toLowerCase();
  const filtered=rows.filter(r=>!q||
    [r.title,r.companies?.name,r.jobs?.title,r.notes,r.file_name].some(v=>v?.toLowerCase().includes(q))||
    (textHits&&textHits.has(r.id)));

  return <div>
    {modal&&<JdModal jd={modal==="new"?null:modal} companies={companies} jobs={jobs} onClose={()=>setModal(null)} onSaved={load}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>Job descriptions ({filtered.length})</span>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <input type="text" placeholder="Search titles and JD text…" value={search} onChange={e=>setSearch(e.target.value)} style={{width:240}}/>
        <button className="btn-o" style={{fontSize:12}} onClick={()=>bulkRef.current.click()} disabled={!!upload&&upload.done<upload.total}>⬆ Upload JDs</button>
        <input ref={bulkRef} type="file" multiple accept=".pdf,.doc,.docx" style={{display:"none"}} onChange={bulkUpload}/>
        <button className="btn-a" onClick={()=>setModal("new")}>+ New JD</button>
      </div>
    </div>
    {upload&&upload.done<upload.total&&<div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}><span className="spin"></span>Uploading {upload.done+1} of {upload.total}…</div>}
    {upload&&upload.failed.length>0&&upload.done===upload.total&&<div className="err" style={{marginBottom:10}}>
      {upload.failed.map((m,i)=><div key={i}>{m}</div>)}
      <button className="btn-o" style={{fontSize:11,marginTop:6}} onClick={()=>setUpload(null)}>Dismiss</button>
    </div>}
    <Err msg={err}/>
    {loading?<Spin/>:
    rows.length===0&&!err?<div style={{textAlign:"center",padding:"50px 20px",color:"var(--t2)",fontSize:13,background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:12}}>
      <div style={{fontSize:28,marginBottom:8}}>📑</div>
      No job descriptions yet. Upload JD files, or add one by pasting its text.
    </div>:
    <div style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:12,overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th className="th">Title</th><th className="th">Company</th><th className="th">Linked job</th><th className="th">File</th><th className="th">Added</th><th className="th"></th>
        </tr></thead>
        <tbody>{filtered.map(r=><tr key={r.id} style={{cursor:"pointer"}} onClick={()=>setModal(r)}
          onMouseOver={e=>e.currentTarget.style.background="var(--bg2)"} onMouseOut={e=>e.currentTarget.style.background=""}>
          <td className="td" style={{fontWeight:500,color:ACCENT}}>{r.title}
            {r.notes&&<div style={{fontSize:11,color:"var(--t3)",fontWeight:400,marginTop:2}}>{r.notes}</div>}</td>
          <td className="td">{r.companies?.name||"—"}</td>
          <td className="td">{r.jobs?.title||"—"}</td>
          <td className="td">{r.file_path
            ?<button className="btn-o" style={{fontSize:11,padding:"3px 10px"}} onClick={e=>{e.stopPropagation();openJdFile(r.file_path);}}>📄 Open</button>
            :<span style={{fontSize:12,color:"var(--t3)"}}>Text only</span>}</td>
          <td className="td" style={{fontSize:12,color:"var(--t2)",whiteSpace:"nowrap"}}>{fmtStamp(r.created_at)}</td>
          <td className="td" style={{textAlign:"right"}}><button className="btn-d" style={{fontSize:11}} onClick={e=>{e.stopPropagation();del(r);}}>Del</button></td>
        </tr>)}</tbody>
      </table></div>
    </div>}
  </div>;
}

// ─── CV INBOX ──────────────────────────────────────────────────────────────
// CVs that don't belong to a candidate yet. Files sit in the private
// candidate-cvs bucket under inbox/, with a row in cv_inbox, until you
// create the candidate (or attach the CV to an existing one).
const INBOX_HINT=" — run cv-inbox-setup.sql in Supabase first.";

// "Jane_Smith_CV_2026 (1).pdf" → "Jane Smith"
function guessNameFromFile(fname,text){
  const stem=(fname||"").replace(/\.[^.]+$/,"").replace(/(\s*\(\d+\))+$/,"")
    .replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[_\-.+]+/g," ");
  const junk=/^(cv|resume|résumé|curriculum|vitae|updated?|final|new|latest|copy|draft|v\d+|\d+|ecologist|ecology|senior|principal|consultant|my|of|the|and|for|to)$/i;
  const words=stem.split(/\s+/).filter(w=>w&&!junk.test(w)&&/^[a-zA-Z'’]+$/.test(w));
  const tc=w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  if(words.length>=2&&words.length<=4)return words.map(tc).join(" ");
  // Fall back to the first two or three capitalised words of the CV text
  // (same line only, and skip all-caps credentials like MCIEEM)
  const m=(text||"").slice(0,200).match(/^\s*([A-Z][a-z][a-zA-Z'’-]*(?:[ \t]+[A-Z][a-z][a-zA-Z'’-]*){1,2})/);
  return m?m[1]:"";
}

// Put one file into the inbox. Returns {ok,skipped,error}
async function storeInInbox(file,knownText){
  const{data:dupe}=await db.from("cv_inbox").select("id").eq("file_name",file.name).limit(1);
  if(dupe&&dupe.length)return{skipped:true};
  const ext=(file.name.split(".").pop()||"pdf").toLowerCase();
  const path=`inbox/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const{error:upErr}=await db.storage.from("candidate-cvs").upload(path,file,{upsert:true,contentType:file.type||undefined});
  if(upErr)return{error:upErr.message};
  const text=knownText||await extractFileText(file,file.name);
  const{error}=await db.from("cv_inbox").insert({file_path:path,file_name:file.name,cv_text:text||null,guess_name:guessNameFromFile(file.name,text)||null});
  if(error){await db.storage.from("candidate-cvs").remove([path]);return{error:error.message};}
  return{ok:true};
}

// Move an inbox CV onto a candidate's record (replacing any CV they already have)
async function attachInboxCv(item,candId){
  if(!item.file_path){await db.from("cv_inbox").delete().eq("id",item.id);return;}
  const{data:c}=await db.from("candidates").select("id,cv_path,cv_url").eq("id",candId).single();
  const oldPath=cvStoragePath(c);
  const{error}=await db.from("candidates").update({cv_path:item.file_path,cv_url:null,cv_filename:item.file_name,cv_text:item.cv_text||null}).eq("id",candId);
  if(error)throw error;
  if(oldPath&&oldPath!==item.file_path)await db.storage.from("candidate-cvs").remove([oldPath]);
  await db.from("cv_inbox").delete().eq("id",item.id);
}

function CvInboxPage(){
  const [items,setItems]=useState([]);
  const [cands,setCands]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const [q,setQ]=useState("");
  const [upload,setUpload]=useState(null);
  const [creating,setCreating]=useState(null);   // {item, initial}
  const [parsing,setParsing]=useState(null);     // item id being read by AI
  const [attachFor,setAttachFor]=useState(null); // item
  const [attachPick,setAttachPick]=useState("");
  const [preview,setPreview]=useState(null);     // item
  const fileRef=React.useRef();

  const load=useCallback(async()=>{
    setLoading(true);
    const[{data,error},{data:c}]=await Promise.all([
      db.from("cv_inbox").select("id,created_at,file_path,file_name,guess_name,cv_text,source,form_type,email,phone,job_title,job_url,message").order("created_at",{ascending:false}),
      allRows(()=>db.from("candidates").select("id,name,role,location,cv_path,cv_url").order("name").order("id")),
    ]);
    if(error)setErr(/cv_inbox/.test(error.message)?"The CV inbox isn't set up yet"+INBOX_HINT:error.message);
    else{setErr("");setItems(data||[]);}
    setCands(c||[]);setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),3500);};

  // Name match against existing candidates (first + last name)
  const byName={};
  cands.forEach(c=>{const p=cvNameParts(c.name);if(p)(byName[p.first+" "+p.last]=byName[p.first+" "+p.last]||[]).push(c);});
  const matchFor=it=>{const p=cvNameParts(it.guess_name||"");return p?(byName[p.first+" "+p.last]||[])[0]:null;};

  const uploadFiles=async e=>{
    const files=[...(e.target.files||[])].filter(f=>/\.(pdf|docx?)$/i.test(f.name));e.target.value="";
    if(!files.length)return;
    let ok=0,skip=0;const failed=[];
    setUpload({done:0,total:files.length});
    for(let i=0;i<files.length;i++){
      const f=files[i];
      if(f.size>10*1024*1024){failed.push(f.name+": over 10MB");}
      else{const r=await storeInInbox(f);if(r.ok)ok++;else if(r.skipped)skip++;else failed.push(f.name+": "+r.error);}
      setUpload({done:i+1,total:files.length});
      await new Promise(r=>setTimeout(r,0));
    }
    setUpload(null);
    if(failed.length)setErr(failed.join(" · ")+(failed.some(x=>/cv_inbox/.test(x))?INBOX_HINT:""));
    flash(`Added ${ok} CV${ok!==1?"s":""} to the inbox${skip?` · ${skip} already there`:""}`);
    load();
  };

  const open=async it=>{
    const tab=window.open("","_blank");
    const{data,error}=await db.storage.from("candidate-cvs").createSignedUrl(it.file_path,3600);
    if(error||!data?.signedUrl){if(tab)tab.close();setErr("Could not open: "+(error?.message||"not found"));return;}
    if(tab)tab.location.href=data.signedUrl;else window.location.href=data.signedUrl;
  };

  const remove=async it=>{
    if(!confirm(`Delete "${it.guess_name||it.file_name}" from the inbox?${it.file_path?" The CV file is removed for good.":""}`))return;
    if(it.file_path)await db.storage.from("candidate-cvs").remove([it.file_path]);
    await db.from("cv_inbox").delete().eq("id",it.id);
    load();
  };

  // Read the CV with AI (if a key is set) to pre-fill the new candidate form
  // Website CVs arrive without extracted text: read the file once and keep the text
  const ensureText=async it=>{
    if(it.cv_text||!it.file_path)return it.cv_text;
    try{
      const{data}=await db.storage.from("candidate-cvs").download(it.file_path);
      if(!data)return null;
      const t=await extractFileText(new File([data],it.file_name||"cv.pdf",{type:data.type}),it.file_name||"cv.pdf");
      if(t){it.cv_text=t;await db.from("cv_inbox").update({cv_text:t}).eq("id",it.id);}
      return t;
    }catch(e){return null;}
  };

  const startCreate=async it=>{
    const web=it.source==="website";
    const webNote=web?[it.form_type==="apply"?`Applied via website for: ${it.job_title||"a role"}`:"Registered CV via website",it.message?`Message: ${it.message}`:null].filter(Boolean).join("\n"):null;
    let initial={name:it.guess_name||"",email:it.email||"",phone:it.phone||"",source:web?"Website":"",notes:[webNote,it.file_name?`CV: ${it.file_name}`:null].filter(Boolean).join("\n")};
    if(web&&!it.cv_text&&it.file_path){setParsing(it.id);await ensureText(it);setParsing(null);}
    if(getKey()&&it.cv_text){
      setParsing(it.id);
      try{
        let raw="";
        await claude("You are a CV parser. Extract details from this CV. Respond ONLY with a JSON object (no markdown) with keys: name, role, email, phone, location, experience, salary, notice, skills (array of strings), notes (2-sentence summary). Use null for unknown fields.",
          "CV FILENAME: "+it.file_name+"\n\nCV TEXT:\n"+it.cv_text.slice(0,6000),c=>{raw+=c;});
        const m=raw.match(/\{[\s\S]*\}/);const o=m?JSON.parse(m[0]):{};
        Object.keys(o).forEach(k=>{if(o[k]===null)delete o[k];});
        initial={...initial,...o,email:it.email||o.email||"",phone:it.phone||o.phone||"",name:it.guess_name||o.name||"",skills:Array.isArray(o.skills)?o.skills.join(", "):(o.skills||""),notes:[webNote,o.notes,it.file_name?`CV: ${it.file_name}`:null].filter(Boolean).join("\n")};
      }catch(e){/* fall back to the guessed name */}
      setParsing(null);
    }
    setCreating({item:it,initial});
  };

  const doAttach=async(it,candId,name)=>{
    try{await attachInboxCv(it,candId);flash(`CV attached to ${name}`);setAttachFor(null);setAttachPick("");load();}
    catch(e){setErr(e.message);}
  };

  const ql=q.trim().toLowerCase();
  const shown=items.filter(it=>!ql||[it.file_name,it.guess_name,it.cv_text,it.email,it.job_title,it.message].some(v=>(v||"").toLowerCase().includes(ql)));
  const webCount=items.filter(it=>it.source==="website").length;

  return <div>
    {creating&&<CandModal initial={creating.initial} onClose={()=>setCreating(null)}
      onSaved={async row=>{if(row?.id){await attachInboxCv(creating.item,row.id);flash(`Created ${row.name} with their CV attached`);}load();}}/>}

    {attachFor&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setAttachFor(null);}}>
      <div className="modal" style={{maxWidth:440}}>
        <h3>Attach to an existing candidate</h3>
        <div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}>📄 {attachFor.file_name}</div>
        <select value={attachPick} onChange={e=>setAttachPick(e.target.value)}>
          <option value="">Choose a candidate…</option>
          {cands.map(c=><option key={c.id} value={c.id}>{c.name}{c.role?` — ${c.role}`:""}{hasCv(c)?" (has a CV — will replace)":""}</option>)}
        </select>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <button className="btn-o" onClick={()=>setAttachFor(null)}>Cancel</button>
          <button className="btn-a" disabled={!attachPick} onClick={()=>doAttach(attachFor,attachPick,cands.find(c=>c.id===attachPick)?.name)}>Attach CV</button>
        </div>
      </div>
    </div>}

    {preview&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setPreview(null);}}>
      <div className="modal" style={{maxWidth:640}}>
        <h3>{preview.guess_name||preview.file_name}</h3>
        <div style={{fontSize:12,color:"var(--t3)",marginBottom:8}}>📄 {preview.file_name||"No CV attached"}</div>
        {preview.source==="website"&&<div style={{fontSize:12,color:"var(--t1)",lineHeight:1.6,marginBottom:8}}>
          {preview.job_title&&<div><strong>Applied for:</strong> {preview.job_title}</div>}
          {preview.email&&<div><strong>Email:</strong> {preview.email}</div>}
          {preview.phone&&<div><strong>Phone:</strong> {preview.phone}</div>}
          {preview.message&&<div style={{whiteSpace:"pre-wrap"}}><strong>Message:</strong> {preview.message}</div>}
        </div>}
        <div style={{fontSize:12,color:"var(--t1)",lineHeight:1.6,whiteSpace:"pre-wrap",background:"var(--bg2)",borderRadius:8,padding:"10px 12px",maxHeight:"55vh",overflowY:"auto"}}>
          {preview.cv_text?preview.cv_text.slice(0,4000)+(preview.cv_text.length>4000?"…":""):"No readable text — this may be a scanned CV. Use Open to view it."}
        </div>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          {preview.file_path&&<button className="btn-o" onClick={()=>open(preview)}>Open file ↗</button>}
          <button className="btn-a" onClick={()=>setPreview(null)}>Close</button>
        </div>
      </div>
    </div>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>CV inbox ({items.length}){webCount>0&&<span style={{fontSize:11,fontWeight:600,background:"#e6f2dd",color:"#3b6d11",borderRadius:4,padding:"2px 7px",marginLeft:8}}>🌐 {webCount} from website</span>}</span>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <input type="text" placeholder="Search names, files and CV text…" value={q} onChange={e=>setQ(e.target.value)} style={{width:240}}/>
        <button className="btn-a" onClick={()=>fileRef.current.click()} disabled={!!upload}>⬆ Upload CVs</button>
        <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx" style={{display:"none"}} onChange={uploadFiles}/>
      </div>
    </div>
    <div style={{fontSize:12,color:"var(--t2)",marginBottom:12,lineHeight:1.5}}>
      CVs waiting for a candidate record. Applications and CV registrations from gaia-search.com now go straight into Candidates (source: Website). Upload CVs here, or use <strong>📎 Bulk CV match</strong> on Candidates and store the unmatched ones.
      When you're ready, <strong>Create candidate</strong> reads the CV and fills in the form for you.
    </div>
    {upload&&<div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}><span className="spin"></span>Uploading {upload.done} of {upload.total}…</div>}
    {msg&&<div style={{background:"rgba(95,169,43,0.16)",border:"0.5px solid #97c459",color:"#3b6d11",borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:10}}>✓ {msg}</div>}
    <Err msg={err}/>

    {loading?<Spin/>:items.length===0&&!err
      ?<div style={{textAlign:"center",padding:"50px 20px",color:"var(--t2)",fontSize:13,background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:12}}>
        <div style={{fontSize:30,marginBottom:8}}>📥</div>
        Your CV inbox is empty.<br/><span style={{fontSize:12,color:"var(--t3)"}}>Upload CVs here, or store unmatched files from Bulk CV match.</span>
      </div>
      :<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {shown.map(it=>{
          const match=matchFor(it);
          return <div key={it.id} style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>

            <div style={{flex:1,minWidth:200}}>
              <div style={{fontWeight:600,fontSize:13,color:"var(--t1)"}}>{it.guess_name||<span style={{color:"var(--t3)",fontWeight:400}}>Name not found</span>}</div>

              {match&&<div style={{fontSize:11,color:"#185fa5",marginTop:3}}>Possible match: <strong>{match.name}</strong>{match.role?` · ${match.role}`:""}{hasCv(match)?" (already has a CV)":""}</div>}

              <button className={match?"btn-o":"btn-a"} style={{fontSize:12,padding:"5px 12px"}} disabled={parsing===it.id} onClick={()=>startCreate(it)}>
                {parsing===it.id?<><span className="spin"></span>Reading CV…</>:"✦ Create candidate"}
              </button>
              <button className="btn-o" style={{fontSize:12}} onClick={()=>{setAttachFor(it);setAttachPick(match?.id||"");}}>Attach to…</button>

                <button className="act" onClick={async()=>{if(it.source==="website"&&!it.cv_text&&it.file_path){setParsing(it.id);await ensureText(it);setParsing(null);}setPreview({...it});}} title="Preview CV text"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                {it.file_path&&<button className="act" onClick={()=>open(it)} title="Open file"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>}
                <button className="act danger" onClick={()=>remove(it)} title="Delete from inbox"><IconTrash/></button>
              </span>
            </div>
          </div>;
        })}
        {shown.length===0&&items.length>0&&<div style={{padding:"24px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>Nothing in the inbox matches "{q}".</div>}
      </div>}
  </div>;
}

                </div>
                <div style={{fontSize:11,color:"var(--t2)",marginTop:3}}><a href={"mailto:"+r.email} style={{color:"var(--t2)"}}>{r.email}</a>{r.phone?" · "+r.phone:""}</div>
                <div style={{fontSize:12,color:"var(--t1)",marginTop:8,lineHeight:1.6}}>
                  {Object.keys(d).filter(k=>d[k]!==""&&d[k]!=null).sort((a,b)=>{const O=["Referred person","Role / specialism","Their email","Their phone","Their LinkedIn","Relationship","Notes","Reward preference","Background","About them"];const ia=O.indexOf(a),ib=O.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);}).map(k=><div key={k}><span style={{color:"var(--t3)"}}>{k}:</span> {/^https?:\/\//.test(String(d[k]))?<a href={d[k]} target="_blank" rel="noopener" style={{color:ACCENT}}>{d[k]}</a>:<span style={{whiteSpace:"pre-wrap"}}>{String(d[k])}</span>}</div>)}
                </div>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                {r.form_type==="refer"&&!r.handled&&<button className="btn-a" style={{fontSize:12,padding:"5px 12px"}} onClick={()=>createFromReferral(r)}>✦ Create candidate</button>}
                <button className="btn-o" style={{fontSize:12}} onClick={()=>setHandled(r,!r.handled)}>{r.handled?"Reopen":"Mark handled"}</button>
                <span className="acts"><button className="act danger" onClick={()=>remove(r)} title="Delete"><IconTrash/></button></span>
              </div>
            </div>
          </div>;
        })}
      </div>}
  </div>;
}

// ── Hotlists ───────────────────────────────────────────────────────────────
function HotlistsPage(){
  const [lists,setLists]=useState([]);const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);const [activeList,setActiveList]=useState(null);
  const [candidates,setCandidates]=useState([]);
  const [addingCand,setAddingCand]=useState(false);
  const [allCands,setAllCands]=useState([]);
  const [search,setSearch]=useState("");
  const [shareMsg,setShareMsg]=useState("");

  const load=useCallback(async()=>{
    setLoading(true);
    const{data}=await db.from("hotlists").select("*,hotlist_candidates(id,candidate_id,contacted_linkedin,contacted_at,urgent,not_interested,candidates(id,name,role,current_employer,location,skills,status,cv_url,cv_path))").order("created_at",{ascending:false});
    setLists(data||[]);
    // Opened from a hotlist chip on a candidate's record
    const want=window._pendingHotlist;
    if(want){
      window._pendingHotlist=null;
      const l=(data||[]).find(x=>x.id===want);
      if(l){setActiveList(l);setCandidates((l.hotlist_candidates||[]).map(hc=>hc.candidates));}
    }else if(activeList){
      const updated=(data||[]).find(l=>l.id===activeList.id);
      if(updated)setActiveList(updated);
    }
    setLoading(false);
  },[activeList?.id]);

  useEffect(()=>{load();},[]);

  const openList=async(list)=>{
    setActiveList(list);
    setCandidates((list.hotlist_candidates||[]).map(hc=>hc.candidates));
  };

  const createList=async(name,description)=>{
    if(!name.trim())return;
    const{data,error}=await db.from("hotlists").insert({name,description}).select();
    if(error){alert(error.message);return;}
    load();
    if(data?.[0])openList({...data[0],hotlist_candidates:[]});
    setModal(false);
  };

  const addCandidate=async(cand)=>{
    if(!activeList)return;
    const already=(activeList.hotlist_candidates||[]).some(hc=>hc.candidate_id===cand.id);
    if(already){alert("Already in this hotlist");return;}
    await db.from("hotlist_candidates").insert({hotlist_id:activeList.id,candidate_id:cand.id});
    load();setAddingCand(false);setSearch("");
  };

  const removeCandidate=async(candId)=>{
    if(!confirm("Remove from hotlist?"))return;
    await db.from("hotlist_candidates").delete().eq("hotlist_id",activeList.id).eq("candidate_id",candId);
    load();
  };

  const [moveFor,setMoveFor]=useState(null); // single hc being moved
  const [picked,setPicked]=useState(new Set()); // hc ids selected for bulk
  const [bulkMove,setBulkMove]=useState(false); // bulk move modal open

  const togglePick=(id)=>setPicked(prev=>{
    const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;
  });

  // Move or copy one or many hotlist rows to another list in a single pass
  const doMove=async(hcs,destListId,keepHere)=>{
    const dest=lists.find(l=>l.id===destListId);
    const destIds=new Set((dest?.hotlist_candidates||[]).map(x=>x.candidate_id));
    const toInsert=hcs.filter(hc=>!destIds.has(hc.candidate_id))
                      .map(hc=>({hotlist_id:destListId,candidate_id:hc.candidate_id}));
    if(toInsert.length) await db.from("hotlist_candidates").insert(toInsert);
    if(!keepHere) await db.from("hotlist_candidates").delete().in("id",hcs.map(hc=>hc.id));
    setMoveFor(null);setBulkMove(false);setPicked(new Set());
    const n=hcs.length;
    setShareMsg(`${keepHere?"Copied":"Moved"} ${n} candidate${n!==1?"s":""} to "${dest?.name}"`);
    setTimeout(()=>setShareMsg(""),2500);
    load();
  };
  const moveToList=(hc,destListId,keepHere)=>doMove([hc],destListId,keepHere);

  const [laterFor,setLaterFor]=useState(null); // hc awaiting a date/time
  const [laterDate,setLaterDate]=useState("");
  const [laterTime,setLaterTime]=useState("");

  const toggleUrgent=async(hc)=>{
    const now=!hc.urgent;
    setActiveList(prev=>prev&&({...prev,hotlist_candidates:(prev.hotlist_candidates||[]).map(x=>
      x.id===hc.id?{...x,urgent:now}:x)}));
    await db.from("hotlist_candidates").update({urgent:now}).eq("id",hc.id);
    load();
  };

  const toggleNotInterested=async(hc)=>{
    const now=!hc.not_interested;
    setActiveList(prev=>prev&&({...prev,hotlist_candidates:(prev.hotlist_candidates||[]).map(x=>
      x.id===hc.id?{...x,not_interested:now}:x)}));
    await db.from("hotlist_candidates").update({not_interested:now}).eq("id",hc.id);
    load();
  };

  const saveLater=async()=>{
    if(!laterFor||!laterDate)return;
    const c=laterFor.candidates;
    const task={
      title:`Contact ${c.name}${c.role?" ("+c.role+")":""} — from hotlist "${activeList.name}"`,
      due_date:laterDate,
      due_time:laterTime||null,
      priority:"normal",
      done:false,
    };
    // Link to the candidate; if the task setup SQL hasn't been run yet, save it unlinked
    const{error}=await db.from("tasks").insert({...task,candidate_id:String(c.id),candidate_name:c.name||null});
    if(error&&/candidate_/i.test(error.message)) await db.from("tasks").insert(task);
    setLaterFor(null);setLaterDate("");setLaterTime("");
    setShareMsg("Follow-up added to Tasks");setTimeout(()=>setShareMsg(""),2500);
  };

  const toggleContacted=async(hc)=>{
    const now=!hc.contacted_linkedin;
    // Update the screen straight away, then persist
    setActiveList(prev=>prev&&({...prev,hotlist_candidates:(prev.hotlist_candidates||[]).map(x=>
      x.id===hc.id?{...x,contacted_linkedin:now,contacted_at:now?new Date().toISOString():null}:x)}));
    await db.from("hotlist_candidates")
      .update({contacted_linkedin:now,contacted_at:now?new Date().toISOString():null})
      .eq("id",hc.id);
    // Record it in the candidate's activity so "Last contact" is accurate
    if(now){
      await db.from("activity_log").insert({
        entity_type:"candidate",entity_id:hc.candidate_id,entity_name:hc.candidates?.name||"",
        activity_type:"LinkedIn",subject:"Contacted on LinkedIn",
        body:`Messaged on LinkedIn — hotlist "${activeList?.name||""}"`,
      });
    }
    load();
  };

  const delList=async(id)=>{
    if(!confirm("Delete this hotlist?"))return;
    await db.from("hotlists").delete().eq("id",id);
    if(activeList?.id===id)setActiveList(null);
    load();
  };

  const copyShareLink=async()=>{
    if(!activeList)return;
    const cands=(activeList.hotlist_candidates||[]).map(hc=>hc.candidates).filter(Boolean);
    const text=`${activeList.name}\n${activeList.description||""}\n\n${cands.map(c=>`• ${c.name} — ${c.role||"?"}, ${c.location||"?"}`).join("\n")}`;
    await navigator.clipboard?.writeText(text);
    setShareMsg("Copied to clipboard!");setTimeout(()=>setShareMsg(""),2500);
  };

  useEffect(()=>{
    if(addingCand){
      allRows(()=>db.from("candidates").select("id,name,role,location,status").order("name").order("id")).then(({data})=>setAllCands(data||[]));
    }
  },[addingCand]);

  const filteredCands=allCands.filter(c=>!search||c.name?.toLowerCase().includes(search.toLowerCase())||c.role?.toLowerCase().includes(search.toLowerCase()));
  const activeHcs=(activeList?.hotlist_candidates||[]).filter(hc=>hc.candidates);
  const contactedCount=activeHcs.filter(hc=>hc.contacted_linkedin).length;
  const urgentCount=activeHcs.filter(hc=>hc.urgent).length;

  return <div className="hotlists-wrap" style={{display:"flex",gap:16,height:"100%"}}>
    {/* Contact-later scheduler */}
    {bulkMove&&(()=>{
      const others=lists.filter(l=>l.id!==activeList?.id);
      const chosen=activeHcs.filter(hc=>picked.has(hc.id));
      return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setBulkMove(false);}}>
        <div className="modal" style={{maxWidth:400}}>
          <h3>Move {chosen.length} candidate{chosen.length!==1?"s":""}</h3>
          <div style={{fontSize:12,color:"var(--t2)",marginBottom:12}}>
            <strong>Move</strong> removes them from "{activeList?.name}"; <strong>Copy</strong> keeps them on both. Anyone already on the destination list is skipped.
          </div>
          {others.length===0
            ?<div style={{fontSize:13,color:"var(--t3)",padding:"10px 0"}}>You only have one hotlist. Create another first.</div>
            :<div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:260,overflowY:"auto"}}>
              {others.map(l=>{
                const already=(l.hotlist_candidates||[]).filter(x=>chosen.some(hc=>hc.candidate_id===x.candidate_id)).length;
                return <div key={l.id} style={{display:"flex",alignItems:"center",gap:8,border:"0.5px solid var(--br)",borderRadius:8,padding:"9px 11px"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>{l.name}</div>
                    <div style={{fontSize:11,color:"var(--t3)"}}>{(l.hotlist_candidates||[]).length} candidate{(l.hotlist_candidates||[]).length!==1?"s":""}{already?` · ${already} already on it`:""}</div>
                  </div>
                  <button className="btn-o" style={{fontSize:11,padding:"3px 9px"}} onClick={()=>doMove(chosen,l.id,true)}>Copy</button>
                  <button className="btn-a" style={{fontSize:11,padding:"3px 9px"}} onClick={()=>doMove(chosen,l.id,false)}>Move</button>
                </div>;
              })}
            </div>}
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
            <button className="btn-o" onClick={()=>setBulkMove(false)}>Cancel</button>
          </div>
        </div>
      </div>;
    })()}

    {moveFor&&(()=>{
      const others=lists.filter(l=>l.id!==activeList?.id);
      return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setMoveFor(null);}}>
        <div className="modal" style={{maxWidth:400}}>
          <h3>Move {moveFor.candidates?.name}</h3>
          <div style={{fontSize:12,color:"var(--t2)",marginBottom:12}}>
            Choose a hotlist. <strong>Move</strong> removes them from "{activeList?.name}"; <strong>Copy</strong> keeps them on both.
          </div>
          {others.length===0
            ?<div style={{fontSize:13,color:"var(--t3)",padding:"10px 0"}}>You only have one hotlist. Create another first.</div>
            :<div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:260,overflowY:"auto"}}>
              {others.map(l=>{
                const on=(l.hotlist_candidates||[]).some(x=>x.candidate_id===moveFor.candidate_id);
                return <div key={l.id} style={{display:"flex",alignItems:"center",gap:8,border:"0.5px solid var(--br)",borderRadius:8,padding:"9px 11px"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>{l.name}</div>
                    <div style={{fontSize:11,color:"var(--t3)"}}>{(l.hotlist_candidates||[]).length} candidate{(l.hotlist_candidates||[]).length!==1?"s":""}{on?" · already on this list":""}</div>
                  </div>
                  <button className="btn-o" style={{fontSize:11,padding:"3px 9px"}} onClick={()=>moveToList(moveFor,l.id,true)}>Copy</button>
                  <button className="btn-a" style={{fontSize:11,padding:"3px 9px"}} onClick={()=>moveToList(moveFor,l.id,false)}>Move</button>
                </div>;
              })}
            </div>}
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
            <button className="btn-o" onClick={()=>setMoveFor(null)}>Cancel</button>
          </div>
        </div>
      </div>;
    })()}

    {laterFor&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setLaterFor(null);}}>
      <div className="modal" style={{maxWidth:380}}>
        <h3>⏰ Contact later</h3>
        <div style={{fontSize:12,color:"var(--t2)",marginBottom:12}}>
          Adds a reminder to your Tasks to contact <strong>{laterFor.candidates?.name}</strong>.
        </div>
        <div className="fr2">
          <div><label>Date</label><input type="date" value={laterDate} onChange={e=>setLaterDate(e.target.value)}/></div>
          <div><label>Time (optional)</label><input type="time" value={laterTime} onChange={e=>setLaterTime(e.target.value)}/></div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <button className="btn-o" onClick={()=>setLaterFor(null)}>Cancel</button>
          <button className="btn-a" onClick={saveLater} disabled={!laterDate}>Add to Tasks</button>
        </div>
      </div>
    </div>}

    {/* Sidebar list of hotlists */}
    <div className="hotlists-side" style={{width:240,flexShrink:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>Hotlists</span>
        <button className="btn-a" style={{fontSize:12,padding:"5px 10px"}} onClick={()=>setModal(true)}>+ New</button>
      </div>
      {loading?<Spin/>:lists.length===0
        ?<div style={{background:"var(--bg2)",borderRadius:8,padding:"20px",textAlign:"center",fontSize:12,color:"var(--t3)"}}>No hotlists yet. Create one to group candidates for a client or role.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:6}}>
          {lists.map(l=>{
            const cnt=(l.hotlist_candidates||[]).length;
            return <div key={l.id} onClick={()=>openList(l)} style={{background:activeList?.id===l.id?"rgba(95,169,43,0.12)":"var(--bg2)",border:`0.5px solid ${activeList?.id===l.id?ACCENT:"var(--br)"}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",transition:"all 0.15s"}}
              onMouseOver={e=>{if(activeList?.id!==l.id)e.currentTarget.style.background="var(--bg3)"}}
              onMouseOut={e=>{if(activeList?.id!==l.id)e.currentTarget.style.background="var(--bg2)"}}>
              <div style={{fontWeight:500,fontSize:13,color:activeList?.id===l.id?ACCENT:"var(--t1)",marginBottom:2}}>{l.name}</div>
              {l.description&&<div style={{fontSize:11,color:"var(--t3)",marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.description}</div>}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:11,color:"var(--t2)"}}>{cnt} candidate{cnt!==1?"s":""}</span>
                <button onClick={e=>{e.stopPropagation();delList(l.id);}} style={{background:"none",border:"none",cursor:"pointer",color:"var(--t3)",fontSize:11,padding:"0 2px"}}>✕</button>
              </div>
            </div>;
          })}
        </div>}
    </div>
    {/* Main panel */}
    <div style={{flex:1,minWidth:0}}>
      {!activeList
        ?<div style={{background:"var(--bg2)",borderRadius:10,padding:"48px 20px",textAlign:"center",color:"var(--t3)"}}>
            <div style={{fontSize:32,marginBottom:12}}>🔥</div>
            <div style={{fontSize:14,fontWeight:500,color:"var(--t1)",marginBottom:6}}>Select a hotlist</div>
            <div style={{fontSize:13,color:"var(--t2)"}}>Create a hotlist to group candidates for a specific client, role type, or outreach campaign.</div>
          </div>
        :<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontSize:15,fontWeight:600,color:"var(--t1)"}}>{activeList.name}</div>
              {activeList.description&&<div style={{fontSize:12,color:"var(--t2)",marginTop:2}}>{activeList.description}</div>}
            </div>
            <div style={{display:"flex",gap:6}}>
              {shareMsg&&<span style={{fontSize:12,color:"#3b6d11",alignSelf:"center"}}>✓ {shareMsg}</span>}
              <button className="btn-o" style={{fontSize:12}} onClick={copyShareLink}>📋 Copy list</button>
              <button className="btn-a" style={{fontSize:12}} onClick={()=>setAddingCand(true)}>+ Add candidate</button>
            </div>
          </div>
          {addingCand&&<div style={{background:"var(--bg2)",borderRadius:10,padding:14,marginBottom:14,border:"0.5px solid var(--brm)"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <span style={{fontSize:13,fontWeight:500}}>Add candidate to "{activeList.name}"</span>
              <button onClick={()=>{setAddingCand(false);setSearch("");}} style={{background:"none",border:"none",cursor:"pointer",color:"var(--t3)",fontSize:13}}>✕</button>
            </div>
            <input type="text" placeholder="Search candidates…" value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:8,width:"100%"}}/>
            <div style={{maxHeight:200,overflowY:"auto",borderRadius:8,border:"0.5px solid var(--br)"}}>
              {filteredCands.map(c=><div key={c.id} onClick={()=>addCandidate(c)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",cursor:"pointer",borderBottom:"0.5px solid var(--br)"}} onMouseOver={e=>e.currentTarget.style.background="var(--bg3)"} onMouseOut={e=>e.currentTarget.style.background=""}>
                <Av name={c.name} size={28}/><div><div style={{fontSize:13,fontWeight:500}}>{c.name}</div><div style={{fontSize:11,color:"var(--t2)"}}>{c.role||"—"}</div></div>
                <Pill label={c.status||"New"} style={{marginLeft:"auto"}}/>
              </div>)}
            </div>
          </div>}
          {activeHcs.length===0
            ?<div style={{background:"var(--bg2)",borderRadius:10,padding:"40px 20px",textAlign:"center",color:"var(--t3)",fontSize:13}}>No candidates in this hotlist yet. Click "+ Add candidate" to build it.</div>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",marginBottom:2,minHeight:30}}>
                <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--t2)",cursor:"pointer"}}>
                  <input type="checkbox"
                    checked={picked.size>0&&picked.size===activeHcs.length}
                    ref={el=>{if(el)el.indeterminate=picked.size>0&&picked.size<activeHcs.length;}}
                    onChange={e=>setPicked(e.target.checked?new Set(activeHcs.map(hc=>hc.id)):new Set())}
                    style={{width:16,height:16,accentColor:ACCENT,cursor:"pointer"}}/>
                  Select all
                </label>
                <span style={{fontSize:12,color:"var(--t2)"}}><strong style={{color:"var(--t1)"}}>{activeHcs.length}</strong> candidate{activeHcs.length!==1?"s":""}</span>
                <span style={{fontSize:12,color:"var(--t2)"}}>{contactedCount} contacted</span>
                {urgentCount>0&&<span style={{fontSize:12,color:"#c0392b",fontWeight:600}}>{urgentCount} urgent</span>}
                {picked.size>0&&<div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:12,fontWeight:600,color:ACCENT}}>{picked.size} selected</span>
                  <button className="btn-a" style={{fontSize:12,padding:"5px 12px"}} onClick={()=>setBulkMove(true)}>⇄ Move / copy</button>
                  <button className="btn-o" style={{fontSize:12,padding:"5px 10px"}} onClick={()=>setPicked(new Set())}>Clear</button>
                </div>}
              </div>
              {activeHcs.map(hc=>{
                const c=hc.candidates;
                const done=hc.contacted_linkedin;
                const urgent=hc.urgent;
                const dead=hc.not_interested;
                const bg=dead?"rgba(120,20,20,0.16)":urgent?"rgba(192,57,43,0.10)":done?"rgba(95,169,43,0.12)":"var(--bg)";
                const bd=dead?"0.5px solid rgba(120,20,20,0.55)":urgent?"0.5px solid rgba(192,57,43,0.5)":done?"0.5px solid rgba(95,169,43,0.45)":"0.5px solid var(--br)";
                return <div key={hc.id} style={{
                  background:bg,border:bd,
                  borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,transition:"background 0.15s,border-color 0.15s"}}>
                <input type="checkbox" title="Select for bulk move" checked={picked.has(hc.id)} onChange={()=>togglePick(hc.id)}
                  style={{width:16,height:16,accentColor:"var(--acc)",cursor:"pointer",flexShrink:0}}/>
                <label title={done?`Contacted${hc.contacted_at?" "+fmtStamp(hc.contacted_at):""} — click to undo`:"Mark as contacted on LinkedIn"}
                  style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",flexShrink:0,paddingLeft:10,borderLeft:"0.5px solid var(--br)"}}>
                  <input type="checkbox" checked={!!done} onChange={()=>toggleContacted(hc)}
                    style={{width:18,height:18,accentColor:"#5fa92b",cursor:"pointer"}}/>
                  <span style={{fontSize:10,color:"var(--t3)"}}>in</span>
                </label>
                <Av name={c.name} size={40}/>
                <div style={{flex:1,minWidth:0,opacity:dead?0.6:1}}>
                  <div style={{fontWeight:500,fontSize:13,color:"var(--t1)",textDecoration:dead?"line-through":"none"}}>{c.name}
                    {hasCv(c)&&<span style={{marginLeft:6,fontSize:10,background:"rgba(95,169,43,0.16)",color:"#3b6d11",borderRadius:6,padding:"1px 5px"}}>📄 CV</span>}
                    {urgent&&<span style={{marginLeft:6,fontSize:10,background:"#c0392b",color:"#fff",borderRadius:6,padding:"1px 6px",fontWeight:600}}>! Urgent</span>}
                    {done&&<span style={{marginLeft:6,fontSize:10,background:"#5fa92b",color:"#fff",borderRadius:6,padding:"1px 6px",fontWeight:600}}>in Contacted</span>}
                    {dead&&<span style={{marginLeft:6,fontSize:10,background:"#7a1414",color:"#fff",borderRadius:6,padding:"1px 6px",fontWeight:600}}>Not interested</span>}
                  </div>

function JobsPage({onOpenJob}){
  const [rows,setRows]=useState([]);const [companies,setCompanies]=useState([]);const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);const [editRow,setEditRow]=useState(null);const [err,setErr]=useState("");
  const load=useCallback(async()=>{
    setLoading(true);
    const[{data:j,error:je},{data:c}]=await Promise.all([
      db.from("jobs").select("*,companies(name,fee_type,fee_percentage,fee_fixed,terms_notes),job_candidates(id,stage)").order("created_at",{ascending:false}),
      db.from("companies").select("id,name,fee_type,fee_percentage,fee_fixed,terms_notes")
    ]);
    if(je)setErr(je.message);else{setRows(j||[]);setCompanies(c||[]);}setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);
  const del=async id=>{if(!confirm("Delete this job?"))return;await db.from("jobs").delete().eq("id",id);load();};
  // ── Job hygiene ── a job only counts as live while it has a live candidate
  // or is fresh. Already-placed jobs and long-dead ones are flagged so the
  // jobs list (and the dashboard's "Active jobs") reflects real work.
  const STALE_DAYS=30;
  const jobAge=j=>Math.floor((Date.now()-new Date(j.created_at))/864e5);
  const liveCands=j=>(j.job_candidates||[]).filter(x=>!["Rejected","Placed"].includes(x.stage)).length;
  const hasPlaced=j=>(j.job_candidates||[]).some(x=>x.stage==="Placed");
  const flag=j=>{
    if(j.status!=="Open")return null;
    if(hasPlaced(j))return "placed";
    if(liveCands(j)===0&&jobAge(j)>STALE_DAYS)return "stale";
    return null;
  };
  const setStatus=async(j,status)=>{
    const{error}=await db.from("jobs").update({status}).eq("id",j.id);
    if(error)setErr(error.message);else load();
  };
  const [tidying,setTidying]=useState(false);
  const fillAllPlaced=async()=>{
    const ids=rows.filter(j=>flag(j)==="placed").map(j=>j.id);
    if(!ids.length)return;
    setTidying(true);
    const{error}=await db.from("jobs").update({status:"Filled"}).in("id",ids);
    setTidying(false);
    if(error)setErr(error.message);else load();
  };
  const placedFlags=rows.filter(j=>flag(j)==="placed").length;
  const staleFlags=rows.filter(j=>flag(j)==="stale").length;
  const [showDone,setShowDone]=useState(false);
  const live=rows.filter(r=>r.status==="Open");
  const onHold=rows.filter(r=>r.status==="On hold");
  const done=rows.filter(r=>r.status!=="Open"&&r.status!=="On hold");
  const JobCard=({j})=>{
    const cnt=(j.job_candidates||[]).length;
    const co=j.companies||{};
    // Compute effective fee terms
    const feeType=j.fee_type_override||co.fee_type||"none";
    const feeVal=j.fee_type_override
      ?(j.fee_value_override||0)
      :(feeType==="percentage"?parseFloat(co.fee_percentage||0):parseFloat(co.fee_fixed||0));
    const salNum=parseFloat((j.salary_value||"").replace(/[^0-9.]/g,""));
    const potFee=j.potential_fee||(salNum&&feeVal&&feeType!=="none"
      ?(feeType==="percentage"?Math.round(salNum*(feeVal/100)):Math.round(feeVal))
      :null);
    const termsStr=feeType==="percentage"&&feeVal?`${feeVal}% of salary`
      :feeType==="fixed"&&feeVal?`Fixed £${parseFloat(feeVal).toLocaleString()}`
      :null;
    return <div style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:8,padding:"14px 16px",marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div style={{flex:1,minWidth:0,marginRight:10}}>
          <div style={{fontWeight:500,fontSize:14,color:"var(--t1)",marginBottom:3}}>{j.title}</div>
          <div style={{fontSize:12,color:"var(--t2)"}}>{co.name||"No client"} · {jobSalaryText(j)}{j.industry?` · ${j.industry}`:""}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
          <Pill label={j.status||"Open"}/>
          <span style={{fontSize:10,color:"var(--t3)"}}>{jobAge(j)} days old</span>
        </div>
      </div>
      {flag(j)==="placed"&&<div style={{background:"#e1f5ee",border:"0.5px solid #0f6e56",borderRadius:8,padding:"8px 12px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:"#0f6e56"}}>✅ Someone has been placed on this job, but it is still marked Open.</span>
        <button className="btn-a" style={{padding:"4px 10px",fontSize:11}} onClick={()=>setStatus(j,"Filled")}>Mark filled</button>
      </div>}
      {flag(j)==="stale"&&<div style={{background:"rgba(186,117,23,0.14)",border:"0.5px solid #ba7517",borderRadius:8,padding:"8px 12px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:"#854f0b"}}>⚠️ No live candidates and open for {jobAge(j)} days. Is the client still hiring?</span>
        <span style={{display:"flex",gap:6}}>
          <button className="btn-o" style={{padding:"4px 10px",fontSize:11}} onClick={()=>setStatus(j,"On hold")}>Put on hold</button>
          <button className="btn-o" style={{padding:"4px 10px",fontSize:11,color:"#a32d2d"}} onClick={()=>setStatus(j,"Closed")}>Close</button>
        </span>
      </div>}
      {/* Fee bar */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
        {potFee
          ?<div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(95,169,43,0.10)",border:"0.5px solid rgba(95,169,43,0.35)",borderRadius:8,padding:"6px 12px"}}>
            <span style={{fontSize:16}}>💰</span>
            <div>
              <div style={{fontSize:13,fontWeight:500,color:"#2e7a2c"}}>£{potFee.toLocaleString()} potential fee</div>
              {termsStr&&<div style={{fontSize:11,color:"#7f77dd"}}>{termsStr}{j.fee_type_override?" (overridden)":co.name?` · ${co.name} terms`:""}</div>}
            </div>
          </div>
          :<div style={{fontSize:11,color:"var(--t3)",fontStyle:"italic"}}>No fee terms set — edit job or company to add terms</div>
        }
        {j.actual_fee&&<div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(95,169,43,0.16)",border:"0.5px solid #97c459",borderRadius:8,padding:"6px 12px"}}>
          <span style={{fontSize:16}}>✅</span>
          <div>
            <div style={{fontSize:13,fontWeight:500,color:"#3b6d11"}}>£{parseFloat(j.actual_fee).toLocaleString()} actual fee</div>
            <div style={{fontSize:11,color:"#639922"}}>Confirmed received</div>
          </div>
        </div>}
      </div>
      {j.description&&<div style={{fontSize:12,color:"var(--t3)",lineHeight:1.55,marginBottom:10}}>{j.description.slice(0,110)}{j.description.length>110?"…":""}</div>}
      {co.terms_notes&&<div style={{fontSize:11,color:"var(--t3)",marginBottom:8}}>📋 {co.terms_notes}</div>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
        <span style={{fontSize:12,color:"var(--t2)"}}>👥 {cnt} candidate{cnt!==1?"s":""} in pipeline{cnt>0?` · ${liveCands(j)} live`:""}</span>
        <div style={{display:"flex",gap:6}}>
          <button className="btn-o" style={{padding:"5px 10px",fontSize:12}} onClick={()=>setEditRow(j)}>Edit</button>
          <button className="btn-d" style={{padding:"5px 10px"}} onClick={()=>del(j.id)}>Delete</button>
          {j.status==="On hold"&&<button className="btn-o" style={{padding:"5px 10px",fontSize:12}} onClick={()=>setStatus(j,"Open")}>Reopen</button>}
          <button className={j.status==="Open"?"btn-a":"btn-o"} style={{padding:"5px 12px",fontSize:12}} onClick={()=>onOpenJob(j)}>Open pipeline →</button>
        </div>
      </div>
    </div>;
  };
  return <div>
    {modal&&<JobModal companies={companies} onClose={()=>setModal(false)} onSaved={load}/>}
    {editRow&&<JobModal job={editRow} companies={companies} onClose={()=>setEditRow(null)} onSaved={load}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>Jobs ({rows.length})</span>
      <button className="btn-a" onClick={()=>setModal(true)}>+ Add job</button>
    </div>
    <Err msg={err}/>
    {!loading&&(placedFlags>0||staleFlags>0)&&<div style={{background:"var(--bg)",border:"0.5px solid #ba7517",borderRadius:10,padding:"12px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
      <div style={{fontSize:13,color:"var(--t1)"}}>
        <b>Tidy up:</b>{" "}
        {placedFlags>0&&<span>{placedFlags} open job{placedFlags!==1?"s have":" has"} already been placed</span>}
        {placedFlags>0&&staleFlags>0&&" · "}
        {staleFlags>0&&<span>{staleFlags} job{staleFlags!==1?"s have":" has"} had no live candidates for over {STALE_DAYS} days</span>}
      </div>
      {placedFlags>0&&<button className="btn-a" style={{fontSize:12,padding:"5px 12px"}} disabled={tidying} onClick={fillAllPlaced}>{tidying?"Updating…":`Mark ${placedFlags} as filled`}</button>}
    </div>}
    {loading?<Spin/>:<>
      {live.length>0&&<>
        <div style={{fontSize:11,fontWeight:500,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:8}}>Live jobs ({live.length})</div>
        {[...live].sort((a,b)=>(flag(a)?1:0)-(flag(b)?1:0)).map(j=><JobCard key={j.id} j={j}/>)}
      </>}
      {onHold.length>0&&<>
        <div style={{fontSize:11,fontWeight:500,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px",margin:"16px 0 8px"}}>On hold ({onHold.length})</div>
        {onHold.map(j=><JobCard key={j.id} j={j}/>)}

      {done.length>0&&<>
        <button onClick={()=>setShowDone(v=>!v)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontSize:11,fontWeight:500,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px",margin:"16px 0 8px",display:"block"}}>
          {showDone?"▾":"▸"} Filled &amp; closed ({done.length})
        </button>
        {showDone&&done.map(j=><JobCard key={j.id} j={j}/>)}

      {rows.length===0&&<EmptyState icon="briefcase" title="No jobs yet" sub="Create your first job to start building pipelines and tracking candidates." action="+ Add job" onAction={()=>setModal(true)}/>}
    </>}
  </div>;
}

function AddCandToJobModal({job, existingIds, onClose, onAdded}){
  const [candidates,setCandidates]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState([]);
  const [stage,setStage]=useState("Applied");
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  useEffect(()=>{
    allRows(()=>db.from("candidates").select("*").order("name").order("id")).then(({data})=>{ setCandidates(data||[]); setLoading(false); });
  },[]);

  const filtered=(candidates||[]).filter(c=>{
    const notIn=!existingIds.includes(c.id);
    const matchSearch=!search||c.name?.toLowerCase().includes(search.toLowerCase())||c.role?.toLowerCase().includes(search.toLowerCase());
    return notIn&&matchSearch;
  });

  const toggle=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

  const save=async()=>{
    if(!selected.length){setErr("Select at least one candidate");return;}
    setSaving(true);setErr("");
    const rows=selected.map(cid=>({job_id:job.id,candidate_id:cid,stage,notes:""}));
    const{error}=await db.from("job_candidates").insert(rows);
    if(!error) await Promise.all(selected.map(cid=>syncCandidateStatus(cid)));
    setSaving(false);
    if(error){setErr(error.message);return;}
    onAdded();onClose();
  };

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:560}}>
      <h3>Add candidates to: {job.title}</h3>
      <div className="fr">
        <label>Starting pipeline stage</label>
        <select value={stage} onChange={e=>setStage(e.target.value)}>
          {["Applied","Screening","Interview","2nd Interview","Offer","Placed"].map(s=><option key={s}>{s}</option>)}
        </select>
      </div>
      <div className="fr">
        <label>Search candidates</label>
        <input type="text" placeholder="Search by name or role…" value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      {selected.length>0&&<div style={{fontSize:12,color:ACCENT,marginBottom:10,fontWeight:500}}>{selected.length} selected</div>}
      <div style={{maxHeight:280,overflowY:"auto",border:"0.5px solid var(--br)",borderRadius:8,marginBottom:12}}>
        {loading?<Spin/>:filtered.length===0
          ?<div style={{padding:"20px",textAlign:"center",color:"var(--t3)",fontSize:13}}>{search?"No results.":"All candidates already added to this job."}</div>
          :filtered.map(c=>{
            const sel=selected.includes(c.id);
            return <div key={c.id} onClick={()=>toggle(c.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:"0.5px solid var(--br)",cursor:"pointer",background:sel?"rgba(95,169,43,0.12)":"transparent"}}>
              <div style={{width:18,height:18,borderRadius:4,border:`1.5px solid ${sel?ACCENT:"var(--brm)"}`,background:sel?ACCENT:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {sel&&<span style={{color:"#fff",fontSize:11}}>✓</span>}
              </div>
              <Av name={c.name}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:500,fontSize:13,color:"var(--t1)"}}>{c.name}</div>
                <div style={{fontSize:11,color:"var(--t2)"}}>{c.role||"—"} · {c.location||"—"}</div>
              </div>
              <Pill label={c.status||"New"}/>
            </div>;
          })
        }
      </div>
      <Err msg={err}/>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button className="btn-o" onClick={onClose}>Cancel</button>
        <button className="btn-a" onClick={save} disabled={saving||!selected.length}>
          {saving?<><span className="spin"></span>Adding…</>:`Add ${selected.length||""} candidate${selected.length!==1?"s":""}`}
        </button>
      </div>
    </div>
  </div>;
}

const STAGES=["Applied","Screening","Interview","2nd Interview","Offer","Placed","Rejected"];
// Rejected is an outcome, not a funnel step — excluded from the progress bar
const FUNNEL_STAGES=STAGES.filter(s=>s!=="Rejected");
const STAGE_COLORS={
  "Applied":    {bg:"rgba(17,17,17,0.05)",fg:"var(--t2)",bar:"#c9c9c3"},
  "Screening":  {bg:"rgba(17,17,17,0.05)",fg:"var(--t2)",bar:"#a9a9a2"},

  "Offer":      {bg:"rgba(95,169,43,0.20)",fg:"var(--g-deep)",bar:"#5fa92b"},
  "Placed":     {bg:"rgba(46,122,44,0.20)",fg:"var(--g-deep)",bar:"#2e7a2c"},
