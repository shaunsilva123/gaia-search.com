<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body.dark .act.danger:hover{background:rgba(192,57,43,0.18)}
/* ── Phone-friendly layout ── */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}

@media (max-width:760px){
  .menu-btn{display:block}

  .app-content{padding:12px!important}

  /* Stack multi-column layouts */

  .app-content [style*="repeat(6"]{grid-template-columns:repeat(3,1fr)!important}

  <span class="banner-label">AI features need an Anthropic API key:</span>
  <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." style="max-width:260px"/>
  <button onclick="saveKey()">Save</button>

<script type="text/babel" data-presets="react">
const {useState,useCallback,useEffect,Fragment} = React;

const SUPABASE_URL = "https://wnzpeyrdtdxcodeezqxb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduenBleXJkdGR4Y29kZWV6cXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjkyNzksImV4cCI6MjA5NDAwNTI3OX0.zd1AdzDm7S2qzA2xsXZatE1nJynAT3j2tN-tp2g6xlA";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ACCENT = "#2e7a2c";

// ─── LOGO PROVIDER ────────────────────────────────────────────────────────
// Paste ONE publishable key below to get real company logos. Leave both blank
// and the app falls back to site favicons, then to coloured initials — so it
// works either way and a bad key just degrades quietly.
// These are PUBLISHABLE keys, designed to sit in client-side code. Do not put
// a secret key (sk_...) here — this file is served to the public web.
// Annual fee target shown on the dashboard. Click the figure on the dashboard
// to change it — the new value is remembered in this browser.
const DEFAULT_TARGET = 100000;
function getTarget(){
  const v=parseFloat(localStorage.getItem("gaiaTarget"));
  return v>0?v:DEFAULT_TARGET;
}

const LOGO_DEV_TOKEN     = "";   // from logo.dev  → publishable key
const BRANDFETCH_CLIENT_ID = ""; // from brandfetch.com → client ID
// ──────────────────────────────────────────────────────────────────────────
const SIDEBAR = "#1a1f2e";

const PILL_MAP = {
  "New":{bg:"rgba(91,101,119,0.10)",fg:"#5b6577"},"Active":{bg:"rgba(95,169,43,0.16)",fg:"#3b6d11"},
  "Offer stage":{bg:"rgba(91,101,119,0.10)",fg:"#5b6577"},"Placed":{bg:"#e1f5ee",fg:"#0f6e56"},
  "Interview":{bg:"rgba(212,83,126,0.12)",fg:"#993556"},"Pipeline":{bg:"rgba(186,117,23,0.14)",fg:"#854f0b"},
  "Open":{bg:"rgba(95,169,43,0.16)",fg:"#3b6d11"},"Filled":{bg:"#e1f5ee",fg:"#0f6e56"},
  "On hold":{bg:"rgba(186,117,23,0.14)",fg:"#854f0b"},"Cold":{bg:"#f1efe8",fg:"#5f5e5a"},
  "Client":{bg:"#e1f5ee",fg:"#0f6e56"},"Closed":{bg:"rgba(226,75,74,0.12)",fg:"#a32d2d"},
};

const AV_COLORS = [
  {bg:"rgba(91,101,119,0.10)",fg:"#5b6577"},{bg:"rgba(95,169,43,0.16)",fg:"#3b6d11"},{bg:"rgba(212,83,126,0.12)",fg:"#993556"},
  {bg:"rgba(55,138,221,0.14)",fg:"#185fa5"},{bg:"#faece7",fg:"#993c1d"},{bg:"#e1f5ee",fg:"#0f6e56"},
  {bg:"rgba(186,117,23,0.14)",fg:"#854f0b"},{bg:"rgba(127,119,221,0.14)",fg:"#534ab7"},
];

function getColor(name){let h=0;for(let c of(name||""))h=(h*31+c.charCodeAt(0))%AV_COLORS.length;return AV_COLORS[h];}
function ini(name){return(name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function getKey(){return window._apiKey||localStorage.getItem("rcrm_key")||"";}

function Pill({label}){const s=PILL_MAP[label]||{bg:"#f1efe8",fg:"#5f5e5a"};return <span style={{display:"inline-flex",alignItems:"center",padding:"2px 9px",borderRadius:10,fontSize:11,fontWeight:500,background:s.bg,color:s.fg}}>{label}</span>;}
function Av({name,size=30}){const{bg,fg}=getColor(name);return <div style={{width:size,height:size,borderRadius:"50%",background:bg,color:fg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size<36?11:14,fontWeight:500,flexShrink:0}}>{ini(name)}</div>;}
// Company logo: manual override first, then the site favicon, falling back to
// initials. Clearbit's logo API shut down in Dec 2025 and the replacements need
// an API key, which would have to be exposed in this client-side file.
function coDomain(website){
  if(!website)return null;
  try{
    let w=website.trim();
    if(!/^https?:\/\//i.test(w)) w="https://"+w;
    const h=new URL(w).hostname.replace(/^www\./i,"");
    return h.includes(".")?h:null;
  }catch(e){return null;}
}
function CoLogo({company,size=30}){
  const domain=coDomain(company?.website);
  const px=Math.max(64,size*3); // ask for a retina-friendly size
  const sources=[];
  if(company?.logo_url) sources.push(company.logo_url);
  if(domain){
    if(LOGO_DEV_TOKEN)       sources.push(`https://img.logo.dev/${domain}?token=${LOGO_DEV_TOKEN}&size=${px}&format=png`);
    if(BRANDFETCH_CLIENT_ID) sources.push(`https://cdn.brandfetch.io/${domain}/w/${px}/h/${px}?c=${BRANDFETCH_CLIENT_ID}`);
    sources.push(`https://www.google.com/s2/favicons?domain=${domain}&sz=128`);
    sources.push(`https://icons.duckduckgo.com/ip3/${domain}.ico`);
  }
  const [i,setI]=useState(0);
  // Reset when the row changes, otherwise a failed logo hides the next one
  useEffect(()=>{setI(0);},[company?.id,company?.website,company?.logo_url]);
  if(i>=sources.length) return <Av name={company?.name||"?"} size={size}/>;
  return <img
    src={sources[i]}
    alt=""
    onError={()=>setI(n=>n+1)}
    style={{width:size,height:size,borderRadius:"50%",objectFit:"contain",background:"#fff",

// CVs live in a PRIVATE bucket. We never link to them directly — a short-lived
// signed link is minted on demand so a leaked URL cannot expose someone's CV.
// Pull readable text out of a CV so Postgres can index it.
// Returns "" rather than throwing — a CV that will not parse should still upload.
async function extractFileText(fileOrBlob,filename,maxPages){
  const name=(filename||fileOrBlob.name||"").toLowerCase();
  try{
    const buf=await fileOrBlob.arrayBuffer();
    if(name.endsWith(".pdf")){
      if(!window.pdfjsLib) return "";
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      let out=[];
      try{
        const n=maxPages?Math.min(maxPages,pdf.numPages):pdf.numPages;
        for(let i=1;i<=n;i++){
          const page=await pdf.getPage(i);
          const tc=await page.getTextContent();
          out.push(tc.items.map(it=>it.str).join(" "));
          page.cleanup();
        }
      }finally{
        // Free the parsed PDF — without this, memory builds up across many files
        try{ await pdf.destroy(); }catch(e){}
      }
      return out.join("\n").replace(/\s+/g," ").trim();
    }
    if(name.endsWith(".docx")){
      if(!window.mammoth) return "";
      const r=await mammoth.extractRawText({arrayBuffer:buf});
      return (r.value||"").replace(/\s+/g," ").trim();
    }
    // .doc and anything else: best effort as plain text
    return new TextDecoder("utf-8",{fatal:false}).decode(buf).replace(/[^\x20-\x7E\n]+/g," ").replace(/\s+/g," ").trim();
  }catch(e){ console.warn("CV text extraction failed",e); return ""; }
}
function cvStoragePath(c){
  if(!c) return null;
  if(c.cv_path) return c.cv_path;
  // Older rows only stored the old public URL — recover the path from it

  const i=u.indexOf("/candidate-cvs/");
  return i>=0?u.slice(i+"/candidate-cvs/".length):null;
}

// ── Outlook (Microsoft 365) connection ────────────────────────────────────
// The Supabase Edge Function "outlook" holds the Microsoft sign-in, syncs mail
// every 15 minutes, sends email and creates calendar events.
const outlookState={status:null,listeners:new Set()};
async function refreshOutlookStatus(){
  try{const{data}=await db.rpc("outlook_status");outlookState.status=data||{connected:false};}
  catch(e){outlookState.status={connected:false};}
  outlookState.listeners.forEach(f=>f(outlookState.status));return outlookState.status;
}
function useOutlook(){
  const [st,setSt]=useState(outlookState.status);
  useEffect(()=>{outlookState.listeners.add(setSt);if(!outlookState.status)refreshOutlookStatus();return()=>outlookState.listeners.delete(setSt);},[]);
  return st||{connected:false,loading:true};
}
async function outlookCall(body){
  const{data,error}=await db.functions.invoke("outlook",{body});
  if(error){let msg=error.message;try{const j=await error.context?.json?.();if(j?.error)msg=j.error;}catch(e){}throw new Error(msg);}
  if(data?.error)throw new Error(data.error);
  return data;
}
const fmtWhen=ts=>{if(!ts)return"";const d=new Date(ts);const today=new Date().toDateString()===d.toDateString();return today?d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):fmtStamp(ts);};

function OutlookPage(){
  const st=useOutlook();
  const [busy,setBusy]=useState("");const [msg,setMsg]=useState("");const [err,setErr]=useState("");
  const connect=async()=>{setBusy("connect");setErr("");try{const{url}=await outlookCall({action:"start"});window.location.href=url;}catch(e){setErr(e.message);setBusy("");}};
  const syncNow=async()=>{setBusy("sync");setErr("");setMsg("");try{const r=await outlookCall({action:"sync"});setMsg(`Checked ${r.sent} sent and ${r.received} received emails · ${r.logged} logged to the CRM${r.cvs?` · ${r.cvs} CVs recorded as submittals`:""}.`+(r.unmatched?.length?` Not in the CRM yet: ${r.unmatched.join(", ")}`:""));await refreshOutlookStatus();}catch(e){setErr(e.message);}setBusy("");};
  const [bf,setBf]=useState(null);
  const backfill=async()=>{
    setErr("");const DAY=86400000,STEP=10;const end=Date.now();const start=end-365*DAY;
    const steps=Math.ceil(365/STEP);let tot={logged:0,stored:0,sent:0,received:0};
    for(let i=0;i<steps;i++){
      const from=new Date(start+i*STEP*DAY),to=new Date(Math.min(end,start+(i+1)*STEP*DAY));
      setBf({i,steps,label:`${fmtStamp(from)} – ${fmtStamp(to)}`,tot:{...tot}});
      let ok=false;
      for(let attempt=0;attempt<3&&!ok;attempt++){
        try{const r=await outlookCall({action:"backfill",from:from.toISOString(),to:to.toISOString()});
          tot={logged:tot.logged+r.logged,stored:tot.stored+r.stored,sent:tot.sent+r.sent,received:tot.received+r.received};ok=true;}
        catch(e){if(attempt===2){setErr(`Stopped at ${fmtStamp(from)}: ${e.message}. Click again to resume — nothing is duplicated.`);setBf(null);return;}await new Promise(r=>setTimeout(r,3000));}
      }
    }
    setBf(null);setMsg(`Past 12 months imported: ${tot.sent} sent and ${tot.received} received emails checked, ${tot.stored} saved to candidate and company records, ${tot.logged} logged as activity.`);
  };
  const disconnect=async()=>{if(!confirm("Disconnect Outlook? Email history already saved stays in the CRM."))return;setBusy("dis");try{await outlookCall({action:"disconnect"});await refreshOutlookStatus();}catch(e){setErr(e.message);}setBusy("");};
  return <div style={{maxWidth:720,display:"flex",flexDirection:"column",gap:14}}>
    <div className="g-canvas">
      <div className="g-eyebrow">Microsoft Outlook</div>
      {st.loading?<Spin/>:st.connected
        ?<>
          <div style={{fontSize:16,fontWeight:600,color:"var(--t1)",marginTop:6}}>✓ Connected as {st.account}</div>
          <div style={{fontSize:12,color:"var(--t2)",marginTop:4}}>Last sync: {st.last_sync?fmtDateTime(st.last_sync):"not yet"}{st.last_sync_result?` · ${st.last_sync_result}`:""}</div>
          <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
            <button className="btn-a" onClick={syncNow} disabled={!!busy}>{busy==="sync"?<><span className="spin" style={{margin:0}}></span>Syncing…</>:"Sync now"}</button>
            <button className="btn-o" onClick={backfill} disabled={!!busy||!!bf}>Import past emails (12 months)</button>
            <button className="btn-o" onClick={disconnect} disabled={!!busy||!!bf}>Disconnect</button>
          </div>
          {bf&&<div style={{marginTop:12}}>
            <div style={{fontSize:12,color:"var(--t2)"}}>Importing {bf.label} ({bf.i+1} of {bf.steps}) · {bf.tot.stored} emails saved so far — keep this tab open</div>
            <div style={{height:4,borderRadius:2,background:"var(--g-cream2)",marginTop:6,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.round((bf.i)/bf.steps*100)}%`,background:"var(--g-green)"}}/></div>
          </div>}
        </>
        :<>
          <div style={{fontSize:14,color:"var(--t1)",marginTop:6}}>Connect your gaia-search.com mailbox so the CRM can log emails and book interviews for you.</div>
          <button className="btn-a" style={{marginTop:14}} onClick={connect} disabled={!!busy}>{busy?"Opening Microsoft sign-in…":"Connect Outlook"}</button>
        </>}
      {msg&&<div style={{fontSize:12,color:"var(--g-deep)",marginTop:12}}>{msg}</div>}
      {err&&<div style={{fontSize:12,color:"#a32d2d",marginTop:12}}>{err}</div>}
    </div>
    <Panel title="What it does">
      <div style={{padding:"12px 18px",fontSize:13,color:"var(--t2)",lineHeight:1.7}}>
        <div>• <b>Every 15 minutes</b> it reads new sent and received emails. Emails to and from candidates and client contacts are saved on their record.</div>
        <div>• <b>Sent emails count on your scorecard</b>: to candidates as messages, to clients as client touches. A CV emailed to a client becomes a submittal.</div>
        <div>• <b>Email from the CRM</b>: the Email button on a candidate opens a composer that sends from your Outlook.</div>
        <div>• <b>Interviews go in your calendar</b>: moving someone to Interview offers to create the Outlook event (with a Teams link if you want).</div>
        <div>• <b>Today's meetings</b> appear on the dashboard.</div>
        <div style={{marginTop:6,color:"var(--t3)",fontSize:12}}>Emails to people not yet in the CRM are ignored, apart from a list after each manual sync so you can add them.</div>
      </div>
    </Panel>
  </div>;
}

async function claude(system,user,onChunk){
  const key=getKey();
  if(!key)throw new Error("No Anthropic API key — enter it in the yellow banner above.");
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:2000,stream:true,system,messages:[{role:"user",content:user}]})
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||"API error");}
  const reader=res.body.getReader(),dec=new TextDecoder();let buf="";
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split("\n");buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith("data: "))continue;
      const d=line.slice(6).trim();if(d==="[DONE]")return;
      try{const p=JSON.parse(d);if(p.type==="content_block_delta"&&p.delta?.text)onChunk(p.delta.text);}catch{}
    }
  }
}

const ukLabel=(town,country)=>`${town}, ${country}, United Kingdom`;

async function livePlaces(q){
  try{
    const r=await fetch(`https://api.postcodes.io/places?q=${encodeURIComponent(q)}&limit=40`);
    if(!r.ok)return [];
    const j=await r.json();

function LocationInput({value,onChange,placeholder}){
  const [open,setOpen]=useState(false);
  const [items,setItems]=useState([]);
  const [hi,setHi]=useState(0);
  const ref=React.useRef();
  const typed=React.useRef(false);

  useEffect(()=>{
    const q=(value||"").trim();
    if(!typed.current||q.length<2){setItems([]);return;}
    let cancelled=false;
    const ql=q.toLowerCase();
    const starts=(t)=>t.toLowerCase().startsWith(ql);
    const has=(t)=>t.toLowerCase().includes(ql);
    (async()=>{
      // Instant: CRM history + built-in towns
      const crm=(await crmLocations()).filter(x=>has(x.label));
      const built=UK_PLACES.filter(([t])=>has(t))
        .sort((a,b)=>(starts(b[0])-starts(a[0]))||a[0].localeCompare(b[0]))
        .map(([t,c,co])=>({label:ukLabel(t,co),sub:c}));
      const merge=(...lists)=>{const seen=new Set(),out=[];lists.flat().forEach(x=>{const k=x.label.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(x);}});return out.slice(0,10);};
      if(cancelled)return;
      const first=merge(crm.sort((a,b)=>starts(b.label)-starts(a.label)),built);
      setItems(first);setHi(0);
      // Then: every UK village/hamlet from the live lookup
      const live=await livePlaces(q);
      if(cancelled)return;
      setItems(merge(first,live));
    })();
    return()=>{cancelled=true;};
  },[value]);

  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[]);

  const pick=it=>{typed.current=false;onChange(it.label);setOpen(false);setItems([]);};
  const onKey=e=>{
    if(!open||!items.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,items.length-1));}
    else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,0));}
    else if(e.key==="Enter"){e.preventDefault();pick(items[hi]);}
    else if(e.key==="Escape"){setOpen(false);}
  };

  return <div ref={ref} style={{position:"relative"}}>
    <input type="text" value={value||""} placeholder={placeholder} autoComplete="off"
      onChange={e=>{typed.current=true;onChange(e.target.value);setOpen(true);}}
      onFocus={()=>setOpen(true)} onKeyDown={onKey}/>
    {open&&items.length>0&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,minWidth:260,background:"var(--bg)",border:"0.5px solid var(--brm)",borderRadius:8,boxShadow:"0 8px 24px rgba(0,0,0,0.15)",zIndex:1300,maxHeight:260,overflowY:"auto"}}>
      {items.map((it,i)=><div key={it.label} onMouseDown={e=>{e.preventDefault();pick(it);}} onMouseEnter={()=>setHi(i)}
        style={{padding:"7px 11px",cursor:"pointer",background:i===hi?"var(--bg2)":"transparent",borderBottom:"0.5px solid var(--br)"}}>
        <div style={{fontSize:12,color:"var(--t1)"}}>📍 {it.label}</div>
        {it.sub&&<div style={{fontSize:10,color:"var(--t3)",marginLeft:18}}>{it.sub}</div>}
      </div>)}
    </div>}
  </div>;
}

// Fields the candidate form is allowed to write (keeps system columns out of saves)
// ── Candidate status follows the pipeline ─────────────────────────────────
// Status is worked out from the furthest stage the candidate has reached on
// any job, so it never has to be updated by hand:
//   Applied / Screening → Pipeline · Interview / 2nd Interview → Interview
//   Offer → Offer stage · Placed → Placed
// If they drop out of every job they go back to Active. Placed is never
// downgraded automatically, and On hold / Closed / Cold are only changed if
// they move forward in a pipeline.
const AUTO_STATUS={"Applied":"Pipeline","Screening":"Pipeline","Interview":"Interview","2nd Interview":"Interview","Offer":"Offer stage","Placed":"Placed"};
const STATUS_RANK=["New","Active","Pipeline","Interview","Offer stage","Placed"];
async function syncCandidateStatus(candId){
  if(!candId)return null;
  const[{data:jcs},{data:c}]=await Promise.all([
    db.from("job_candidates").select("stage").eq("candidate_id",candId),
    db.from("candidates").select("status").eq("id",candId).single(),
  ]);
  const cur=c?.status||"New";
  const live=(jcs||[]).map(j=>AUTO_STATUS[j.stage]).filter(Boolean);
  let next=null;
  if(live.length) next=live.sort((a,b)=>STATUS_RANK.indexOf(b)-STATUS_RANK.indexOf(a))[0];
  else if(["Pipeline","Interview","Offer stage"].includes(cur)) next="Active";
  if(!next||next===cur)return cur;
  if(cur==="Placed")return cur; // a past placement is never undone automatically
  await db.from("candidates").update({status:next}).eq("id",candId);
  return next;
}
// A real conversation turns a New record into an Active candidate
async function markActiveIfNew(candId){
  if(!candId)return;
  await db.from("candidates").update({status:"Active"}).eq("id",candId).eq("status","New");
}
const CAND_FIELDS=["name","role","current_employer","email","phone","location","experience","salary","notice","skills","status","notes","linkedin","source","licences","cieem_level","driving_licence","salary_expect"];

function CandModal({cand,onClose,onSaved,initial}){
  const blank={name:"",role:"",current_employer:"",email:"",phone:"",location:"",experience:"",salary:"",notice:"",skills:"",status:"New",notes:"",linkedin:"",source:"",licences:[],cieem_level:"",driving_licence:"",salary_expect:""};
  const [f,setF]=useState(cand?{...blank,...cand,skills:Array.isArray(cand.skills)?cand.skills.join(", "):cand.skills||"",licences:cand.licences||[],salary_expect:cand.salary_expect||""}:{...blank,...(initial||{})});
  const [saving,setSaving]=useState(false);const [err,setErr]=useState("");
  const [genDesc,setGenDesc]=useState(false);
  const [dupes,setDupes]=useState(null); // possible duplicates found before saving a new candidate
  const dupeRef=React.useRef(null);
  useEffect(()=>{if(dupes&&dupeRef.current)dupeRef.current.scrollIntoView({behavior:"smooth",block:"center"});},[dupes]);
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const toggleLicence=l=>setF(p=>{const has=(p.licences||[]).includes(l);return{...p,licences:has?p.licences.filter(x=>x!==l):[...(p.licences||[]),l]};});

  // The list view only loads some columns, so fill in the rest when editing
  useEffect(()=>{
    if(!cand?.id)return;
    db.from("candidates").select(CAND_FIELDS.join(",")).eq("id",cand.id).single().then(({data})=>{
      if(data)setF(p=>({...p,...data,skills:Array.isArray(data.skills)?data.skills.join(", "):data.skills||"",licences:data.licences||[],salary_expect:data.salary_expect||"",
        cieem_level:data.cieem_level||"",driving_licence:data.driving_licence||"",source:data.source||"",linkedin:data.linkedin||"",current_employer:data.current_employer||""}));
    });
  },[cand?.id]);

  const findDupes=async()=>{
    const q=[];
    const em=(f.email||"").trim(),li=(f.linkedin||"").trim().split("?")[0].replace(/\/$/,""),nm=f.name.trim();
    const sel="id,name,role,location,email";
    if(em)q.push(db.from("candidates").select(sel).ilike("email",em).limit(3));
    if(li){const slug=(li.match(/linkedin\.com\/in\/([^/?#]+)/i)||[])[1];if(slug)q.push(db.from("candidates").select(sel).ilike("linkedin",`%${slug}%`).limit(3));}
    if(nm)q.push(db.from("candidates").select(sel).ilike("name",nm).limit(3));
    const res=await Promise.all(q);
    const seen=new Set(),out=[];
    res.forEach(r=>(r.data||[]).forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);out.push(c);}}));
    return out;
  };

  const save=async(force)=>{
    if(!f.name.trim()){setErr("Name is required");return;}
    setSaving(true);setErr("");
    if(!cand&&!force){
      const d=await findDupes();
      if(d.length){setDupes(d);setSaving(false);return;}
    }
    const payload={};
    CAND_FIELDS.forEach(k=>{if(f[k]!==undefined)payload[k]=f[k];});
    payload.skills=String(f.skills||"").split(",").map(x=>x.trim()).filter(Boolean);
    payload.initials=ini(f.name);
    payload.salary_expect=salaryNum(f.salary_expect);
    ["source","cieem_level","driving_licence","current_employer"].forEach(k=>{if(!payload[k])payload[k]=null;});
    if(payload.current_employer)payload.current_employer=String(payload.current_employer).trim();
    const{data:savedRow,error}=cand
      ?await db.from("candidates").update(payload).eq("id",cand.id).select("id,name").single()
      :await db.from("candidates").insert(payload).select("id,name").single();
    setSaving(false);
    if(error){setErr(error.message+(/source|licences|cieem|driving|salary_expect|current_employer/i.test(error.message)?UPGRADE_HINT:""));return;}
    await onSaved(savedRow);onClose();
  };
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h3>{cand?"Edit candidate":"Add candidate"}</h3>
      <div className="fr2">
        <div><label>Full name *</label><input type="text" value={f.name} onChange={s("name")} placeholder="Sophie Archer"/></div>
        <div><label>Role</label><input type="text" value={f.role||""} onChange={s("role")} placeholder="Senior Ecologist"/></div>
      </div>
      <div className="fr2">
        <div><label title="Who they work for now — searchable, and used when sourcing from competitor firms">Current employer</label><input type="text" value={f.current_employer||""} onChange={s("current_employer")} placeholder="WSP"/></div>
        <div/>
      </div>
      <div className="fr2">
        <div><label>Email</label><div style={{display:"flex",gap:6}}>
          <input type="email" value={f.email||""} onChange={s("email")} placeholder="sophie@email.com" style={{flex:1}}/>
          {f.email&&<CopyButton text={f.email}/>}
        </div></div>
        <div><label>Phone</label><input type="tel" value={f.phone||""} onChange={s("phone")} placeholder="+44 7700 000000"/></div>
      </div>
      <div className="fr2">
        <div><label>Location</label><LocationInput value={f.location||""} onChange={v=>setF(p=>({...p,location:v}))} placeholder="Start typing a town…"/></div>
        <div><label>Experience</label><input type="text" value={f.experience||""} onChange={s("experience")} placeholder="5 years"/></div>
      </div>
      <div className="fr2">
        <div><label>Current salary</label><input type="text" value={f.salary||""} onChange={s("salary")} placeholder="£52,000"/></div>
        <div><label>Notice period</label><input type="text" value={f.notice||""} onChange={s("notice")} placeholder="1 month"/></div>
      </div>
      <div className="fr"><label>LinkedIn URL</label>
        <div style={{display:"flex",gap:6}}>
          <input type="text" value={f.linkedin||""} onChange={s("linkedin")} placeholder="https://linkedin.com/in/username" style={{flex:1}}/>
          {f.linkedin&&<a href={f.linkedin} target="_blank" rel="noreferrer" style={{background:"#0a66c2",color:"#fff",borderRadius:7,padding:"7px 12px",fontSize:12,textDecoration:"none",whiteSpace:"nowrap",display:"flex",alignItems:"center"}}>Open ↗</a>}
        </div>
      </div>
      <div className="fr"><label>Skills (comma separated)</label><input type="text" value={f.skills||""} onChange={s("skills")} placeholder="Python, SQL, Tableau"/></div>
      <div className="fr2">
        <div><label>Status</label>
          <select value={f.status} onChange={s("status")}>{["New","Active","Pipeline","Interview","Offer stage","Placed","Cold"].map(x=><option key={x}>{x}</option>)}</select>
        </div>
        <div><label title="Where their details came from — needed for GDPR">Source</label>
          <select value={f.source||""} onChange={s("source")}><option value="">— Not recorded —</option>{SOURCES.map(x=><option key={x}>{x}</option>)}</select>
        </div>
      </div>

      {/* Ecology */}
      <div style={{borderTop:"0.5px solid var(--br)",margin:"12px 0",paddingTop:12}}>
        <div style={{fontSize:12,fontWeight:500,color:"var(--t1)",marginBottom:10}}>🌿 Ecology</div>
        <div className="fr"><label>Protected species licences</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
            {LICENCES.map(l=>{const on=(f.licences||[]).includes(l);return <button type="button" key={l} onClick={()=>toggleLicence(l)}
              style={{fontSize:11,padding:"4px 9px",borderRadius:14,cursor:"pointer",fontFamily:"inherit",
                border:on?"0.5px solid #2e7a2c":"0.5px solid var(--brm)",background:on?"#2e7a2c":"transparent",color:on?"#fff":"var(--t2)"}}>{on?"✓ ":""}{l}</button>;})}
          </div>
        </div>
        <div className="fr2">
          <div><label>CIEEM membership</label>
            <select value={f.cieem_level||""} onChange={s("cieem_level")}><option value="">— None / unknown —</option>{CIEEM_LEVELS.map(x=><option key={x}>{x}</option>)}</select>
          </div>
          <div><label>Full driving licence</label>
            <select value={f.driving_licence||""} onChange={s("driving_licence")}><option value="">— Unknown —</option><option>Yes</option><option>No</option></select>
          </div>
        </div>
        <div className="fr"><label>Salary expectation (£ — used for filtering)</label>
          <input type="text" value={f.salary_expect||""} onChange={s("salary_expect")} placeholder="e.g. 42000 or 42k"/>
        </div>
      </div>

      <div className="fr"><label>Notes</label><textarea value={f.notes||""} onChange={s("notes")} placeholder="Additional notes…"/></div>
      {dupes&&<div ref={dupeRef} style={{background:"rgba(186,117,23,0.12)",border:"0.5px solid #e8c97a",borderRadius:8,padding:"10px 12px",fontSize:12,color:"#854f0b",marginTop:8}}>
        <div style={{fontWeight:600,marginBottom:6}}>⚠️ This person may already be in your CRM:</div>
        {dupes.map(d=><div key={d.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <span style={{flex:1}}><strong>{d.name}</strong>{d.role?` · ${d.role}`:""}{d.location?` · ${d.location}`:""}{d.email?` · ${d.email}`:""}</span>
          <button type="button" className="btn-o" style={{fontSize:11,padding:"2px 8px"}} onClick={()=>{onClose();openCandidateById(d.id);}}>Open</button>
        </div>)}
      </div>}
      <Err msg={err}/>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
        <button className="btn-o" onClick={onClose}>Cancel</button>
        {dupes
          ?<button className="btn-a" onClick={()=>save(true)} disabled={saving}>{saving?<><span className="spin"></span>Saving…</>:"Save anyway"}</button>
          :<button className="btn-a" onClick={()=>save(false)} disabled={saving}>{saving?<><span className="spin"></span>Checking…</>:"Save candidate"}</button>}
      </div>
    </div>
  </div>;
}

function CoModal({co,onClose,onSaved}){
  const blank={name:"",industry:"",website:"",logo_url:"",notes:"",status:"Active",fee_type:"percentage",fee_percentage:"",fee_fixed:"",terms_notes:"",terms_signed:false,terms_signed_date:"",terms_rebate:"",terms_payment_days:"",terms_invoice_trigger:"On start date",terms_doc_url:""};
  const [f,setF]=useState(co||blank);const [saving,setSaving]=useState(false);const [err,setErr]=useState("");
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const save=async()=>{
    if(!f.name.trim()){setErr("Company name is required");return;}
    setSaving(true);setErr("");
    const payload={...f,
      fee_percentage:f.fee_percentage?parseFloat(f.fee_percentage):null,
      fee_fixed:f.fee_fixed?parseFloat(f.fee_fixed):null,
      terms_signed:f.terms_signed===true||f.terms_signed==="true",
      terms_signed_date:f.terms_signed_date||null,
      terms_payment_days:f.terms_payment_days?parseInt(f.terms_payment_days,10):null,
      terms_rebate:(f.terms_rebate||"").trim()||null,
      terms_invoice_trigger:(f.terms_invoice_trigger||"").trim()||null,
      terms_doc_url:(f.terms_doc_url||"").trim()||null,
      logo_url:(f.logo_url||"").trim()||null,
    };
    const{error}=co?await db.from("companies").update(payload).eq("id",co.id):await db.from("companies").insert(payload);
    setSaving(false);if(error){setErr(error.message);return;}
    onSaved();onClose();
  };
  const termsPreview=React.useMemo(()=>{
    if(f.fee_type==="percentage"&&f.fee_percentage) return `${f.fee_percentage}% of basic annual salary`;
    if(f.fee_type==="fixed"&&f.fee_fixed) return `Fixed fee of £${parseFloat(f.fee_fixed).toLocaleString()}`;
    return null;
  },[f.fee_type,f.fee_percentage,f.fee_fixed]);
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h3>{co?"Edit company":"Add company"}</h3>
      <div className="fr2">
        <div><label>Company name *</label><input type="text" value={f.name} onChange={s("name")} placeholder="Barclays"/></div>
        <div><label>Industry</label><input type="text" value={f.industry||""} onChange={s("industry")} placeholder="Financial services"/></div>
      </div>
      <div className="fr2">
        <div><label>Website</label><input type="text" value={f.website||""} onChange={s("website")} placeholder="barclays.com"/></div>
        <div><label>Logo URL (optional)</label><input type="text" value={f.logo_url||""} onChange={s("logo_url")} placeholder="Leave blank to use the website"/></div>
      </div>
      <div className="fr"><label>Status</label>
        <select value={f.status} onChange={s("status")}>{["Active","On hold","Cold","Client"].map(x=><option key={x}>{x}</option>)}</select>
      </div>
      {/* Terms agreed */}
      <div style={{borderTop:"0.5px solid var(--br)",margin:"12px 0",paddingTop:12}}>
        <div style={{fontSize:12,fontWeight:500,color:"var(--t1)",marginBottom:10}}>🤝 Terms agreed</div>
        <div className="fr2">
          <div><label>Fee structure</label>
            <select value={f.fee_type||"percentage"} onChange={s("fee_type")}>
              <option value="percentage">% of basic annual salary</option>
              <option value="fixed">Fixed fee per placement</option>
              <option value="none">Not agreed yet</option>
            </select>
          </div>
          {f.fee_type==="percentage"&&<div><label>Agreed % rate</label>
            <input type="text" value={f.fee_percentage||""} onChange={s("fee_percentage")} placeholder="e.g. 15"/>
          </div>}
          {f.fee_type==="fixed"&&<div><label>Fixed fee (£)</label>
            <input type="text" value={f.fee_fixed||""} onChange={s("fee_fixed")} placeholder="e.g. 8000"/>
          </div>}
        </div>
        {termsPreview&&<div style={{background:"rgba(95,169,43,0.16)",border:"0.5px solid #97c459",borderRadius:7,padding:"8px 12px",fontSize:12,color:"#3b6d11",marginBottom:10}}>
          ✓ Terms: <strong>{termsPreview}</strong>
        </div>}
        <div className="fr2">
          <div><label>Rebate / refund period</label>
            <input type="text" value={f.terms_rebate||""} onChange={s("terms_rebate")} placeholder="e.g. 100% to 4wks, 50% to 8wks"/>
          </div>
          <div><label>Payment terms (days)</label>
            <input type="text" value={f.terms_payment_days||""} onChange={s("terms_payment_days")} placeholder="e.g. 30"/>
          </div>
        </div>
        <div className="fr2">
          <div><label>Invoice raised</label>
            <select value={f.terms_invoice_trigger||"On start date"} onChange={s("terms_invoice_trigger")}>
              {["On start date","On offer acceptance","On candidate signing","End of month of start","Other"].map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
          <div><label>Terms of business signed?</label>
            <select value={f.terms_signed===true||f.terms_signed==="true"?"true":"false"} onChange={s("terms_signed")}>
              <option value="false">Not signed yet</option>
              <option value="true">Signed</option>
            </select>
          </div>
        </div>
        {(f.terms_signed===true||f.terms_signed==="true")&&<div className="fr2">
          <div><label>Date signed</label>
            <input type="date" value={f.terms_signed_date||""} onChange={s("terms_signed_date")}/>
          </div>
          <div><label>Link to signed ToB</label>
            <input type="text" value={f.terms_doc_url||""} onChange={s("terms_doc_url")} placeholder="Drive / Dropbox link"/>
          </div>
        </div>}
        <div className="fr"><label>Other terms / notes</label>
          <textarea value={f.terms_notes||""} onChange={s("terms_notes")} placeholder="e.g. Fee based on basic salary excluding car allowance. Introductions valid 12 months." style={{minHeight:70}}/>
        </div>
      </div>
      <div className="fr"><label>Notes</label><textarea value={f.notes||""} onChange={s("notes")}/></div>
      <Err msg={err}/>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
        <button className="btn-o" onClick={onClose}>Cancel</button>
        <button className="btn-a" onClick={save} disabled={saving}>{saving?<><span className="spin"></span>Saving…</>:"Save company"}</button>
      </div>
    </div>
  </div>;
}

function JobModal({job,companies,onClose,onSaved}){
  const blank={title:"",company_id:"",salary:"",industry:"",description:"",status:"Open",salary_value:"",fee_override:false,fee_type_override:"percentage",fee_value_override:"",actual_fee:""};
  const [f,setF]=useState(job?{...job,fee_override:!!(job.fee_type_override)}:blank);
  const [saving,setSaving]=useState(false);const [err,setErr]=useState("");
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const sb=k=>e=>setF(p=>({...p,[k]:e.target.checked}));

  // Find selected company to pull terms
  const selCo=companies.find(c=>c.id===f.company_id);

  // Determine effective fee terms (override or company)
  const effFeeType=f.fee_override?(f.fee_type_override||"percentage"):(selCo?.fee_type||"none");
  const effFeeVal=f.fee_override
    ?(parseFloat(f.fee_value_override||0))
    :(effFeeType==="percentage"?parseFloat(selCo?.fee_percentage||0):parseFloat(selCo?.fee_fixed||0));

  // Auto-calculate potential fee
  const potFee=React.useMemo(()=>{
    const sv=parseFloat((f.salary_value||"").replace(/[^0-9.]/g,""));
    if(!sv||!effFeeVal||effFeeType==="none")return null;
    return effFeeType==="percentage"?Math.round(sv*(effFeeVal/100)):Math.round(effFeeVal);
  },[f.salary_value,effFeeVal,effFeeType]);

  // When company changes, reset override
  const onCoChange=e=>{setF(p=>({...p,company_id:e.target.value,fee_override:false}));};

  const save=async()=>{
    if(!f.title.trim()){setErr("Job title is required");return;}
    setSaving(true);setErr("");
    const payload={
      title:f.title,company_id:f.company_id||null,salary:f.salary,salary_value:f.salary_value,
      industry:f.industry,description:f.description,status:f.status,
      actual_fee:f.actual_fee?parseFloat(f.actual_fee):null,
      potential_fee:potFee||null,
      fee_type_override:f.fee_override?f.fee_type_override:null,
      fee_value_override:f.fee_override&&f.fee_value_override?parseFloat(f.fee_value_override):null,
    };
    const{error}=job?await db.from("jobs").update(payload).eq("id",job.id):await db.from("jobs").insert(payload);
    setSaving(false);if(error){setErr(error.message);return;}
    onSaved();onClose();
  };

  const termsLabel=selCo
    ?(selCo.fee_type==="percentage"&&selCo.fee_percentage?`${selCo.fee_percentage}% of salary (from ${selCo.name} terms)`
      :selCo.fee_type==="fixed"&&selCo.fee_fixed?`Fixed £${parseFloat(selCo.fee_fixed).toLocaleString()} (from ${selCo.name} terms)`
      :"No terms agreed for this company")
    :"Select a company to inherit terms";

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h3>{job?"Edit job":"Add job"}</h3>
      <div className="fr"><label>Job title *</label><input type="text" value={f.title} onChange={s("title")} placeholder="Senior Data Analyst"/></div>
      <div className="fr2">
        <div><label>Client company</label>
          <select value={f.company_id||""} onChange={onCoChange}>
            <option value="">— Select company —</option>
            {companies.map(c=><option key={c.id} value={c.id}>{c.name}{c.fee_percentage?` (${c.fee_percentage}%)`:c.fee_fixed?` (£${parseFloat(c.fee_fixed).toLocaleString()} fixed)`:""}</option>)}
          </select>
        </div>
        <div><label>Candidate salary (£)</label>
          <input type="text" value={f.salary_value||""} onChange={s("salary_value")} placeholder="e.g. 65000"/>
        </div>
      </div>
      <div className="fr2">
        <div><label>Display salary range</label><input type="text" value={f.salary||""} onChange={s("salary")} placeholder="£55–65k"/></div>
        <div><label>Industry</label><input type="text" value={f.industry||""} onChange={s("industry")} placeholder="Finance"/></div>
      </div>

      {/* Fee terms block */}
      <div style={{background:"var(--bg2)",borderRadius:8,padding:"12px 14px",marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:500,color:"var(--t2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.4px"}}>Fee terms</div>
        {!f.fee_override&&<div style={{fontSize:12,color:selCo?.fee_percentage||selCo?.fee_fixed?"#3b6d11":"var(--t3)",marginBottom:8}}>
          {selCo?.fee_percentage||selCo?.fee_fixed?"✓ ":""}{termsLabel}
          {selCo?.terms_notes&&<div style={{fontSize:11,color:"var(--t3)",marginTop:2}}>📋 {selCo.terms_notes}</div>}
        </div>}
        <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:"var(--t2)",cursor:"pointer",marginBottom:f.fee_override?8:0}}>
          <input type="checkbox" checked={!!f.fee_override} onChange={sb("fee_override")} style={{width:"auto"}}/>
          Override terms for this job
        </label>
        {f.fee_override&&<div style={{display:"flex",gap:8,marginTop:4}}>
          <select value={f.fee_type_override||"percentage"} onChange={s("fee_type_override")} style={{flex:1}}>
            <option value="percentage">% of salary</option>
            <option value="fixed">Fixed fee (£)</option>
          </select>
          <input type="text" value={f.fee_value_override||""} onChange={s("fee_value_override")} placeholder={f.fee_type_override==="percentage"?"e.g. 20":"e.g. 9000"} style={{flex:1}}/>
        </div>}
        {potFee&&<div style={{marginTop:10,background:"rgba(95,169,43,0.10)",border:"0.5px solid rgba(95,169,43,0.35)",borderRadius:7,padding:"8px 12px",fontSize:13,color:"#2e7a2c"}}>
          💰 Potential fee: <strong>£{potFee.toLocaleString()}</strong>
          {effFeeType==="percentage"&&<span style={{fontSize:11,color:"#7f77dd",marginLeft:6}}>({effFeeVal}% × £{parseFloat(f.salary_value||0).toLocaleString()})</span>}
        </div>}
      </div>

      <div className="fr2">
        <div><label>Status</label>
          <select value={f.status} onChange={s("status")}>{["Open","On hold","Filled","Closed"].map(x=><option key={x}>{x}</option>)}</select>
        </div>
        <div><label>Actual fee received (£)</label>
          <input type="text" value={f.actual_fee||""} onChange={s("actual_fee")} placeholder="Fill in when placed & paid"/>
        </div>
      </div>
      <div className="fr">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <label style={{marginBottom:0}}>Job description</label>
          <button type="button" onClick={async()=>{
            if(!f.title){alert("Enter a job title first");return;}
            const co=companies.find(c=>c.id===f.company_id);
            let desc="";
            setF(p=>({...p,description:"Generating…"}));
            try{await claude(
              "You are a recruitment consultant. Write a concise, engaging job description (3–4 short paragraphs). Include: role overview, key responsibilities, required skills/experience, and what makes it a great opportunity. Professional tone, no bullet points, under 250 words.",
              `Job title: ${f.title}. Company: ${co?.name||"not specified"}. Salary: ${f.salary||"competitive"}. Location: ${f.location||"UK"}. Industry: ${f.industry||co?.industry||"not specified"}.`,
              chunk=>{desc+=chunk;setF(p=>({...p,description:desc}));}
            );}catch(e){setF(p=>({...p,description:""}));alert("AI error: "+e.message);}
          }} style={{background:"none",border:"0.5px solid var(--brm)",borderRadius:6,padding:"2px 8px",fontSize:10,cursor:"pointer",color:ACCENT,display:"flex",alignItems:"center",gap:3}}>
            ✦ Generate with AI
          </button>
        </div>
        <textarea value={f.description||""} onChange={s("description")} placeholder="Required skills, experience, location…" style={{minHeight:80}}/>
      </div>
      <Err msg={err}/>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
        <button className="btn-o" onClick={onClose}>Cancel</button>
        <button className="btn-a" onClick={save} disabled={saving}>{saving?<><span className="spin"></span>Saving…</>:"Save job"}</button>
      </div>
    </div>
  </div>;
}

function useCountUp(target, duration=1200){
  const [val,setVal]=useState(0);
  useEffect(()=>{
    if(!target)return;
    let start=null;
    const from=0;
    const step=ts=>{
      if(!start)start=ts;
      const p=Math.min((ts-start)/duration,1);
      const ease=1-Math.pow(1-p,3);
      setVal(Math.round(from+(target-from)*ease));
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[target]);
  return val;
}

function RevenueTicker({label,value,sub,color,prefix="£",loading}){
  const animated=useCountUp(loading?0:value,1400);
  const fmt=n=>n>=1000000?"£"+(n/1000000).toFixed(2)+"m":n>=1000?"£"+(n/1000).toFixed(1)+"k":"£"+n.toLocaleString();
  return <div style={{background:"var(--bg)",border:`1.5px solid ${color}22`,borderRadius:10,padding:"16px 18px",position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",top:0,left:0,width:3,height:"100%",background:color,borderRadius:"10px 0 0 10px"}}/>
    <div style={{fontSize:11,color:"var(--t2)",marginBottom:4,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.5px"}}>{label}</div>
    <div style={{fontSize:28,fontWeight:600,color:loading?"var(--t3)":color,letterSpacing:"-0.5px",fontVariantNumeric:"tabular-nums",marginBottom:2}}>
      {loading?"…":fmt(animated)}

    {sub&&<div style={{fontSize:11,color:"var(--t3)"}}>{sub}</div>}
  </div>;
}

function TodayStrip({setPage}){
  const [d,setD]=useState(null);
  const [showAll,setShowAll]=useState(false);
  const today=new Date().toISOString().split("T")[0];
  const load=useCallback(()=>{
    Promise.all([
      db.from("tasks").select("*").eq("done",false).lte("due_date",today).order("due_date").order("due_time"),
      db.from("job_candidates").select("id,stage,candidates(id,name),jobs(title,status,companies(name))").in("stage",["Interview","2nd Interview","Offer"]),
      db.from("placements").select("*"),
      db.from("companies").select("name,terms_payment_days,terms_rebate"),
    ]).then(([{data:t},{data:i},{data:pl},{data:cos}])=>{
      const money=(pl||[]).map(p=>({p,m:placementMoney(p,cos||[])}));
      setD({
        tasks:t||[],
        interviews:(i||[]).filter(x=>!x.jobs||x.jobs.status==="Open"),
        overdueInv:money.filter(x=>x.m.invoice==="overdue"),
        dueInv:money.filter(x=>x.m.invoice==="due_soon"),
        toInvoice:money.filter(x=>x.m.invoice==="to_invoice"),
      });
    });
  },[today]);
  useEffect(()=>{load();},[load]);
  if(!d)return <div className="g-canvas"><div className="today-tiles">{[0,1,2,3].map(i=><div key={i} className="today-tile skel" style={{height:46}}/>)}</div><div className="skel" style={{height:14,width:"40%",marginTop:16,borderRadius:6}}/><div className="skel" style={{height:14,width:"55%",marginTop:10,borderRadius:6}}/></div>;
  const overdue=d.tasks.filter(t=>t.due_date<today),dueToday=d.tasks.filter(t=>t.due_date===today);
  const sum=l=>l.reduce((t,x)=>t+(parseFloat(x.p.fee_amount)||0),0);
  const done=async t=>{
    setD(prev=>({...prev,tasks:prev.tasks.filter(x=>x.id!==t.id)}));
    await db.from("tasks").update({done:true}).eq("id",t.id);
  };
  const tiles=[
    {n:overdue.length,l:`overdue task${overdue.length!==1?"s":""}`,tone:overdue.length?"bad":"ok",go:()=>setPage("tasks")},
    {n:dueToday.length,l:"due today",tone:dueToday.length?"warn":"ok",go:()=>setPage("tasks")},
    {n:d.interviews.length,l:`at interview or offer`,tone:"ok",go:()=>setPage("jobs")},
    d.overdueInv.length
      ?{n:`£${Math.round(sum(d.overdueInv)).toLocaleString()}`,l:`invoice${d.overdueInv.length!==1?"s":""} overdue`,tone:"bad",go:()=>setPage("placements")}
      :d.dueInv.length
        ?{n:`£${Math.round(sum(d.dueInv)).toLocaleString()}`,l:"due in 7 days",tone:"warn",go:()=>setPage("placements")}
        :{n:d.toInvoice.length,l:`to invoice`,tone:d.toInvoice.length?"warn":"ok",go:()=>setPage("placements")},
  ];
  const toneCol={bad:"#a32d2d",warn:"#ba7517",ok:"var(--g-ink)"};
  const list=showAll?d.tasks:d.tasks.slice(0,4);
  const nothing=!d.tasks.length&&!d.interviews.length&&!d.overdueInv.length&&!d.dueInv.length;
  return <div className="g-canvas">
    <div className="today-tiles">
      {tiles.map((t,ix)=><button key={ix} onClick={t.go} className="today-tile">
        <span className="g-num" style={{fontSize:24,color:t.tone==="ok"&&!t.n?"var(--g-mute)":toneCol[t.tone]}}>{t.n}</span>
        <span style={{fontSize:11,color:"var(--g-mute)",textAlign:"left",lineHeight:1.3}}>{t.l}</span>
      </button>)}
    </div>
    <TodayMeetings/>
    {nothing&&<div style={{fontSize:12,color:"var(--g-mute)",marginTop:12}}>Nothing due. A good moment to call a few candidates.</div>}
    {d.tasks.length>0&&<div style={{marginTop:14,display:"flex",flexDirection:"column",gap:2}}>
      {list.map(t=>{
        const od=t.due_date<today;
        return <div key={t.id} className="today-task">
          <button onClick={()=>done(t)} title="Mark done" className="today-check" aria-label="Mark done"/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,color:"var(--g-ink)",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</div>
            <div style={{fontSize:11,color:od?"#a32d2d":"var(--g-mute)"}}>{od?`Overdue · ${niceDate(t.due_date)}`:"Today"}{t.due_time?` · ${String(t.due_time).slice(0,5)}`:""}</div>
          </div>
        </div>;
      })}
      {d.tasks.length>4&&<button onClick={()=>setShowAll(v=>!v)} style={{alignSelf:"flex-start",background:"none",border:"none",padding:"6px 0 0",cursor:"pointer",fontSize:11,fontWeight:600,color:"var(--g-deep)",fontFamily:"var(--g-face)"}}>
        {showAll?"Show fewer":`Show all ${d.tasks.length} →`}
      </button>}
    </div>}
  </div>;
}

function DashboardPage({setPage}){
  const [stats,setStats]=useState({c:0,j:0,t:0,co:0});
  const [revenue,setRevenue]=useState({potential:0,actual:0,placed:0,paid:0,invoiced:0,toInvoice:0,toInvoiceCount:0,interviewJobs:[]});
  const [recent,setRecent]=useState([]);
  const [topJobs,setTopJobs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [lastRefresh,setLastRefresh]=useState(null);
  const [target,setTarget]=useState(getTarget());
  const [showPlay,setShowPlay]=useState(false);

  const editTarget=()=>{
    const v=prompt("Annual fee target (£)",String(target));
    if(v===null)return;
    const n=parseFloat(String(v).replace(/[^0-9.]/g,""));
    if(!n||n<=0)return;
    localStorage.setItem("gaiaTarget",String(n));
    setTarget(n);
  };

  // Interview-qualifying stages
  const INTERVIEW_STAGES=["Interview","2nd Interview","Offer","Placed"];

  // Always calculate from company terms — never rely on stored potential_fee
  // because that may not have been saved if job was added before fee terms existed
  const calcFee=(job)=>{
    const co=job.companies||{};
    // Use override if set on job, otherwise fall back to company terms
    const feeType=job.fee_type_override||co.fee_type||"none";
    const feeVal=job.fee_type_override
      ?(parseFloat(job.fee_value_override||0))
      :(feeType==="percentage"
          ?parseFloat(co.fee_percentage||0)
          :parseFloat(co.fee_fixed||0));
    // salary_value may be a string like "65000" or "£65,000" — strip non-numeric
    const salNum=parseFloat((job.salary_value||"").toString().replace(/[^0-9.]/g,""));
    if(feeType==="none"||!feeVal) return 0;
    if(feeType==="fixed") return Math.round(feeVal);
    if(!salNum) return 0;
    return Math.round(salNum*(feeVal/100));
  };

  const loadData=useCallback(async()=>{
    setLoading(true);
    try {
      const [c,j,t,co,r,openJobs,filledJobs,topFeeJobs,placementsData] = await Promise.all([
        db.from("candidates").select("*",{count:"exact",head:true}),
        db.from("jobs").select("*",{count:"exact",head:true}).eq("status","Open"),
        db.from("tasks").select("*",{count:"exact",head:true}).eq("done",false),
        db.from("companies").select("*",{count:"exact",head:true}),
        db.from("candidates").select("*").order("created_at",{ascending:false}).limit(5),
        // Critical: fetch job_candidates with stage so we can check interview status
        db.from("jobs")
          .select("id,title,salary_value,potential_fee,actual_fee,status,fee_type_override,fee_value_override,companies(name,fee_type,fee_percentage,fee_fixed),job_candidates(id,stage)")
          .eq("status","Open"),
        db.from("jobs")
          .select("id,title,actual_fee,potential_fee,status,companies(name)")
          .in("status",["Filled","Placed"]),
        db.from("jobs")
          .select("id,title,potential_fee,actual_fee,status,companies(name)")
          .or("potential_fee.not.is.null,actual_fee.not.is.null")
          .order("potential_fee",{ascending:false,nullsFirst:false})
          .limit(6),
        db.from("placements").select("id,job_id,job_title,company_name,fee_amount,payment_received,invoice_date"),
      ]);

      setStats({c:c.count||0,j:j.count||0,t:t.count||0,co:co.count||0});
      setRecent(r.data||[]);
      setTopJobs(topFeeJobs.data||[]);

      const open=openJobs.data||[];
      const filled=filledJobs.data||[];
      const placements=placementsData.data||[];

      // A job qualifies for potential revenue only if at least one candidate
      // in its pipeline has reached Interview, 2nd Interview, Offer, or Placed
      const placedFromPipeline=open.filter(job=>{
        const entries=job.job_candidates||[];
        return entries.some(e=>e.stage==="Placed");
      });
      const placedIds=new Set(placedFromPipeline.map(j=>j.id));

      // A job qualifies for POTENTIAL revenue only if a candidate has reached
      // Interview / 2nd Interview / Offer AND nobody is Placed yet. Once someone
      // is placed the fee is won, so it belongs in actual — counting it in both
      // would double it.
      const interviewQualified=open.filter(job=>{
        if(placedIds.has(job.id)) return false;
        const entries=job.job_candidates||[];
        return entries.some(e=>INTERVIEW_STAGES.includes(e.stage));
      });

      const potential=interviewQualified.reduce((sum,job)=>sum+calcFee(job),0);

      // Actual revenue = every recorded placement, PLUS any job won in the
      // pipeline that has no placement record yet (so the number is never
      // silently wrong while paperwork is outstanding). Jobs already covered by
      // a placement row are skipped so nothing is counted twice.
      // Match placements to jobs by id, and also by title+company so that
      // placements typed in by hand (no job_id) still de-duplicate correctly.
      const norm=v=>(v||"").toString().trim().toLowerCase();
      const placementJobIds=new Set(placements.map(p=>p.job_id).filter(Boolean));
      const placementKeys=new Set(placements.map(p=>norm(p.job_title)+"|"+norm(p.company_name)).filter(k=>k!=="|"));
      const alreadyRecorded=job=>placementJobIds.has(job.id)
        ||placementKeys.has(norm(job.title)+"|"+norm(job.companies?.name));
      const unrecordedPlaced=placedFromPipeline.filter(j=>!alreadyRecorded(j));
      const unrecordedFilled=filled.filter(j=>!alreadyRecorded(j));

      const actual=placements.reduce((sum,p)=>sum+(parseFloat(p.fee_amount)||0),0)
        + unrecordedPlaced.reduce((sum,job)=>sum+calcFee(job),0)
        + unrecordedFilled.reduce((sum,j)=>sum+(parseFloat(j.actual_fee)||parseFloat(j.potential_fee)||0),0);
      const placed=placements.length+unrecordedPlaced.length+unrecordedFilled.length;

      // Split what is placed into cash received, invoiced but unpaid, and not
      // yet invoiced — "placed" is not money in the bank until it is paid.
      const fa=p=>parseFloat(p.fee_amount)||0;
      const paid=placements.filter(p=>p.payment_received).reduce((t,p)=>t+fa(p),0);
      const invoiced=placements.filter(p=>!p.payment_received&&p.invoice_date).reduce((t,p)=>t+fa(p),0);
      const toInvoice=Math.max(0,actual-paid-invoiced);
      const toInvoiceCount=placements.filter(p=>!p.payment_received&&!p.invoice_date).length+unrecordedPlaced.length+unrecordedFilled.length;
      setRevenue({potential,actual,placed,paid,invoiced,toInvoice,toInvoiceCount,interviewJobs:interviewQualified});
      setLastRefresh(new Date());
    } catch(e) { console.error("Dashboard load error",e); }
    setLoading(false);
  },[]);

  // Load on mount and auto-refresh every 60 seconds
  useEffect(()=>{ loadData(); const id=setInterval(loadData,60000); return()=>clearInterval(id); },[loadData]);

  const statCards=[
    {l:"Candidates",v:loading?"…":stats.c,col:"#5b6577"},
    {l:"Active jobs",v:loading?"…":stats.j,col:"#1d9e75"},
    {l:"Companies",v:loading?"…":stats.co,col:"#ba7517"},
    {l:"Pending tasks",v:loading?"…":stats.t,col:"#993556"},
  ];

  const fmtTime=d=>d?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"—";

  return <div>
    <div style={{display:"flex",alignItems:"baseline",gap:12,marginBottom:14,flexWrap:"wrap"}}>
      <span style={{fontFamily:"var(--g-face)",fontSize:17,fontWeight:800,letterSpacing:"-0.4px",color:"var(--t1)"}}>Today</span>
      <span style={{height:5,width:5,borderRadius:"50%",background:"var(--g-green)"}}/>
      <span style={{fontSize:12,color:"var(--t3)"}}>
        {new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}
      </span>
    </div>

    <TodayStrip setPage={setPage}/>

    {/* ── Revenue seam: progress against the year's target ── */}
    <div className="g-canvas">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:12,flexWrap:"wrap",marginBottom:14}}>
        <div className="g-eyebrow">Fee position</div>
        <button onClick={editTarget} title="Click to change your target"
          style={{background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"var(--g-face)",fontSize:11,fontWeight:600,letterSpacing:"1px",textTransform:"uppercase",color:"var(--g-mute)"}}>
          Target £{target.toLocaleString()}
        </button>
      </div>

      <div style={{display:"flex",gap:44,flexWrap:"wrap",alignItems:"flex-start",marginBottom:18}}>
        <div>
          <div className="g-num" style={{fontSize:38,color:"var(--g-ink)"}}>
            {loading?"—":`£${revenue.actual.toLocaleString()}`}
          </div>
          <div className="g-eyebrow" style={{marginTop:9,color:"var(--g-ink)"}}>Placed</div>
          <div style={{fontSize:11,color:"var(--g-mute)",marginTop:3}}>
            {revenue.placed||0} placement{revenue.placed!==1?"s":""} this year
          </div>
          {!loading&&<div className="fee-break" style={{display:"flex",flexDirection:"column",gap:3,marginTop:10,fontSize:12}}>
            {[["Cash received",revenue.paid,"var(--g-deep)",1],["Invoiced, awaiting payment",revenue.invoiced,"var(--g-lime)",1],[`Not invoiced yet${revenue.toInvoiceCount?` (${revenue.toInvoiceCount})`:""}`,revenue.toInvoice,"var(--g-lime)",0.5]].map(([l,v,col,op])=>
              <div key={l} style={{display:"flex",alignItems:"center",gap:7}}>
                <span style={{width:9,height:9,borderRadius:2,background:col,opacity:op,flexShrink:0}}/>
                <span className="g-num" style={{fontSize:13,color:"var(--g-ink)",minWidth:62}}>£{Math.round(v||0).toLocaleString()}</span>
                <span style={{color:"var(--g-mute)"}}>{l}</span>
              </div>)}
          </div>}
        </div>
        <div>
          <div className="g-num" style={{fontSize:38,color:"var(--g-deep)"}}>
            {loading?"—":`£${revenue.potential.toLocaleString()}`}
          </div>
          <div className="g-eyebrow" style={{marginTop:9,color:"var(--g-deep)"}}>In play</div>
          <button onClick={()=>setShowPlay(v=>!v)} disabled={!revenue.interviewJobs?.length} style={{background:"none",border:"none",padding:0,marginTop:3,cursor:revenue.interviewJobs?.length?"pointer":"default",fontSize:11,color:revenue.interviewJobs?.length?"var(--g-deep)":"var(--g-mute)",fontFamily:"inherit",textAlign:"left"}}>
            {loading?"…":`${revenue.interviewJobs?.length||0} job${revenue.interviewJobs?.length!==1?"s":""} at interview or beyond`}{revenue.interviewJobs?.length?(showPlay?" ▾":" ▸"):""}
          </button>
        </div>
        <div>
          <div className="g-num" style={{fontSize:38,color:"var(--g-mute)"}}>
            {loading?"—":`£${Math.max(0,target-revenue.actual-revenue.potential).toLocaleString()}`}
          </div>
          <div className="g-eyebrow" style={{marginTop:9}}>Still to find</div>
          <div style={{fontSize:11,color:"var(--g-mute)",marginTop:3}}>
            to reach £{target.toLocaleString()}
          </div>
        </div>
      </div>

      {/* Progress toward target: solid = banked, pale = in play */}
      {(()=>{
        const seg=v=>Math.max(0,(v||0)/target*100);
        let left=100;const take=v=>{const w=Math.min(left,seg(v));left-=w;return w;};
        const paidPct=take(revenue.paid),invPct=take(revenue.invoiced),toInvPct=take(revenue.toInvoice),playPct=take(revenue.potential);
        const pctOfTarget=Math.round((revenue.actual/target)*100);

// ── Money: invoice due dates and rebate periods ───────────────────────────
// Uses each client's terms (Companies → Edit → Terms agreed):
//   payment terms (days)  → invoice due date (30 days if not set)
//   rebate / refund period → how long after the start date the fee is at risk
function rebateDays(text){
  // "100% to 4wks, 50% to 8wks" → 56. Takes the longest period mentioned.
  let max=0;const re=/(\d+)\s*(weeks?|wks?|w|months?|mths?|mo|m|days?|d)\b/gi;let m;
  while((m=re.exec(text||""))!==null){
    const n=parseInt(m[1],10),u=m[2].toLowerCase();
    const d=u.startsWith("w")?n*7:u.startsWith("m")?n*30:n;
    if(d>max)max=d;
  }
  return max||null;
}
// Works in local dates (toISOString would shift a day during UK summer time)
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);const z=x=>String(x).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);

// ── Add candidates to hotlists (from anywhere) ─────────────────────────────
// One candidate: tick/untick each list and it saves straight away.
// Several candidates: tick lists, then "Add" puts them all in (skipping repeats).
function HotlistPicker({cands,onClose,onChanged}){
  const ids=cands.map(c=>c.id);
  const single=cands.length===1;
  const [lists,setLists]=useState(null);
  const [member,setMember]=useState({});   // hotlist_id → how many of these candidates are on it
  const [picked,setPicked]=useState(new Set());
  const [busy,setBusy]=useState(null);
  const [newName,setNewName]=useState("");
  const [err,setErr]=useState("");
  const [done,setDone]=useState("");
  const load=useCallback(async()=>{
    const[{data:l,error},{data:m}]=await Promise.all([
      db.from("hotlists").select("id,name,created_at").order("created_at",{ascending:false}),
      db.from("hotlist_candidates").select("hotlist_id,candidate_id").in("candidate_id",ids),
    ]);
    if(error){setErr(error.message);return;}
    const cnt={};(m||[]).forEach(r=>{cnt[r.hotlist_id]=(cnt[r.hotlist_id]||0)+1;});
    setLists(l||[]);setMember(cnt);
  },[ids.join(",")]);
  useEffect(()=>{load();},[load]);

  const toggleSingle=async l=>{
    setBusy(l.id);setErr("");
    const on=!!member[l.id];
    const{error}=on
      ?await db.from("hotlist_candidates").delete().eq("hotlist_id",l.id).eq("candidate_id",ids[0])
      :await db.from("hotlist_candidates").insert({hotlist_id:l.id,candidate_id:ids[0]});
    if(error)setErr(error.message);
    setMember(m=>({...m,[l.id]:on?0:1}));
    setBusy(null);onChanged&&onChanged();
  };
  const addMany=async()=>{
    setBusy("many");setErr("");
    let added=0;
    for(const hid of picked){
      const{data:ex}=await db.from("hotlist_candidates").select("candidate_id").eq("hotlist_id",hid).in("candidate_id",ids);
      const have=new Set((ex||[]).map(r=>r.candidate_id));
      const rows=ids.filter(id=>!have.has(id)).map(id=>({hotlist_id:hid,candidate_id:id}));
      if(rows.length){const{error}=await db.from("hotlist_candidates").insert(rows);if(error){setErr(error.message);break;}added+=rows.length;}
    }
    setBusy(null);onChanged&&onChanged();
    setDone(`Added ${added} to ${picked.size} hotlist${picked.size!==1?"s":""}`);
    setPicked(new Set());load();
  };
  const createList=async()=>{
    const name=newName.trim();if(!name)return;
    setBusy("new");setErr("");
    const{data,error}=await db.from("hotlists").insert({name}).select("id,name,created_at").single();
    if(error){setErr(error.message);setBusy(null);return;}
    setNewName("");
    if(single){await db.from("hotlist_candidates").insert({hotlist_id:data.id,candidate_id:ids[0]});onChanged&&onChanged();}
    else setPicked(p=>new Set([...p,data.id]));
    setBusy(null);load();
  };

  return <div className="modal-overlay" style={{zIndex:1100}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:420}}>
      <h3>🔥 {single?`Hotlists — ${cands[0].name}`:`Add ${cands.length} candidates to a hotlist`}</h3>
      {single&&<div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}>Tick a list to add them, untick to take them off.</div>}
      <Err msg={err}/>
      {done&&<div style={{background:"rgba(95,169,43,0.16)",border:"0.5px solid #97c459",color:"#3b6d11",borderRadius:8,padding:"7px 10px",fontSize:12,marginBottom:8}}>✓ {done}</div>}
      {!lists?<Spin/>:<div style={{maxHeight:"45vh",overflowY:"auto",display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
        {lists.length===0&&<div style={{fontSize:12,color:"var(--t3)",padding:"10px 0"}}>No hotlists yet — create one below.</div>}
        {lists.map(l=>{
          const n=member[l.id]||0;
          const on=single?n>0:picked.has(l.id);
          return <label key={l.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,cursor:"pointer",
            background:on?"rgba(95,169,43,0.10)":"var(--bg2)",border:"0.5px solid "+(on?"rgba(95,169,43,0.45)":"transparent")}}>
            <input type="checkbox" checked={on} disabled={busy===l.id||busy==="many"} style={{width:16,height:16,accentColor:ACCENT,flexShrink:0}}
              onChange={()=>single?toggleSingle(l):setPicked(p=>{const x=new Set(p);x.has(l.id)?x.delete(l.id):x.add(l.id);return x;})}/>
            <span style={{flex:1,fontSize:13,color:"var(--t1)"}}>{l.name}</span>
            {!single&&n>0&&<span style={{fontSize:11,color:"var(--t3)"}}>{n} already on it</span>}
            {busy===l.id&&<span className="spin" style={{margin:0}}></span>}
          </label>;
        })}
      </div>}
      <div style={{display:"flex",gap:6}}>
        <input type="text" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="New hotlist name…" onKeyDown={e=>e.key==="Enter"&&createList()}/>
        <button className="btn-o" style={{whiteSpace:"nowrap"}} disabled={!newName.trim()||busy==="new"} onClick={createList}>+ Create</button>
      </div>
      <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
        {single
          ?<button className="btn-a" onClick={onClose}>Done</button>
          :<><button className="btn-o" onClick={onClose}>Close</button>
            <button className="btn-a" disabled={!picked.size||busy==="many"} onClick={addMany}>{busy==="many"?<><span className="spin"></span>Adding…</>:`Add to ${picked.size||""} hotlist${picked.size===1?"":"s"}`}</button></>}
      </div>
    </div>
  </div>;
}

function linkedinSearchUrl(c){

// One date style everywhere: "14 Dec" this year, "14 Dec 2025" otherwise,
// and "14 Dec · 10:30" when a time matters.
function fmtDate(iso){
  if(!iso)return "";
  const d=new Date(String(iso).slice(0,10)+"T12:00:00");
  if(isNaN(d))return String(iso);
  const sameYear=d.getFullYear()===new Date().getFullYear();
  return d.toLocaleDateString("en-GB",sameYear?{day:"numeric",month:"short"}:{day:"numeric",month:"short",year:"numeric"});
}
function fmtDateTime(ts){
  if(!ts)return "";
  const d=new Date(ts);
  if(isNaN(d))return String(ts);
  return fmtDate(d.toISOString())+" · "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
// For timestamps: local calendar date, same style
const fmtStamp=ts=>{if(!ts)return "";const d=new Date(ts);if(isNaN(d))return String(ts);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return fmtDate(`${y}-${m}-${dd}`);};
const niceDate=iso=>fmtDate(iso);
function placementMoney(p,companies){
  const today=todayStr();
  const co=(companies||[]).find(c=>(c.name||"").trim().toLowerCase()===(p.company_name||"").trim().toLowerCase())||{};
  const payDays=parseInt(co.terms_payment_days,10)||30;
  const out={payDays,payDaysDefault:!co.terms_payment_days};
  if(p.payment_received)out.invoice="paid";
  else if(p.invoice_date){
    out.dueDate=addDays(p.invoice_date,payDays);
    const late=daysBetween(out.dueDate,today);
    out.daysLate=late;
    out.invoice=late>0?"overdue":late>=-7?"due_soon":"invoiced";
  }else{
    out.invoice=(!p.start_date||p.start_date<=today)?"to_invoice":"not_started";
  }
  const rd=rebateDays(co.terms_rebate);
  out.rebateKnown=!!rd;
  out.started=!!p.start_date&&p.start_date<=today;
  if(rd&&p.start_date){
    out.rebateEnd=addDays(p.start_date,rd);
    out.rebateLeft=daysBetween(today,out.rebateEnd);
    out.inRebate=out.started&&out.rebateLeft>0; // the rebate clock only runs once they've started
  }
  return out;
}

function MoneyToChase({setPage}){
  const [items,setItems]=useState(null);

      db.from("placements").select("*"),

    ]).then(([{data:pl},{data:cos}])=>{
      setItems((pl||[]).map(p=>({p,m:placementMoney(p,cos||[])})));
    });
  },[]);
  if(!items)return null;
  const fee=p=>`£${(parseFloat(p.fee_amount)||0).toLocaleString()}`;
  const overdue=items.filter(x=>x.m.invoice==="overdue").sort((a,b)=>b.m.daysLate-a.m.daysLate);
  const dueSoon=items.filter(x=>x.m.invoice==="due_soon");
  const toInvoice=items.filter(x=>x.m.invoice==="to_invoice");
  const rebate=items.filter(x=>x.m.inRebate).sort((a,b)=>a.m.rebateLeft-b.m.rebateLeft);
  if(!overdue.length&&!dueSoon.length&&!toInvoice.length&&!rebate.length)return null;

    </div>
    <Group title="Overdue invoices" list={overdue}>{overdue.map(x=><Row key={x.p.id} x={x} colour="#c0392b" right={`⚠️ ${x.m.daysLate} day${x.m.daysLate!==1?"s":""} overdue · was due ${niceDate(x.m.dueDate)}`}/>)}</Group>
    <Group title="Due in the next 7 days" list={dueSoon}>{dueSoon.map(x=><Row key={x.p.id} x={x} colour="#ba7517" right={`Due ${niceDate(x.m.dueDate)}`}/>)}</Group>
    <Group title="Ready to invoice" list={toInvoice}>{toInvoice.map(x=><Row key={x.p.id} x={x} colour="#185fa5" right={x.p.start_date?`Started ${niceDate(x.p.start_date)} — no invoice recorded yet`:"No invoice recorded yet"}/>)}</Group>
    <Group title="Inside rebate period" list={rebate}>{rebate.map(x=><Row key={x.p.id} x={x} colour="#7f77dd" right={`🛡 Fee at risk until ${niceDate(x.m.rebateEnd)} · ${x.m.rebateLeft} day${x.m.rebateLeft!==1?"s":""} to go`}/>)}</Group>
  </div>;
