function EmailSequencesPage(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [candidates,setCandidates]=useState([]);
  const [companies,setCompanies]=useState([]);
  const blank={name:"",target_type:"candidate",target_id:"",target_name:"",steps:[
    {day:0,subject:"Introduction",body:"Hi {{name}},\n\nI hope this finds you well.\n\nBest,\nShaun"},
    {day:3,subject:"Following up",body:"Hi {{name}},\n\nJust following up on my previous message.\n\nBest,\nShaun"},
    {day:7,subject:"Last chase",body:"Hi {{name}},\n\nI wanted to reach out one more time.\n\nBest,\nShaun"},
  ],status:"active"};
  const [f,setF]=useState(blank);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  const load=useCallback(async()=>{
    setLoading(true);
    const[{data:seqs},{data:cands},{data:cos}]=await Promise.all([
      db.from("email_sequences").select("*").order("created_at",{ascending:false}),
      allRows(()=>db.from("candidates").select("id,name").order("name").order("id")),
      db.from("companies").select("id,name").order("name"),
    ]);
    setRows(seqs||[]);setCandidates(cands||[]);setCompanies(cos||[]);setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!f.name.trim())return setErr("Name required");
    setSaving(true);setErr("");
    const{error}=await db.from("email_sequences").insert({...f,steps:JSON.stringify(f.steps)});
    if(error)setErr(error.message);else{setModal(false);setF(blank);load();}
    setSaving(false);
  };

  const del=async id=>{if(!confirm("Delete sequence?"))return;await db.from("email_sequences").delete().eq("id",id);load();};

  const targets=f.target_type==="candidate"?candidates:companies;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:15,fontWeight:500}}>Email Sequences</div>
      <button className="btn-a" onClick={()=>{setF(blank);setModal(true);}}>+ New Sequence</button>
    </div>
    <div style={{background:"rgba(186,117,23,0.14)",border:"0.5px solid #e8c97a",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#854f0b",marginBottom:14}}>
      ℹ️ Sequences are a planning tool — use them to track your outreach schedule. Copy the email body and send manually via Outlook.
    </div>
    {loading?<Spin/>:
    rows.length===0?<div style={{color:"var(--t3)",fontSize:13,padding:"40px 0",textAlign:"center"}}>No sequences yet. Click "+ New Sequence" to create one.</div>:
    <div style={{display:"grid",gap:10}}>
      {rows.map(r=>{
        const steps=typeof r.steps==="string"?JSON.parse(r.steps):r.steps||[];
        return <div key={r.id} style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontWeight:500,fontSize:14}}>{r.name}</div>
              <div style={{fontSize:11,color:"var(--t2)",marginTop:2}}>{r.target_type} · Started {fmtDate(r.started_date)}</div>
            </div>
            <button className="btn-d" onClick={()=>del(r.id)}>Delete</button>
          </div>
          <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
            {steps.map((step,i)=><div key={i} style={{background:"var(--bg2)",borderRadius:8,padding:"8px 12px",border:"0.5px solid var(--br)",minWidth:120}}>
              <div style={{fontSize:10,color:"var(--t3)",marginBottom:2}}>Day {step.day}</div>
              <div style={{fontSize:12,fontWeight:500}}>{step.subject}</div>
            </div>)}
          </div>
        </div>;
      })}
    </div>}
    {modal&&<div className="modal-overlay" onClick={()=>setModal(false)}>
      <div className="modal" style={{maxWidth:600}} onClick={e=>e.stopPropagation()}>
        <h3>New Email Sequence</h3>
        <div className="fr"><label>Sequence Name</label><input value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))} placeholder="e.g. Ecologist BD outreach"/></div>
        <div className="fr2">
          <div className="fr" style={{margin:0}}><label>Target Type</label>
            <select value={f.target_type} onChange={e=>setF(p=>({...p,target_type:e.target.value,target_id:"",target_name:""}))}>
              <option value="candidate">Candidate</option><option value="company">Company</option>
            </select>
          </div>
          <div className="fr" style={{margin:0}}><label>Target</label>
            <select value={f.target_id} onChange={e=>{
              const t=targets.find(x=>x.id===e.target.value);
              setF(p=>({...p,target_id:e.target.value,target_name:t?.name||""}));
            }}>
              <option value="">Select…</option>
              {targets.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
        </div>
        <div style={{fontSize:12,fontWeight:500,marginBottom:8,marginTop:4}}>Steps</div>
        {f.steps.map((step,i)=><div key={i} style={{background:"var(--bg2)",borderRadius:8,padding:12,marginBottom:8,border:"0.5px solid var(--br)"}}>
          <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
            <div style={{fontSize:11,color:"var(--t2)",whiteSpace:"nowrap"}}>Day:</div>
            <input type="number" value={step.day} onChange={e=>{const st=[...f.steps];st[i]={...st[i],day:parseInt(e.target.value)||0};setF(p=>({...p,steps:st}));}} style={{width:60}}/>
            <div style={{fontSize:11,color:"var(--t2)",whiteSpace:"nowrap"}}>Subject:</div>
            <input value={step.subject} onChange={e=>{const st=[...f.steps];st[i]={...st[i],subject:e.target.value};setF(p=>({...p,steps:st}));}}/>
          </div>
          <textarea value={step.body} onChange={e=>{const st=[...f.steps];st[i]={...st[i],body:e.target.value};setF(p=>({...p,steps:st}));}} style={{minHeight:80,fontSize:12}}/>
        </div>)}
        {err&&<div className="err">{err}</div>}
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
          <button className="btn-o" onClick={()=>setModal(false)}>Cancel</button>
          <button className="btn-a" onClick={save} disabled={saving}>{saving?"Saving…":"Create Sequence"}</button>
        </div>
      </div>
    </div>}
  </div>;
}

// ============================================================
// FEATURE 4: PLACEMENTS
// ============================================================
function PlacementsPage(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [candidates,setCandidates]=useState([]);
  const [jobs,setJobs]=useState([]);
  const blank={candidate_id:"",job_id:"",candidate_name:"",job_title:"",company_name:"",start_date:"",salary:"",fee_amount:"",fee_percentage:"",invoice_date:"",invoice_number:"",payment_received:false,payment_date:"",notes:""};
  const [f,setF]=useState(blank);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const [cos,setCos]=useState([]);
  const load=useCallback(async()=>{
    setLoading(true);
    const[{data:pl},{data:cands},{data:js},{data:co}]=await Promise.all([
      db.from("placements").select("*").order("created_at",{ascending:false}),
      allRows(()=>db.from("candidates").select("id,name").order("name").order("id")),
      db.from("jobs").select("id,title,companies(name)").order("title"),
      db.from("companies").select("name,terms_payment_days,terms_rebate"),
    ]);
    setRows(pl||[]);setCandidates(cands||[]);setJobs(js||[]);setCos(co||[]);setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!f.candidate_name.trim())return setErr("Candidate name required");
    setSaving(true);setErr("");
    const payload={
      candidate_id:f.candidate_id||null,
      job_id:f.job_id||null,
      candidate_name:f.candidate_name.trim(),
      job_title:f.job_title.trim(),
      company_name:f.company_name.trim(),
      start_date:f.start_date||null,
      salary:f.salary?parseFloat(f.salary):null,
      fee_amount:f.fee_amount?parseFloat(f.fee_amount):null,
      fee_percentage:f.fee_percentage?parseFloat(f.fee_percentage):null,
      invoice_date:f.invoice_date||null,
      invoice_number:f.invoice_number.trim()||null,
      payment_received:f.payment_received==="true"||f.payment_received===true,
      payment_date:f.payment_date||null,
      notes:f.notes.trim()||null,
    };
    const{error}=editId
      ?await db.from("placements").update(payload).eq("id",editId)
      :await db.from("placements").insert(payload);
    if(error)setErr(error.message);else{setModal(false);setF(blank);setEditId(null);load();}
    setSaving(false);
  };
  // Open the form pre-filled to change an existing placement
  const [editId,setEditId]=useState(null);
  const openEdit=r=>{
    const str=v=>v===null||v===undefined?"":String(v);
    setF({...blank,...Object.fromEntries(Object.keys(blank).map(k=>[k,k==="payment_received"?!!r[k]:str(r[k])]))});
    setEditId(r.id);setErr("");setModal(true);
  };

  // ── Invoice files ── stored in the PRIVATE "invoices" bucket; opened with a 1-hour signed link
  const invRef=React.useRef(null);
  const [invFor,setInvFor]=useState(null);   // placement row awaiting a file
  const [invBusy,setInvBusy]=useState(null); // id of row currently uploading
  const [invErr,setInvErr]=useState("");
  const [invNoFor,setInvNoFor]=useState(null); // row whose invoice number is being edited
  const [invNo,setInvNo]=useState("");
  const pickInvoice=r=>{setInvFor(r);setInvErr("");invRef.current&&invRef.current.click();};
  const uploadInvoice=async e=>{
    const file=e.target.files[0];e.target.value="";
    const r=invFor;setInvFor(null);
    if(!file||!r)return;
    if(file.size>10*1024*1024){setInvErr("File too large (max 10MB)");return;}
    setInvBusy(r.id);setInvErr("");
    const ext=(file.name.split(".").pop()||"pdf").toLowerCase();
    const path=`placements/${r.id}_${Date.now()}.${ext}`;
    const{error:upErr}=await db.storage.from("invoices").upload(path,file,{upsert:true,contentType:file.type||undefined});
    if(upErr){setInvErr("Upload failed: "+upErr.message+(/bucket/i.test(upErr.message)?" — run the invoice setup SQL in Supabase first.":""));setInvBusy(null);return;}
    const today=new Date().toISOString().split("T")[0];
    const{error:dbErr}=await db.from("placements")
      .update({invoice_path:path,invoice_filename:file.name,invoice_date:r.invoice_date||today}).eq("id",r.id);
    if(dbErr){setInvErr("Saved the file but couldn't link it: "+dbErr.message+(/column/i.test(dbErr.message)?" — run the invoice setup SQL in Supabase first.":""));setInvBusy(null);return;}
    if(r.invoice_path&&r.invoice_path!==path) await db.storage.from("invoices").remove([r.invoice_path]);
    setInvBusy(null);load();
  };
  const viewInvoice=async r=>{
    const tab=window.open("","_blank");
    const{data,error}=await db.storage.from("invoices").createSignedUrl(r.invoice_path,3600);
    if(error||!data?.signedUrl){if(tab)tab.close();setInvErr("Could not open invoice: "+(error?.message||"not found"));return;}
    if(tab)tab.location.href=data.signedUrl;else window.location.href=data.signedUrl;
  };
  const removeInvoice=async r=>{
    if(!confirm(`Remove the invoice file for ${r.candidate_name}?`))return;
    await db.storage.from("invoices").remove([r.invoice_path]);
    await db.from("placements").update({invoice_path:null,invoice_filename:null}).eq("id",r.id);
    load();
  };
  const [invDate,setInvDate]=useState("");
  const saveInvNo=async r=>{
    await db.from("placements").update({invoice_number:invNo.trim()||null,invoice_date:invDate||null}).eq("id",r.id);
    setInvNoFor(null);setInvNo("");setInvDate("");load();
  };

  const togglePaid=async(id,val)=>{await db.from("placements").update({payment_received:val,payment_date:val?new Date().toISOString().split("T")[0]:null}).eq("id",id);load();};

  const del=async(id,name)=>{
    if(!window.confirm(`Delete the placement for ${name}?\n\nThis removes it from your Placements list and from the fee totals (and the dashboard's banked revenue). This can't be undone.`))return;
    const{data,error}=await db.from("placements").delete().eq("id",id).select();
    if(error){alert("Couldn't delete the placement: "+error.message);return;}
    if(!data||data.length===0){alert("The placement couldn't be removed — the database's delete permission isn't enabled for the placements table. Add a DELETE policy in Supabase (SQL editor) and try again:\n\ncreate policy \"authenticated can delete placements\"\n  on public.placements for delete to authenticated using (true);");return;}
    load();
  };

  const totalFees=rows.reduce((sum,r)=>sum+(parseFloat(r.fee_amount)||0),0);
  const paidFees=rows.filter(r=>r.payment_received).reduce((sum,r)=>sum+(parseFloat(r.fee_amount)||0),0);

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:15,fontWeight:500}}>Placements</div>
      <button className="btn-a" onClick={()=>{setF(blank);setEditId(null);setErr("");setModal(true);}}>+ Record Placement</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
      <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:14}}>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:4}}>TOTAL PLACEMENTS</div>
        <div className="g-num" style={{fontSize:24,color:"var(--t1)"}}>{rows.length}</div>
      </div>
      <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:14}}>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:4}}>TOTAL FEES</div>
        <div className="g-num" style={{fontSize:24,color:"var(--t1)"}}>£{totalFees.toLocaleString()}</div>
      </div>
      <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:14}}>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:4}}>FEES RECEIVED</div>
        <div className="g-num" style={{fontSize:24,color:"var(--g-deep)"}}>£{paidFees.toLocaleString()}</div>
      </div>
      {(()=>{const od=rows.filter(r=>placementMoney(r,cos).invoice==="overdue");const amt=od.reduce((t,r)=>t+(parseFloat(r.fee_amount)||0),0);
        return <div style={{background:"var(--bg)",borderRadius:10,border:od.length?"0.5px solid #f09595":"0.5px solid var(--br)",padding:14}}>
          <div style={{fontSize:11,color:"var(--t2)",marginBottom:4}}>OVERDUE INVOICES</div>
          <div className="g-num" style={{fontSize:24,color:od.length?"#a32d2d":"var(--t3)"}}>£{amt.toLocaleString()}</div>
          <div style={{fontSize:11,color:"var(--t3)"}}>{od.length} invoice{od.length!==1?"s":""}</div>
        </div>;})()}
    </div>
    <input ref={invRef} type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg" style={{display:"none"}} onChange={uploadInvoice}/>
    {invErr&&<div className="err" style={{marginBottom:10}}>{invErr}</div>}
    {loading?<Spin/>:
    rows.length===0?<div style={{color:"var(--t3)",fontSize:13,padding:"40px 0",textAlign:"center"}}>No placements yet. Click "Record Placement" to add your first.</div>:
    <div className="tbl-scroll"><table style={{width:"100%",minWidth:760,borderCollapse:"collapse",background:"var(--bg)",borderRadius:10,overflow:"hidden",border:"0.5px solid var(--br)",tableLayout:"fixed"}}>
      <colgroup>
        <col style={{width:"13%"}}/><col style={{width:"13%"}}/><col style={{width:"11%"}}/>
        <col style={{width:"11%"}}/><col style={{width:"8%"}}/><col style={{width:"7%"}}/>
        <col style={{width:"20%"}}/><col style={{width:"17%"}}/>
      </colgroup>
      <thead><tr>
        <th className="th">Candidate</th><th className="th">Role</th><th className="th">Company</th>
        <th className="th">Start Date</th><th className="th num">Salary</th><th className="th num">Fee</th>
        <th className="th">Invoice</th><th className="th">Paid</th>
      </tr></thead>
      <tbody>{rows.map(r=><tr key={r.id}>
        <td className="td" style={{fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.candidate_name}</td>
        <td className="td" style={{color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.job_title}</td>
        <td className="td" style={{color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.company_name}</td>
        <td className="td" style={{color:"var(--t3)"}}><span onClick={()=>openEdit(r)} title="Click to change the start date" style={{whiteSpace:"nowrap",cursor:"pointer",borderBottom:"1px dashed var(--brm)"}}>{fmtDate(r.start_date)||"+ Add date"}</span>
          {(()=>{const m=placementMoney(r,cos);
            if(!r.start_date)return null;
            if(!m.started)return <div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>Starts in {daysBetween(todayStr(),r.start_date)}d</div>;
            if(!m.rebateKnown)return <div style={{fontSize:10,color:"var(--t3)",marginTop:2}} title="Add the rebate period on the company's terms">Rebate ?</div>;
            return m.inRebate
              ?<div style={{fontSize:10,color:"#7f77dd",marginTop:2}} title={`Fee at risk until ${niceDate(m.rebateEnd)}`}>{m.rebateLeft}d rebate left</div>
              :<div style={{fontSize:10,color:"#3b6d11",marginTop:2}}>✓ Fee safe</div>;})()}
        </td>
        <td className="td num">{r.salary?`£${parseFloat(r.salary).toLocaleString()}`:"—"}</td>
        <td className="td num" style={{color:"var(--t1)",fontWeight:600}}>{r.fee_amount?`£${parseFloat(r.fee_amount).toLocaleString()}`:"—"}</td>
        <td className="td">
          {invNoFor===r.id
            ?<div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:4}}>
              <input type="text" value={invNo} onChange={e=>setInvNo(e.target.value)} autoFocus placeholder="INV-001"
                onKeyDown={e=>{if(e.key==="Enter")saveInvNo(r);if(e.key==="Escape")setInvNoFor(null);}} style={{fontSize:11,padding:"3px 6px"}}/>
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                <input type="date" value={invDate} onChange={e=>setInvDate(e.target.value)} title="Invoice date" style={{fontSize:11,padding:"3px 6px"}}/>
                <button className="btn-a" style={{fontSize:10,padding:"2px 7px"}} onClick={()=>saveInvNo(r)}>✓</button>
              </div>
            </div>
            :<div onClick={()=>{setInvNoFor(r.id);setInvNo(r.invoice_number||"");setInvDate(r.invoice_date||todayStr());}} title="Click to edit invoice number and date"
              style={{fontSize:11,color:r.invoice_number?"var(--t1)":"var(--t3)",cursor:"pointer",marginBottom:4}}>
              {r.invoice_number||"+ Invoice no."}{r.invoice_date?<span style={{color:"var(--t3)",whiteSpace:"nowrap"}}> · {fmtDate(r.invoice_date)}</span>:null}
            </div>}
          {invBusy===r.id
            ?<span style={{fontSize:11,color:"var(--t2)"}}><span className="spin"></span>Uploading…</span>
            :r.invoice_path
              ?<div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <button onClick={()=>viewInvoice(r)} title={r.invoice_filename||"Invoice"} style={{background:"rgba(95,169,43,0.16)",color:"#3b6d11",border:"none",borderRadius:6,padding:"2px 8px",fontSize:11,cursor:"pointer",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📄 View invoice</button>
                <button onClick={()=>pickInvoice(r)} title="Replace invoice" style={{background:"none",border:"0.5px solid var(--brm)",borderRadius:6,padding:"2px 6px",fontSize:10,cursor:"pointer",color:"var(--t2)"}}>Replace</button>
                <button onClick={()=>removeInvoice(r)} title="Remove invoice" style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",fontSize:11,padding:"0 2px"}}>✕</button>
              </div>
              :<button onClick={()=>pickInvoice(r)} style={{background:"none",border:"1px dashed var(--brm)",borderRadius:6,padding:"2px 8px",fontSize:11,cursor:"pointer",color:"var(--t2)"}}>⬆ Upload invoice</button>}
          {(()=>{const m=placementMoney(r,cos);
            if(m.invoice==="overdue")return <div style={{fontSize:11,color:"#c0392b",fontWeight:600,marginTop:4}}>⚠️ {m.daysLate}d overdue</div>;
            if(m.invoice==="due_soon"||m.invoice==="invoiced")return <div style={{fontSize:11,color:m.invoice==="due_soon"?"#ba7517":"var(--t3)",marginTop:4}} title={`${m.payDays}-day terms${m.payDaysDefault?" (default — set on the company)":""}`}>Due {niceDate(m.dueDate)}</div>;
            if(m.invoice==="to_invoice")return <div style={{fontSize:11,color:"#185fa5",marginTop:4}}>Ready to invoice</div>;
            return null;})()}
        </td>
        <td className="td">
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"nowrap",justifyContent:"space-between"}}>
            <button onClick={()=>togglePaid(r.id,!r.payment_received)} style={{background:r.payment_received?"rgba(95,169,43,0.16)":"rgba(226,75,74,0.12)",color:r.payment_received?"#3b6d11":"#a32d2d",border:"none",borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
              {r.payment_received?"✓ Paid":"Unpaid"}
            </button>
            <span className="acts">
              <button className="act" onClick={()=>openEdit(r)} title="Edit placement (start date, salary, fee…)"><IconEdit/></button>
              <button className="act danger" onClick={()=>del(r.id,r.candidate_name)} title="Delete placement"><IconTrash/></button>
            </span>
          </div>
        </td>
      </tr>)}</tbody>
    </table></div>}
    {modal&&<div className="modal-overlay" onClick={()=>setModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>{editId?`Edit placement — ${f.candidate_name||""}`:"Record Placement"}</h3>
        <div className="fr2">
          <div className="fr" style={{margin:0}}><label>Candidate Name *</label>
            <input value={f.candidate_name} onChange={s("candidate_name")} placeholder="Full name" list="placement-candidates"/>
            <datalist id="placement-candidates">
              {candidates.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
            </datalist>
          </div>
          <div className="fr" style={{margin:0}}><label>Job Title</label><input value={f.job_title} onChange={s("job_title")}/></div>
        </div>
        <div className="fr"><label>Company</label>
          <input value={f.company_name} onChange={s("company_name")} list="placement-companies"/>
          <datalist id="placement-companies">
            {jobs.map(j=>j.companies?.name).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).map(n=><option key={n} value={n}/>)}
          </datalist>
        </div>
        <div className="fr2">

const ACTIVITY_TYPES=["Note","Call","Email","Meeting","LinkedIn","WhatsApp"];
const ACTIVITY_ICONS={"Note":"📝","Call":"📞","Email":"✉️","Meeting":"🤝","LinkedIn":"💼","WhatsApp":"💬"};
const ACT_LINE={"Note":"pen","Call":"phone","Email":"mail","Meeting":"users","WhatsApp":"chat","CV sent":"send"};
function ActIcon({t,size=13}){
  if(t==="LinkedIn")return <span style={{fontWeight:800,fontSize:size-1,color:"#0a66c2",lineHeight:1,width:size,textAlign:"center",display:"inline-block"}}>in</span>;

// ── One-click activity logging ────────────────────────────────────────────
// Pick a type, then an outcome — that's it. Notes are optional. A real
// conversation (spoke / replied / met) turns a New candidate into Active.
// "CV sent" records a submittal against a job so the weekly scorecard counts it.
const QUICK_OUTCOMES={
  Call:["Spoke","No answer","Left voicemail"],
  Email:["Sent","Replied"],
  LinkedIn:["Messaged","Replied"],
  WhatsApp:["Messaged","Replied"],
  Meeting:["In person","Video call"],
  Note:["Save note"],
};
const CONVERSATION_OUTCOMES=["Spoke","Replied","In person","Video call"];
function QuickLog({entityType,entityId,entityName,onLogged}){
  const [type,setType]=useState(null);
  const [body,setBody]=useState("");
  const [showNote,setShowNote]=useState(false);
  const [saving,setSaving]=useState(false);
  const [done,setDone]=useState("");
  const [err,setErr]=useState("");
  const [cvJobs,setCvJobs]=useState(null);
  const [cvJob,setCvJob]=useState("");
  const reset=()=>{setType(null);setBody("");setShowNote(false);setCvJob("");setErr("");};
  const flash=m=>{setDone(m);setTimeout(()=>setDone(""),2500);};
  const pickType=t=>{
    if(type===t){reset();return;}
    setType(t);setErr("");setShowNote(t==="Note");
    if(t==="CV sent"&&!cvJobs){
      db.from("jobs").select("id,title,companies(name)").in("status",["Open","On hold"]).order("created_at",{ascending:false})
        .then(({data})=>setCvJobs(data||[]));
    }
  };
  const save=async outcome=>{
    if(type==="Note"&&!body.trim())return setErr("Write the note first");
    setSaving(true);setErr("");
    const subject=type==="Note"?"":outcome;
    const{error}=await db.from("activity_log").insert({
      entity_type:entityType,entity_id:entityId,entity_name:entityName||"",
      activity_type:type,subject,body:body.trim()||null,
    });
    if(error){setErr(error.message);setSaving(false);return;}
    if(entityType==="candidate"&&CONVERSATION_OUTCOMES.includes(outcome))await markActiveIfNew(entityId);
    setSaving(false);flash(`✓ ${type}${subject?` · ${subject}`:""} logged`);reset();
    if(onLogged)onLogged();
  };
  const saveCv=async()=>{
    if(!cvJob)return setErr("Pick the job you sent the CV for");
    setSaving(true);setErr("");
    const job=(cvJobs||[]).find(j=>j.id===cvJob);
    const today=new Date().toISOString().split("T")[0];
    const{error}=await db.from("submittals").insert({candidate_id:entityId,job_id:cvJob,status:"Submitted",submitted_date:today,notes:body.trim()||null});
    if(error){setErr(error.message);setSaving(false);return;}
    await db.from("activity_log").insert({
      entity_type:"candidate",entity_id:entityId,entity_name:entityName||"",
      activity_type:"Email",subject:`CV sent — ${job?.title||"job"}${job?.companies?.name?` (${job.companies.name})`:""}`,body:body.trim()||null,
    });
    await markActiveIfNew(entityId);
    setSaving(false);flash("✓ CV sent recorded — counts on your weekly scorecard");reset();
    if(onLogged)onLogged();
  };
  const types=[...ACTIVITY_TYPES,...(entityType==="candidate"?["CV sent"]:[])];
  const chip=(active)=>({border:"0.5px solid "+(active?"var(--g-deep)":"var(--brm)"),background:active?"var(--g-deep)":"var(--bg)",color:active?"#fff":"var(--t2)",borderRadius:14,padding:"4px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit"});
  return <div>
    <div style={{fontSize:11,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:8}}>Log activity</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
      {types.map(t=><button key={t} onClick={()=>pickType(t)} style={chip(type===t)} disabled={saving}>
        <span style={{display:"inline-flex",alignItems:"center",gap:5}}><ActIcon t={t}/>{t}</span>
      </button>)}
    </div>
    {type&&<div style={{background:"var(--bg2)",borderRadius:8,padding:"10px 12px",marginTop:8,display:"flex",flexDirection:"column",gap:8}}>
      {type==="CV sent"
        ?<select value={cvJob} onChange={e=>setCvJob(e.target.value)} style={{fontSize:12}}>
            <option value="">{cvJobs?"Which job?":"Loading jobs…"}</option>
            {(cvJobs||[]).map(j=><option key={j.id} value={j.id}>{j.title}{j.companies?.name?` — ${j.companies.name}`:""}</option>)}
          </select>
        :null}
      {showNote
        ?<textarea value={body} onChange={e=>setBody(e.target.value)} rows={3} placeholder={type==="Note"?"Note…":"Optional note — what was said, next step…"} style={{fontSize:12,resize:"vertical"}} autoFocus/>
        :type!=="CV sent"&&<button onClick={()=>setShowNote(true)} style={{alignSelf:"flex-start",background:"none",border:"none",padding:0,cursor:"pointer",fontSize:11,color:"var(--g-deep)",fontWeight:600}}>+ Add a note</button>}
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {type==="CV sent"
          ?<button className="btn-a" style={{fontSize:12,padding:"5px 12px"}} disabled={saving} onClick={saveCv}>{saving?"Saving…":"Record CV sent"}</button>
          :QUICK_OUTCOMES[type].map(o=><button key={o} className={o===QUICK_OUTCOMES[type][0]?"btn-a":"btn-o"} style={{fontSize:12,padding:"5px 12px"}} disabled={saving} onClick={()=>save(o)}>{o}</button>)}
        <button className="btn-o" style={{fontSize:12,padding:"5px 10px"}} onClick={reset} disabled={saving}>Cancel</button>
      </div>
    </div>}
    {err&&<div style={{fontSize:11,color:"#a32d2d",marginTop:6}}>{err}</div>}
    {done&&<div style={{fontSize:12,color:"#3b6d11",marginTop:6}}>{done}</div>}
  </div>;
}
function CompanyActivity({company}){

// ── Weekly scorecard ──────────────────────────────────────────────────────
// The activity that produces fees, week by week: this week against target,
// last week, and the four-week average. Click a target to change it.
const SCORE_DEFAULTS={calls:25,messages:40,client:10,cvs:3,interviews:2,newCands:20};
const getScoreTargets=()=>{try{return{...SCORE_DEFAULTS,...JSON.parse(localStorage.getItem("gaiaScoreTargets")||"{}")};}catch(e){return{...SCORE_DEFAULTS};}};
const weekStart=(d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x;};
function WeeklyScorecard({setPage}){
  const [data,setData]=useState(null);
  const [targets,setTargets]=useState(getScoreTargets());
  useEffect(()=>{
    const w0=weekStart();const from=new Date(w0);from.setDate(from.getDate()-28);
    const iso=from.toISOString();const isoDay=iso.slice(0,10);
    Promise.all([
      db.from("activity_log").select("activity_type,entity_type,subject,created_at").gte("created_at",iso),
      db.from("submittals").select("status,submitted_date,interview_date,created_at").or(`submitted_date.gte.${isoDay},interview_date.gte.${isoDay},created_at.gte.${iso}`),
      db.from("placements").select("created_at").gte("created_at",iso),
      db.from("candidates").select("created_at").gte("created_at",iso),
    ]).then(([{data:acts},{data:subs},{data:pls},{data:cands}])=>{
      // bucket 0 = this week, 1 = last week … 4 = four weeks ago
      const bucket=d=>{if(!d)return -1;const t=new Date(d.length===10?d+"T12:00:00":d);const diff=Math.floor((w0-weekStart(t))/(7*864e5));return diff;};
      const blank=()=>({calls:0,messages:0,client:0,cvs:0,interviews:0,placements:0,newCands:0});
      const B=[0,1,2,3,4].map(blank);
      const add=(d,k)=>{const b=bucket(d);if(b>=0&&b<=4)B[b][k]++;};
      (acts||[]).forEach(a=>{
        if(a.entity_type==="company"){add(a.created_at,"client");return;}
        if(a.activity_type==="Call")add(a.created_at,"calls");
        else if(["Email","LinkedIn","WhatsApp"].includes(a.activity_type)&&!/^CV sent/.test(a.subject||""))add(a.created_at,"messages");
        else if(a.activity_type==="Meeting")add(a.created_at,"calls");
      });
      (subs||[]).forEach(x=>{
        add(x.submitted_date||x.created_at,"cvs");
        if(x.interview_date)add(x.interview_date,"interviews");
        else if(["Interview Booked","Offer Made","Placed"].includes(x.status))add(x.submitted_date||x.created_at,"interviews");
      });
      (pls||[]).forEach(x=>add(x.created_at,"placements"));
      (cands||[]).forEach(x=>add(x.created_at,"newCands"));
      setData(B);
    });
  },[]);
  const editTarget=(k,label)=>{
    const v=prompt(`Weekly target — ${label}`,String(targets[k]??""));
    if(v===null)return;const n=parseInt(v,10);if(!(n>=0))return;
    const next={...targets,[k]:n};setTargets(next);localStorage.setItem("gaiaScoreTargets",JSON.stringify(next));
  };
  if(!data)return <div className="g-canvas"><div className="skel" style={{height:10,width:140,borderRadius:4,marginBottom:14}}/><div className="score-grid">{[0,1,2,3,4,5,6].map(i=><div key={i} className="skel" style={{height:96,borderRadius:10}}/>)}</div></div>;
  // How far through the working week are we? Mon 9am ≈ 0, Fri 5pm = 1.
  // Each figure is judged against where it should be by now, so Monday
  // morning is neutral rather than a wall of red zeros.
  const now=new Date();const dow=(now.getDay()+6)%7; // Mon=0
  const hrs=Math.min(8,Math.max(0,now.getHours()+now.getMinutes()/60-9));
  const pace=dow>=5?1:Math.min(1,(dow*8+hrs)/40);
  const avg=k=>Math.round(((data[1][k]+data[2][k]+data[3][k]+data[4][k])/4)*10)/10;
  const metrics=[
    ["calls","Calls & meetings"],["messages","Messages sent"],["client","Client touches"],
    ["cvs","CVs sent to clients"],["interviews","Interviews"],["placements","Placements"],["newCands","New candidates"],
  ];
  const nothingLogged=data.every(b=>b.calls+b.messages+b.client===0);
  return <div className="g-canvas">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:12,gap:10,flexWrap:"wrap"}}>
      <div className="g-eyebrow">This week · scorecard</div>
      <span style={{fontSize:11,color:"var(--g-mute)"}}>Week of {weekStart().toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · judged on pace · click a target to change it</span>
    </div>
    <div className="score-grid">
      {metrics.map(([k,label])=>{
        const v=data[0][k],t=targets[k],pct=t?Math.min(100,Math.round(v/t*100)):null;
        const expected=t!=null?t*pace:null;
        // On pace or better → green; a little behind → amber; well behind
        // (and far enough into the week for it to matter) → red; else neutral.
        const col=t==null?"var(--g-ink)"
          :v>=t?"var(--g-deep)"
          :pace<0.2?"var(--g-ink)"
          :v>=expected?"var(--g-deep)"
          :v>=expected*0.6?"#ba7517":"#a32d2d";
        const paceText=t==null||pace<0.2?null:v>=expected?"on pace":`${Math.max(1,Math.ceil(expected-v))} behind pace`;
        return <div key={k} style={{border:"0.5px solid var(--br)",borderRadius:8,padding:"10px 12px"}}>
          <div style={{fontSize:11,color:"var(--g-mute)",marginBottom:4}}>{label}</div>
          <div style={{display:"flex",alignItems:"baseline",gap:5}}>
            <span className="g-num" style={{fontSize:24,color:col}}>{v}</span>
            {t!=null&&<button onClick={()=>editTarget(k,label)} title="Change target" style={{background:"none",border:"none",padding:0,cursor:"pointer",fontSize:12,color:"var(--g-mute)"}}>/ {t}</button>}
            {t==null&&k!=="placements"&&<button onClick={()=>editTarget(k,label)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontSize:11,color:"var(--g-mute)"}}>set target</button>}
          </div>
          {pct!=null&&<div style={{position:"relative",height:4,borderRadius:2,background:"var(--g-cream2)",marginTop:6,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:col==="var(--g-ink)"?"var(--g-lime)":col}}/>
            {pace>0&&pace<1&&<div title="Where you should be by now" style={{position:"absolute",top:0,bottom:0,left:`${pace*100}%`,width:1.5,background:"var(--g-mute)",opacity:0.6}}/>}
          </div>}
          {paceText&&<div style={{fontSize:10,color:col,marginTop:5,fontWeight:600}}>{paceText}</div>}
          <div className="score-sub" style={{fontSize:10,color:"var(--g-mute)",marginTop:paceText?2:6}}>Last week {data[1][k]} · 4-wk avg {avg(k)}</div>
        </div>;
      })}
    </div>
    {nothingLogged&&<div style={{fontSize:11,color:"#854f0b",marginTop:10}}>
      Calls, messages and client touches only count once they're logged — use the <b>Log activity</b> buttons on a candidate or company.
    </div>}
  </div>;
}

  const load=useCallback(async()=>{
    setLoading(true);

      {count:totalCandidates},{count:totalJobs},{count:totalCompanies},
      {data:newCandidates},{data:submittals},{data:placements},{data:activities},{data:bdLeads}
    ]=await Promise.all([
      db.from("candidates").select("*",{count:"exact",head:true}),
      db.from("jobs").select("*",{count:"exact",head:true}),
      db.from("companies").select("*",{count:"exact",head:true}),
      db.from("candidates").select("id,created_at").gte("created_at",from),
      db.from("submittals").select("id,status,created_at").gte("created_at",from),
      db.from("placements").select("id,fee_amount,payment_received,created_at").gte("created_at",from),
      db.from("activity_log").select("id,activity_type,created_at").gte("created_at",from),
      db.from("client_pipeline").select("id,stage"),
    ]);

    const fees=(placements||[]).reduce((s,p)=>s+(parseFloat(p.fee_amount)||0),0);
    const paidFees=(placements||[]).filter(p=>p.payment_received).reduce((s,p)=>s+(parseFloat(p.fee_amount)||0),0);
    const interviews=(submittals||[]).filter(s=>["Interview Booked","Offer Made","Placed"].includes(s.status)).length;
    const offers=(submittals||[]).filter(s=>["Offer Made","Placed"].includes(s.status)).length;
    const placed=(submittals||[]).filter(s=>s.status==="Placed").length;
    const actByType=(activities||[]).reduce((a,x)=>{a[x.activity_type]=(a[x.activity_type]||0)+1;return a;},{});
    const bdByStage=(bdLeads||[]).reduce((a,x)=>{a[x.stage]=(a[x.stage]||0)+1;return a;},{});

    setData({totalCandidates,totalJobs,totalCompanies,newCandidates:newCandidates?.length||0,
      submittals:submittals?.length||0,interviews,offers,placed,fees,paidFees,
      actByType,bdByStage,activities:activities?.length||0});
    setLoading(false);
  },[period]);
  useEffect(()=>{load();},[load]);

  const StatBox=({label,value,sub,color})=><div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:14}}>
    <div style={{fontSize:11,color:"var(--t2)",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.4px"}}>{label}</div>
    <div style={{fontSize:26,fontWeight:700,color:color||"var(--t1)"}}>{value}</div>
    {sub&&<div style={{fontSize:11,color:"var(--t3)",marginTop:2}}>{sub}</div>}
  </div>;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:15,fontWeight:500}}>Reporting</div>
      <div style={{display:"flex",gap:6}}>
        {["week","month","year"].map(p=><button key={p} onClick={()=>setPeriod(p)} style={{background:period===p?"#1a1f2e":"var(--bg)",color:period===p?"#fff":"var(--t2)",border:"0.5px solid var(--br)",borderRadius:6,padding:"4px 12px",fontSize:11,cursor:"pointer",textTransform:"capitalize"}}>{p}</button>)}
      </div>
    </div>
    {loading||!data?<Spin/>:<>
      {/* KPI row 1 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}}>
        <StatBox label="Total Candidates" value={data.totalCandidates||0}/>
        <StatBox label="Total Jobs" value={data.totalJobs||0}/>
        <StatBox label="Total Companies" value={data.totalCompanies||0}/>
        <StatBox label="New Candidates" value={data.newCandidates} sub={`This ${period}`} color="var(--g-deep)"/>
      </div>
      {/* KPI row 2 — pipeline funnel */}
      <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:16,marginBottom:14}}>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.4px",fontWeight:500}}>Recruitment funnel — this {period}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {[
            {label:"CVs Sent",value:data.submittals,color:"#a9a9a2",bg:"rgba(17,17,17,0.05)"},
            {label:"Interviews",value:data.interviews,color:"#a0d045",bg:"rgba(160,208,69,0.16)"},
            {label:"Offers Made",value:data.offers,color:"#5fa92b",bg:"rgba(95,169,43,0.18)"},
            {label:"Placed",value:data.placed,color:"#2e7a2c",bg:"rgba(46,122,44,0.18)"},
          ].map((item,i,arr)=>{
            const max=arr[0].value||1;
            const pct=Math.round((item.value/max)*100)||0;
            return <div key={item.label} style={{textAlign:"center"}}>
              <div style={{fontSize:26,fontWeight:700,color:item.color,marginBottom:4}}>{item.value}</div>
              <div style={{height:6,background:"var(--bg2)",borderRadius:10,marginBottom:6,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,background:item.color,borderRadius:10,transition:"width 0.6s"}}/>
              </div>
              <div style={{fontSize:11,color:"var(--t2)"}}>{item.label}</div>
              {i>0&&arr[i-1].value>0&&<div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{Math.round((item.value/arr[i-1].value)*100)}% conversion</div>}
            </div>;
          })}
        </div>
      </div>
      {/* Fees + Activity */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:16}}>
          <div style={{fontSize:11,color:"var(--t2)",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.4px",fontWeight:500}}>Fees — this {period}</div>
          <div className="g-num" style={{fontSize:28,color:"var(--t1)",marginBottom:4}}>£{data.fees.toLocaleString()}</div>
          <div style={{fontSize:12,color:"var(--t3)",marginBottom:10}}>Total invoiced</div>
          <div style={{background:"var(--bg2)",borderRadius:8,padding:"10px 12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:12}}>
              <span style={{color:"var(--t2)"}}>Received</span>
              <span style={{fontWeight:600,color:"#3b6d11"}}>£{data.paidFees.toLocaleString()}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
              <span style={{color:"var(--t2)"}}>Outstanding</span>
              <span style={{fontWeight:600,color:"#a32d2d"}}>£{(data.fees-data.paidFees).toLocaleString()}</span>
            </div>
            <div style={{marginTop:10,background:"var(--bg3)",borderRadius:6,height:8,overflow:"hidden"}}>
              <div style={{height:"100%",width:data.fees>0?`${Math.min(100,(data.paidFees/data.fees)*100)}%`:"0%",background:"#3b6d11",borderRadius:6,transition:"width 0.6s"}}/>
            </div>
            <div style={{fontSize:10,color:"var(--t3)",marginTop:4,textAlign:"right"}}>{data.fees>0?Math.round((data.paidFees/data.fees)*100):0}% collected</div>
          </div>
        </div>
        <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:16}}>
          <div style={{fontSize:11,color:"var(--t2)",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.4px",fontWeight:500}}>Activity breakdown — this {period}</div>
          {Object.entries(data.actByType).length===0
            ?<div style={{color:"var(--t3)",fontSize:12,padding:"20px 0",textAlign:"center"}}>No activity logged this {period}</div>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>
              {Object.entries(data.actByType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>{
                const maxAct=Math.max(...Object.values(data.actByType));
                return <div key={type}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3,fontSize:12}}>
                    <span style={{display:"inline-flex",alignItems:"center",gap:6}}><ActIcon t={type}/>{type}</span>
                    <span style={{fontWeight:600}}>{count}</span>
                  </div>
                  <div style={{height:5,background:"var(--bg2)",borderRadius:10,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${Math.round((count/maxAct)*100)}%`,background:ACCENT,borderRadius:10}}/>
                  </div>
                </div>;
              })}
            </div>
          }
        </div>
      </div>
      {/* BD Pipeline Summary */}
      <div style={{background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",padding:16}}>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.4px",fontWeight:500}}>BD Pipeline summary</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8}}>
          {BD_STAGES.map(stage=>{
            const count=data.bdByStage[stage]||0;
            const total=Object.values(data.bdByStage).reduce((a,b)=>a+b,0)||1;
            return <div key={stage} style={{textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:700,color:BD_FG[stage],marginBottom:4}}>{count}</div>
              <div style={{height:40,background:"var(--bg2)",borderRadius:6,marginBottom:6,overflow:"hidden",display:"flex",alignItems:"flex-end"}}>
                <div style={{width:"100%",height:`${Math.max(4,Math.round((count/total)*100))}%`,background:BD_COLORS[stage],transition:"height 0.6s"}}/>
              </div>
              <div style={{fontSize:10,color:"var(--t2)",lineHeight:1.3}}>{stage}</div>
            </div>;
          })}
        </div>
      </div>
    </>}
  </div>;
}

const NAV=[
  {k:"dashboard",l:"Dashboard",i:"home",s:"work"},
  {k:"tasks",l:"Tasks",i:"check",s:"work"},
  {k:"candidates",l:"Candidates",i:"users",s:"work"},
  {k:"jobs",l:"Jobs",i:"briefcase",s:"work"},
  {k:"companies",l:"Companies",i:"building",s:"work"},
  {k:"placements",l:"Placements",i:"award",s:"work"},
  {k:"cvinbox",l:"CV inbox",i:"inbox",s:"in"},
  {k:"enquiries",l:"Website enquiries",i:"globe",s:"in"},
  {k:"submittals",l:"Submittals",i:"send",s:"in"},
  {k:"pipeline",l:"BD pipeline",i:"trend",s:"in"},
  {k:"hotlists",l:"Hotlists",i:"star",s:"in"},
  {k:"reporting",l:"Reporting",i:"chart",s:"more"},
  {k:"activity",l:"Activity log",i:"list",s:"more"},
  {k:"jds",l:"Job descriptions",i:"doc",s:"more"},
  {k:"parse",l:"CV parser",i:"scan",s:"more"},
  {k:"match",l:"Job matching",i:"target",s:"more"},
  {k:"pitch",l:"Pitch writer",i:"pen",s:"more"},
  {k:"sequences",l:"Email sequences",i:"mail",s:"more"},
  {k:"import",l:"CSV import",i:"upload",s:"more"},
  {k:"outlook",l:"Outlook connection",i:"mail",s:"more"},
];
const SNAMES={work:"Daily work",in:"Inbound & BD",more:"More"};

function ReminderBell({tasks,onNavigate}){
  const today=todayStr();
  const overdue=(tasks||[]).filter(t=>!t.done&&t.due_date&&t.due_date<today);
  const dueToday=(tasks||[]).filter(t=>!t.done&&t.due_date===today);
  const total=overdue.length+dueToday.length;
  return <div onClick={onNavigate} title="Tasks due" className="icon-btn" style={{position:"relative",border:"none"}}>
    <Icon n="bell" size={18}/>
    {total>0&&<span style={{position:"absolute",top:0,right:0,background:overdue.length>0?"#e24b4a":ACCENT,color:"#fff",fontSize:9,fontWeight:700,borderRadius:"50%",width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center"}}>{total>9?"9+":total}</span>}
  </div>;
}

function LoginScreen(){
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const attempt=async()=>{
    if(busy)return;
    setErr("");setBusy(true);
    const {error}=await db.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);
    if(error)setErr(error.message||"Sign in failed");
  };
  return(
    <div style={{minHeight:"100vh",width:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:"#1a1f2e"}}>
      <div style={{background:"#fff",borderRadius:16,padding:"40px 36px",width:340,boxShadow:"0 8px 40px rgba(0,0,0,0.3)",textAlign:"center"}}>
        <div style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:30,fontWeight:400,color:"#1a1f2e",marginBottom:6,letterSpacing:"-0.5px",fontVariationSettings:"'opsz' 72"}}>recruit<span style={{fontWeight:700,color:"#5fa92b"}}>CRM</span></div>
        <div style={{fontSize:12,color:"#9e9e9b",marginBottom:28}}>Gaia Search · Private Access</div>
        <input
          type="email"
          placeholder="Email"
          value={email}
          onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&attempt()}
          style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1.5px solid ${err?"#e53935":"#ddd"}`,fontSize:14,outline:"none",marginBottom:10,boxSizing:"border-box",transition:"border 0.2s"}}
          autoFocus
        />
        <input
          type="password"
          placeholder="Password"
          value={pw}
          onChange={e=>setPw(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&attempt()}
          style={{width:"100%",padding:"10px 14px",borderRadius:8,border:`1.5px solid ${err?"#e53935":"#ddd"}`,fontSize:14,outline:"none",marginBottom:12,boxSizing:"border-box",transition:"border 0.2s"}}
        />
        {err&&<div style={{color:"#e53935",fontSize:12,marginBottom:8}}>{err}</div>}
        <button onClick={attempt} disabled={busy} style={{width:"100%",padding:"10px",background:"#1a1f2e",color:"#fff",border:"none",borderRadius:8,fontSize:14,fontWeight:600,cursor:busy?"default":"pointer",opacity:busy?0.7:1}}>
          {busy?"Signing in…":"Sign in"}
        </button>
      </div>
    </div>
  );
}

function App(){
  const [session,setSession]=useState(null);
  const [ready,setReady]=useState(false);
  useEffect(()=>{
    db.auth.getSession().then(({data})=>{setSession(data.session);setReady(true);});
    const {data:sub}=db.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>sub.subscription.unsubscribe();
  },[]);
  if(!ready)return null;
  if(!session)return<LoginScreen/>;
  return<AuthedApp/>;
}

function AuthedApp(){
  const [page,setPage]=useState(()=>/[?&]outlook=/.test(location.search)?"outlook":"dashboard");
  useEffect(()=>{refreshOutlookStatus();const m=/[?&]outlook=(\w+)/.exec(location.search);if(m){history.replaceState(null,"",location.pathname);refreshOutlookStatus();if(m[1]==="denied"||m[1]==="expired")setTimeout(()=>alert(m[1]==="denied"?"Microsoft sign-in was cancelled.":"That sign-in link expired — click Connect Outlook again."),300);}},[]);
  useEffect(()=>{const h=e=>{setPage(e.detail);setActiveJob(null);};window.addEventListener("gotoPage",h);return()=>window.removeEventListener("gotoPage",h);},[]);
  const [allTasks,setAllTasks]=useState([]);
  const [activeJob,setActiveJob]=useState(null);
  const [searchQ,setSearchQ]=useState({q:"",cv:false,n:0});
  const [navOpen,setNavOpen]=useState(false); // phone menu
  const [showMore,setShowMore]=useState(()=>{try{return localStorage.getItem("crm_nav_more")==="1";}catch(e){return false;}});
  // Website applicants are created as candidates by the database; read their CVs here
  // (once, in the background) so they show up in "search inside CVs"
  useEffect(()=>{
    let stop=false;
    (async()=>{
      try{
        const{data}=await db.from("candidates").select("id,cv_path,cv_filename").eq("source","Website").is("cv_text",null).not("cv_path","is",null).limit(20);
        for(const c of data||[]){
          if(stop)return;
          const{data:blob}=await db.storage.from("candidate-cvs").download(c.cv_path);
          if(!blob)continue;
          const name=c.cv_filename||"cv.pdf";
          const t=await extractFileText(new File([blob],name,{type:blob.type}),name);
          if(t)await db.from("candidates").update({cv_text:t}).eq("id",c.id);
        }
      }catch(e){console.warn("Website CV text:",e);}
    })();
    return()=>{stop=true;};
  },[]);
  useEffect(()=>{
    const h=e=>{
      const d=typeof e.detail==="string"?{q:e.detail,cv:false}:e.detail;
      setSearchQ({q:d.q,cv:!!d.cv,n:Date.now()});setPage("search");setActiveJob(null);
    };
    window.addEventListener("globalSearch",h);
    return()=>window.removeEventListener("globalSearch",h);
  },[]);
  useEffect(()=>{
    const h=e=>{setPage(e.detail);if(e.detail!=="jobs")setActiveJob(null);};
    window.addEventListener("nav",h);
    return()=>window.removeEventListener("nav",h);
  },[]);
  useEffect(()=>{
    const loadTasks=()=>db.from("tasks").select("id,title,due_date,done").eq("done",false).then(({data})=>setAllTasks(data||[]));
    loadTasks();
    const id=setInterval(loadTasks,60000);
    return()=>clearInterval(id);
  },[]);
  const pages={
    dashboard:<DashboardPage setPage={setPage}/>,
    candidates:<CandidatesPage/>,
    jobs: activeJob
      ? <JobPipelinePage job={activeJob} onBack={()=>setActiveJob(null)}/>
      : <JobsPage onOpenJob={j=>{setActiveJob(j);}}/>,
    companies:<CompaniesPage/>,tasks:<TasksPage/>,
    parse:<CVParserPage/>,match:<MatchingPage/>,pitch:<PitchPage/>,
    import:<CSVImportPage/>,
    pipeline:<BDPipelinePage/>,
    submittals:<SubmittalsPage/>,
    placements:<PlacementsPage/>,
    activity:<ActivityLogPage/>,
    reporting:<ReportingPage/>,
    sequences:<EmailSequencesPage/>,
    hotlists:<HotlistsPage/>,
    jds:<JDLibraryPage/>,
    cvinbox:<CvInboxPage/>,
    enquiries:<WebEnquiriesPage/>,
    outlook:<OutlookPage/>,
    search:<SearchResultsPage query={searchQ.q} cvFlag={searchQ.cv} nonce={searchQ.n} setPage={setPage}/>,
  };
  let lastS=null;
  return <>
    <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    {navOpen&&<div className="nav-backdrop" onClick={()=>setNavOpen(false)}/>}
    <div className="app-shell" style={{display:"flex",width:"100%",flex:1,minHeight:"100vh",overflow:"hidden",fontSize:13}}>
      <div className={"dark-sidebar app-sidebar"+(navOpen?" open":"")} style={{width:200,background:SIDEBAR,display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{padding:"18px 16px 14px",borderBottom:"0.5px solid rgba(255,255,255,0.07)"}}>
          <div onClick={()=>{setPage("dashboard");setActiveJob(null);setNavOpen(false);}} title="Go to Dashboard"
            style={{cursor:"pointer",display:"block"}}>
            <img src="/logo-light.png" alt="Gaia Search" style={{width:164,height:"auto",display:"block"}}
              onError={e=>{e.currentTarget.style.display="none";e.currentTarget.nextSibling.style.display="block";}}/>
            <span style={{display:"none",fontFamily:"var(--g-face)",fontSize:15,fontWeight:700,letterSpacing:"3px",color:"#f4f1e6"}}>GAIA SEARCH</span>
            <div style={{fontFamily:"var(--g-face)",fontSize:9,fontWeight:700,letterSpacing:"2.2px",color:"rgba(160,208,69,0.75)",marginTop:7,paddingLeft:38}}>RECRUITMENT CRM</div>
          </div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"8px 0"}}>
          {NAV.map(n=>{
            const showS=n.s!==lastS;lastS=n.s;
            const moreOpen=showMore||NAV.some(x=>x.s==="more"&&x.k===page);
            if(n.s==="more"&&!moreOpen&&!showS)return null;
            const on=page===n.k;
            return <Fragment key={n.k}>
              {showS&&(n.s==="more"
                ?<button onClick={()=>setShowMore(v=>{const nv=!v;try{localStorage.setItem("crm_nav_more",nv?"1":"0");}catch(e){}return nv;})} className="nav-head" style={{display:"flex",alignItems:"center",gap:6,width:"100%",background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
                    <Icon n="chevron" size={11} stroke={2} style={{transform:moreOpen?"rotate(90deg)":"none",transition:"transform 0.15s"}}/>{SNAMES[n.s]}
                  </button>
                :<div className="nav-head">{SNAMES[n.s]}</div>)}
              {(n.s!=="more"||moreOpen)&&<div onClick={()=>{setPage(n.k);if(n.k!=="jobs")setActiveJob(null);setNavOpen(false);}} className={"nav-item"+(on?" on":"")}>
                <Icon n={n.i} size={16}/>{n.l}
              </div>}
            </Fragment>;
          })}
        </div>
      </div>
      <div style={{flex:1,background:"var(--bg3)",display:"flex",flexDirection:"column",minWidth:0}}>
        <div className="app-topbar" style={{background:"var(--bg)",borderBottom:"0.5px solid var(--br)",padding:"0 18px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,gap:10}}>
          <button className="menu-btn" onClick={()=>setNavOpen(true)} aria-label="Open menu">☰</button>
          <span className="app-title" style={{fontSize:15,fontWeight:500,color:"var(--t1)"}}>
            {page==="jobs"&&activeJob ? activeJob.title : page==="search" ? "Search results" : NAV.find(n=>n.k===page)?.l||""}
          </span>
          <div className="topbar-right" style={{display:"flex",alignItems:"center",gap:10}}>
            <GlobalSearch setPage={setPage}/>
            <DarkModeToggle/>
            <ReminderBell tasks={allTasks} onNavigate={()=>setPage("tasks")}/>
            <button className="hide-phone" onClick={()=>db.auth.signOut()} title="Sign out" style={{background:"transparent",border:"0.5px solid var(--br)",color:"var(--t2)",borderRadius:7,padding:"5px 11px",fontSize:12,cursor:"pointer",fontWeight:500}}>Sign out</button>
          </div>
        </div>
        <div className="app-content" style={{flex:1,overflowY:"auto",padding:18}}>{pages[page]}</div>
      </div>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
function saveKey(){
  const k=document.getElementById("apiKeyInput").value.trim();
  if(!k)return;
  window._apiKey=k;localStorage.setItem("rcrm_key",k);
  document.getElementById("keyStatus").innerHTML='<span style="color:#3b6d11">✓ Saved</span>';
  document.getElementById("apiKeyInput").value="••••••••••••••••••";
  setTimeout(()=>{document.getElementById("apiBanner").style.display="none";},800);
}
function dismissKey(){
  try{sessionStorage.setItem("rcrm_key_later","1");}catch(e){}
  document.getElementById("apiBanner").style.display="none";
}
window.addEventListener("load",()=>{
  const s=localStorage.getItem("rcrm_key");
  let later=false;try{later=sessionStorage.getItem("rcrm_key_later")==="1";}catch(e){}
  if(later)document.getElementById("apiBanner").style.display="none";
  if(s){
    window._apiKey=s;
    document.getElementById("apiBanner").style.display="none";
  }
});
</script>
</body>
