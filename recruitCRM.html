function JobPipelinePage({job, onBack}){
  const [entries,setEntries]=useState([]);
  const [loading,setLoading]=useState(true);
  const [addModal,setAddModal]=useState(false);
  const [noteEntry,setNoteEntry]=useState(null);
  const [noteText,setNoteText]=useState("");
  const [movingId,setMovingId]=useState(null);
  const [err,setErr]=useState("");
  // Placement capture — opens automatically when a candidate is moved to Placed
  const [placeForm,setPlaceForm]=useState(null);
  const [placeSaving,setPlaceSaving]=useState(false);
  const [placeErr,setPlaceErr]=useState("");
  const [placeDone,setPlaceDone]=useState("");
  const [jobNote,setJobNote]=useState("");
  const [showRejected,setShowRejected]=useState(false);
  const [openCand,setOpenCand]=useState(null);
  const [editCand,setEditCand]=useState(null);
  const [calFor,setCalFor]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);
    const{data,error}=await db.from("job_candidates")
      .select("*,candidates(id,name,role,location,salary,skills,status,email)")
      .eq("job_id",job.id)
      .order("created_at",{ascending:true});
    if(error)setErr(error.message);else setEntries(data||[]);
    setLoading(false);
  },[job.id]);

  useEffect(()=>{load();},[load]);

  const moveStage=async(entry,newStage)=>{
    if((newStage==="Interview"||newStage==="2nd Interview")&&outlookState.status?.connected)setCalFor({cand:entry.candidates,stage:newStage});
    setMovingId(entry.id);
    await db.from("job_candidates").update({stage:newStage}).eq("id",entry.id);
    await syncCandidateStatus(entry.candidates?.id);
    // A placement fills the job — take it off the live list automatically
    if(newStage==="Placed"&&job.status!=="Filled"){
      await db.from("jobs").update({status:"Filled"}).eq("id",job.id);
      job.status="Filled";
      setJobNote("This job has been marked Filled. If you are hiring more than one person, set it back to Open via Jobs → Edit.");
    }
    // Auto-create a submittal when reaching Interview or beyond
    const SUBMITTAL_TRIGGER=["Interview","2nd Interview","Offer","Placed"];
    if(newStage==="Rejected"){
      // Keep the submittal record in step rather than leaving it showing an
      // interview that is no longer happening
      const c=entry.candidates||{};
      if(c.id) await db.from("submittals").update({status:"Rejected"}).eq("candidate_id",c.id).eq("job_id",job.id);
    }
    else if(SUBMITTAL_TRIGGER.includes(newStage)){
      const c=entry.candidates||{};
      const existing=await db.from("submittals").select("id").eq("candidate_id",c.id).eq("job_id",job.id);
      if(!existing.data||existing.data.length===0){
        await db.from("submittals").insert({
          candidate_id:c.id,job_id:job.id,
          status:newStage==="Placed"?"Placed":newStage.startsWith("2nd")?"Interview Booked":newStage==="Offer"?"Offer Made":"Interview Booked",
          submitted_date:new Date().toISOString().split("T")[0],
          notes:`Auto-created when moved to ${newStage} stage in pipeline`
        });
      }
    }
    // Moving someone to Placed means the fee is won — capture the placement now
    // so the Placements page and the dashboard stay in step with the pipeline.
    if(newStage==="Placed"){
      const c=entry.candidates||{};
      const existing=await db.from("placements").select("id").eq("job_id",job.id).eq("candidate_id",c.id);
      if(!existing.data||existing.data.length===0){
        const t=jobFeeTerms();
        setPlaceErr("");
        setPlaceForm({
          candidate_id:c.id||"",
          candidate_name:c.name||"",
          job_title:job.title||"",
          company_name:job.companies?.name||"",
          start_date:"",
          salary:t.salary,
          fee_percentage:t.pct,
          fee_amount:t.fee,
          invoice_number:"",
          notes:"",
        });
      }
    }
    setMovingId(null);load();
  };

  // Work out the fee from the job override, or the client's standard terms
  const jobFeeTerms=()=>{
    const co=job.companies||{};
    const feeType=job.fee_type_override||co.fee_type||"none";
    const feeVal=job.fee_type_override
      ?parseFloat(job.fee_value_override||0)
      :(feeType==="percentage"?parseFloat(co.fee_percentage||0):parseFloat(co.fee_fixed||0));
    const salNum=parseFloat((job.salary_value||"").toString().replace(/[^0-9.]/g,""));
    const salary=salNum?String(salNum):"";
    if(feeType==="fixed"&&feeVal) return{salary,pct:"",fee:String(Math.round(feeVal))};
    if(feeType==="percentage"&&feeVal) return{salary,pct:String(feeVal),fee:salNum?String(Math.round(salNum*(feeVal/100))):""};
    return{salary,pct:"",fee:""};
  };

  // Keep the fee in step when salary or percentage is edited
  const setPlaceField=(k,v)=>setPlaceForm(prev=>{
    const next={...prev,[k]:v};
    if(k==="salary"||k==="fee_percentage"){
      const sal=parseFloat(String(next.salary).replace(/[^0-9.]/g,""));
      const pct=parseFloat(next.fee_percentage);
      if(sal&&pct) next.fee_amount=String(Math.round(sal*(pct/100)));
    }
    return next;
  });

  const savePlacement=async()=>{
    if(!placeForm)return;
    if(!placeForm.candidate_name.trim())return setPlaceErr("Candidate name required");
    setPlaceSaving(true);setPlaceErr("");
    const{error}=await db.from("placements").insert({
      candidate_id:placeForm.candidate_id||null,
      job_id:job.id||null,
      candidate_name:placeForm.candidate_name.trim(),
      job_title:placeForm.job_title.trim(),
      company_name:placeForm.company_name.trim(),
      start_date:placeForm.start_date||null,
      salary:placeForm.salary?parseFloat(String(placeForm.salary).replace(/[^0-9.]/g,"")):null,
      fee_amount:placeForm.fee_amount?parseFloat(String(placeForm.fee_amount).replace(/[^0-9.]/g,"")):null,
      fee_percentage:placeForm.fee_percentage?parseFloat(placeForm.fee_percentage):null,
      invoice_number:placeForm.invoice_number.trim()||null,
      payment_received:false,
      notes:placeForm.notes.trim()||null,
    });
    if(error){setPlaceErr(error.message);}
    else{
      const nm=placeForm.candidate_name;
      setPlaceForm(null);
      setPlaceDone(`Placement recorded for ${nm} — it will show on the dashboard and Placements page.`);
      setTimeout(()=>setPlaceDone(""),6000);
    }
    setPlaceSaving(false);
  };

  const removeFromJob=async(id)=>{
    if(!confirm("Remove this candidate from the job?"))return;
    const ent=entries.find(e=>e.id===id);
    await db.from("job_candidates").delete().eq("id",id);
    await syncCandidateStatus(ent?.candidates?.id||ent?.candidate_id);
    load();
  };

  const saveNote=async()=>{
    if(!noteEntry)return;
    await db.from("job_candidates").update({notes:noteText}).eq("id",noteEntry.id);
    setNoteEntry(null);setNoteText("");load();
  };

  const existingIds=entries.map(e=>e.candidates?.id).filter(Boolean);

  const byStage=STAGES.reduce((acc,s)=>{acc[s]=entries.filter(e=>e.stage===s);return acc;},{});

  const pf=placeForm;

  return <div>
    {addModal&&<AddCandToJobModal job={job} existingIds={existingIds} onClose={()=>setAddModal(false)} onAdded={load}/>}
    {calFor&&<InterviewEventModal cand={calFor.cand} job={job} stage={calFor.stage} onClose={()=>setCalFor(null)}/>}
    {openCand&&<CandidateDetailPanel cand={openCand} onClose={()=>setOpenCand(null)} onEdit={c=>{setOpenCand(null);setEditCand(c);}} onRefresh={load}/>}
    {editCand&&<CandModal cand={editCand} onClose={()=>setEditCand(null)} onSaved={()=>{setEditCand(null);load();}}/>}

    {/* Placement capture — opens when a candidate is moved to Placed */}
    {pf&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setPlaceForm(null);}}>
      <div className="modal" style={{maxWidth:480}}>
        <h3>🏆 Record placement</h3>
        <div style={{fontSize:12,color:"var(--t2)",marginBottom:12,lineHeight:1.5}}>
          {pf.candidate_name} has been moved to Placed. Confirm the details below and this
          will be added to your Placements and counted as actual revenue.
        </div>
        <Err msg={placeErr}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{gridColumn:"1 / -1"}}>
            <label style={{fontSize:11,color:"var(--t2)"}}>Candidate</label>
            <input type="text" value={pf.candidate_name} onChange={e=>setPlaceField("candidate_name",e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"var(--t2)"}}>Role</label>
            <input type="text" value={pf.job_title} onChange={e=>setPlaceField("job_title",e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"var(--t2)"}}>Company</label>
            <input type="text" value={pf.company_name} onChange={e=>setPlaceField("company_name",e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"var(--t2)"}}>Start date</label>
            <input type="date" value={pf.start_date} onChange={e=>setPlaceField("start_date",e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"var(--t2)"}}>Salary (£)</label>
            <input type="text" value={pf.salary} onChange={e=>setPlaceField("salary",e.target.value)} placeholder="43500"/>
          </div>
          <div>
            <label style={{fontSize:11,color:"var(--t2)"}}>Fee %</label>
            <input type="text" value={pf.fee_percentage} onChange={e=>setPlaceField("fee_percentage",e.target.value)} placeholder="15"/>
          </div>
          <div>
            <label style={{fontSize:11,color:"var(--t2)"}}>Fee amount (£)</label>
            <input type="text" value={pf.fee_amount} onChange={e=>setPlaceField("fee_amount",e.target.value)} placeholder="6525"/>
          </div>
          <div style={{gridColumn:"1 / -1"}}>
            <label style={{fontSize:11,color:"var(--t2)"}}>Invoice number (optional)</label>
            <input type="text" value={pf.invoice_number} onChange={e=>setPlaceField("invoice_number",e.target.value)}/>
          </div>
          <div style={{gridColumn:"1 / -1"}}>
            <label style={{fontSize:11,color:"var(--t2)"}}>Notes (optional)</label>
            <textarea value={pf.notes} onChange={e=>setPlaceField("notes",e.target.value)} style={{minHeight:60}}/>
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <button className="btn-o" onClick={()=>setPlaceForm(null)} disabled={placeSaving}>Skip for now</button>
          <button className="btn-a" onClick={savePlacement} disabled={placeSaving}>
            {placeSaving?<><span className="spin"></span>Saving…</>:"Save placement"}
          </button>
        </div>
      </div>
    </div>}

    {placeDone&&<div style={{background:"rgba(95,169,43,0.16)",border:"0.5px solid #639922",color:"#3b6d11",borderRadius:8,padding:"9px 12px",fontSize:12,marginBottom:10}}>
      ✓ {placeDone}
    </div>}
    {jobNote&&<div style={{background:"#e1f5ee",border:"0.5px solid #0f6e56",color:"#0f6e56",borderRadius:8,padding:"9px 12px",fontSize:12,marginBottom:10,display:"flex",justifyContent:"space-between",gap:10}}>
      <span>✓ {jobNote}</span><button onClick={()=>setJobNote("")} style={{background:"none",border:"none",cursor:"pointer",color:"#0f6e56"}}>✕</button>
    </div>}

    {/* Note modal */}
    {noteEntry&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setNoteEntry(null);setNoteText("");}}}>
      <div className="modal" style={{maxWidth:420}}>
        <h3>Notes — {noteEntry.candidates?.name}</h3>
        <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Add notes about this candidate for this role…" style={{minHeight:120}}/>
        <div style={{display:"flex",gap:8,marginTop:12,justifyContent:"flex-end"}}>
          <button className="btn-o" onClick={()=>{setNoteEntry(null);setNoteText("");}}>Cancel</button>
          <button className="btn-a" onClick={saveNote}>Save note</button>
        </div>
      </div>
    </div>}

    {/* Header */}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
      <button className="btn-o" style={{padding:"5px 10px",fontSize:12}} onClick={onBack}>← All jobs</button>
      <div style={{flex:1}}>
        <div style={{fontSize:15,fontWeight:500,color:"var(--t1)"}}>{job.title}</div>
        <div style={{fontSize:12,color:"var(--t2)"}}>{job.companies?.name||"No client"} · {jobSalaryText(job)} · {entries.length} candidate{entries.length!==1?"s":""}</div>
      </div>
      <div style={{display:"flex",gap:8}}>
         <button className="btn-o" onClick={()=>openAiTool("match",{jobId:job.id})} title="Score a candidate against this job with AI"><Icon n="target" size={13}/>Match a candidate</button>
         <button className="btn-a" onClick={()=>setAddModal(true)}>+ Add candidates</button>
       </div>
    </div>

    {/* Progress bar */}
    <div style={{display:"flex",height:4,borderRadius:10,overflow:"hidden",marginBottom:16,gap:1}}>
      {FUNNEL_STAGES.map(s=>{
        const cnt=byStage[s].length,total=entries.length||1;
        return <div key={s} style={{flex:cnt||0.05,background:STAGE_COLORS[s].bar,transition:"flex 0.4s",minWidth:2}}/>;
      })}
    </div>

    <Err msg={err}/>

    {loading?<Spin/>:entries.length===0
      ?<div style={{padding:"50px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>
          No candidates in this pipeline yet.<br/>
          <button className="btn-a" style={{marginTop:14}} onClick={()=>setAddModal(true)}>+ Add your first candidate</button>
        </div>
      :<div style={{overflowX:"auto",paddingBottom:8}}>
        <div style={{display:"flex",gap:8,minWidth:640}}>
          {FUNNEL_STAGES.map(stage=>{
            const sc=STAGE_COLORS[stage];
            const stageCands=byStage[stage];
            return <div key={stage} style={{flex:1,minWidth:0}}>
              {/* Column header */}
              <div style={{background:sc.bg,borderRadius:8,padding:"8px 10px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:12,fontWeight:500,color:sc.fg}}>{stage}</span>
                <span style={{fontSize:11,color:sc.fg,background:"rgba(255,255,255,0.5)",borderRadius:10,padding:"1px 7px"}}>{stageCands.length}</span>
              </div>
              {/* Cards */}
              {stageCands.map(entry=>{
                const c=entry.candidates||{};
                const isMoving=movingId===entry.id;
                return <div key={entry.id} style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:10,padding:"10px 12px",marginBottom:8,opacity:isMoving?0.5:1,transition:"opacity 0.2s"}}>
                  <div onClick={()=>c.id&&setOpenCand(c)} title="Open candidate" className="pipe-who" style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,cursor:"pointer"}}>
                    <Av name={c.name||"?"} size={28}/>
                    <div style={{minWidth:0}}>
                      <div className="pipe-name" style={{fontWeight:500,fontSize:12,color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name||"Unknown"}</div>
                      <div title={c.role||""} style={{fontSize:11,color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cleanTitle(c.role)||"—"}</div>
                    </div>
                  </div>
                  {(c.location||c.salary)&&<div style={{fontSize:11,color:"var(--t3)",marginBottom:6}}>{[c.location,c.salary].filter(Boolean).join(" · ")}</div>}
                  {entry.notes&&<div style={{fontSize:11,color:"var(--t2)",background:"var(--bg2)",borderRadius:6,padding:"5px 7px",marginBottom:6,lineHeight:1.5}}>{entry.notes.slice(0,80)}{entry.notes.length>80?"…":""}</div>}
                  {/* Move stage */}
                  <div style={{marginBottom:6}}>
                    <select value={stage} onChange={e=>moveStage(entry,e.target.value)} disabled={isMoving} style={{fontSize:11,padding:"4px 6px",width:"100%",background:sc.bg,color:sc.fg,border:`0.5px solid ${sc.bar}`,borderRadius:6}}>
                      {STAGES.map(s=><option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                  <div style={{display:"flex",gap:4}}>
                    <button className="btn-o" style={{flex:1,justifyContent:"center",padding:"3px 0",fontSize:11}} onClick={()=>{setNoteEntry(entry);setNoteText(entry.notes||"");}}>Note</button>
                    <button className="btn-o" title="Remove from this job" style={{padding:"3px 8px",fontSize:11,color:"var(--t3)"}} onClick={()=>removeFromJob(entry.id)}>Remove</button>
                  </div>
                </div>;
              })}
                {stageCands.length===0&&(stage==="Applied"
                  ?<button onClick={()=>setAddModal(true)} style={{width:"100%",border:"1px dashed var(--brm)",borderRadius:8,padding:"12px 6px",textAlign:"center",color:"var(--g-deep)",fontSize:11,fontWeight:600,background:"transparent",cursor:"pointer"}}>+ Add candidates</button>
                  :<div style={{border:"1px dashed var(--br)",borderRadius:8,padding:"14px 6px",textAlign:"center",color:"var(--t3)",fontSize:11}}>—</div>)}
            </div>;
          })}
        </div>
      </div>
    }

    {/* Rejected — kept out of the board so the live stages fit the screen */}
    {byStage["Rejected"]?.length>0&&<div style={{marginTop:12}}>
      <button onClick={()=>setShowRejected(v=>!v)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontSize:12,fontWeight:500,color:"var(--t3)"}}>
        {showRejected?"▾":"▸"} Rejected ({byStage["Rejected"].length})
      </button>
      {showRejected&&<div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:8}}>
        {byStage["Rejected"].map(entry=>{const c=entry.candidates||{};return <div key={entry.id} style={{background:"var(--bg)",border:"0.5px solid var(--br)",borderRadius:8,padding:"8px 10px",display:"flex",alignItems:"center",gap:8,minWidth:200}}>
          <Av name={c.name||"?"} size={24}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:500,color:"var(--t1)"}}>{c.name||"Unknown"}</div>
            <div style={{fontSize:11,color:"var(--t3)"}}>{c.role||"—"}</div>
          </div>
          <select value="Rejected" onChange={e=>moveStage(entry,e.target.value)} style={{fontSize:11,padding:"3px 4px",width:"auto"}}>
            {STAGES.map(s=><option key={s} value={s}>{s==="Rejected"?"Rejected":`Back to ${s}`}</option>)}
          </select>
        </div>;})}
      </div>}
    </div>}
  </div>;
}


// ── Task helpers ───────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().slice(0,10);}
function tomorrowStr(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function outlookLink(t){
  // Opens a prefilled Outlook (web) event for a task. Untimed tasks default to 8:00am.
  const d=t.due_date||todayStr();
  const [h,m]=(t.due_time||"08:00").split(":");
  const start=new Date(`${d}T${String(h).padStart(2,"0")}:${String(m||"00").padStart(2,"0")}:00`);
  const end=new Date(start.getTime()+15*60000);
  const body=[t.candidate_name?`Candidate: ${t.candidate_name}`:"","Open in Recruit CRM: https://gaia-search.com/recruitCRM.html"].filter(Boolean).join("\n");
  const q=new URLSearchParams({path:"/calendar/action/compose",rru:"addevent",subject:t.title||"Task",startdt:start.toISOString(),enddt:end.toISOString(),body});
  return "https://outlook.office.com/calendar/deeplink/compose?"+q.toString();
}
function dueLabel(due_date,due_time){
  if(!due_date)return null;
  const today=todayStr(),tom=tomorrowStr();
  const label=due_date===today?"Today":due_date===tom?"Tomorrow":due_date<today?`Overdue · ${fmtDate(due_date).replace(/ \d{4}$/,"")}`:fmtDate(due_date);
  return{label,overdue:due_date<today,today:due_date===today};
}
function requestNotifPerm(){
  if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
}
function sendNotif(title,body){
  if("Notification" in window && Notification.permission==="granted"){
    new Notification("recruitCRM: "+title,{body,icon:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234f6ef7'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='white' font-size='16'%3E✓%3C/text%3E%3C/svg%3E"});
  }
}

function TasksPage(){
  const [tasks,setTasks]=useState([]);const [loading,setLoading]=useState(true);
  const [text,setText]=useState("");const [due,setDue]=useState(todayStr());
  const [dueTime,setDueTime]=useState("");const [priority,setPriority]=useState("normal");
  const [adding,setAdding]=useState(false);const [err,setErr]=useState("");
  const [filter,setFilter]=useState("pending");
  const [notifStatus,setNotifStatus]=useState(typeof Notification!=="undefined"?Notification.permission:"unsupported");
  const [toast,setToast]=useState(null);
  const [snoozeId,setSnoozeId]=useState(null);
  const [laterTask,setLaterTask]=useState(null);
  const [laterD,setLaterD]=useState("");
  const [laterT,setLaterT]=useState("");
  const laterDateRef=React.useRef(null);
  // Bulk clean-up
  const [selMode,setSelMode]=useState(false);
  const [sel,setSel]=useState(new Set());
  const [bulkDate,setBulkDate]=useState(todayStr());
  const [bulkBusy,setBulkBusy]=useState(false);
  const [bulkMsg,setBulkMsg]=useState("");

  const load=useCallback(async()=>{
    setLoading(true);
    const{data,error}=await db.from("tasks").select("*").order("due_date",{ascending:true,nullsFirst:false});
    if(error)setErr(error.message);else setTasks(data||[]);
    setLoading(false);
  },[]);

  useEffect(()=>{load();requestNotifPerm();},[load]);

  // Poll every minute for due reminders
  useEffect(()=>{
    const check=()=>{
      const now=new Date();const todayD=todayStr();
      tasks.filter(t=>!t.done&&t.due_date&&t.due_time).forEach(t=>{
        if(t.due_date!==todayD)return;
        const[h,m]=(t.due_time||"").split(":");
        const due=new Date();due.setHours(+h,+m,0,0);
        const diff=due-now;
        if(diff>0&&diff<60000){// fires within next 60s window
          sendNotif(t.title,"Due at "+t.due_time);
          showToast(t);
          // Send email reminder via EmailJS
          emailjs.send("service_09b4hfs","template_dlc5054",{
            subject: "Task due: "+t.title,
            message: t.title+"\n\nDue: "+t.due_date+(t.due_time?" at "+t.due_time:"")+"\nPriority: "+(t.priority||"normal")+"\n\nOpen recruitCRM: https://gaia-search.com/recruitCRM.html",
            reply_to: "shaun.silva@gaia-search.com"
          },"MadIajEVnrBSCAMNb").catch(err=>console.error("EmailJS error:",err));
        }
      });
    };
    const id=setInterval(check,30000);check();
    return()=>clearInterval(id);
  },[tasks]);

  const showToast=(t)=>{
    setToast(t);
    setTimeout(()=>setToast(null),8000);
  };

  const enableNotifs=async()=>{
    const perm=await Notification.requestPermission();
    setNotifStatus(perm);
  };

  const add=async()=>{
    if(!text.trim())return;
    setAdding(true);setErr("");
    const payload={title:text.trim(),due_date:due||null,due_time:dueTime||null,priority,done:false};
    const{error}=await db.from("tasks").insert(payload);
    if(error){setErr(error.message);}else{setText("");setDue(todayStr());setDueTime("");setPriority("normal");load();}
    setAdding(false);
  };

  const toggle=async t=>{
    await db.from("tasks").update({done:!t.done}).eq("id",t.id);
    load();
  };

  const del=async id=>{await db.from("tasks").delete().eq("id",id);load();};

  const snooze=async(t,mins)=>{
    const d=new Date();d.setMinutes(d.getMinutes()+mins);
    const newTime=d.toTimeString().slice(0,5);
    await db.from("tasks").update({due_time:newTime,due_date:todayStr()}).eq("id",t.id);
    setSnoozeId(null);setToast(null);load();
  };

  const openLater=t=>{
    const d=new Date();d.setDate(d.getDate()+7);
    const z=n=>String(n).padStart(2,"0");
    setLaterTask(t);setLaterD(`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`);setLaterT(t.due_time||"");
    setTimeout(()=>{try{laterDateRef.current&&laterDateRef.current.showPicker&&laterDateRef.current.showPicker();}catch(e){}},80);
  };
  const saveLaterTask=async()=>{
    if(!laterTask||!laterD)return;
    await db.from("tasks").update({due_date:laterD,due_time:laterT||null}).eq("id",laterTask.id);
    const nm=laterTask.candidate_name||laterTask.title;
    setLaterTask(null);
    flash(`${nm} moved to ${new Date(laterD+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}`);
    load();
  };

  const PRIORITY_STYLES={
    urgent:{bg:"rgba(226,75,74,0.12)",fg:"#a32d2d",label:"Urgent"},
    high:{bg:"rgba(186,117,23,0.14)",fg:"#854f0b",label:"High"},
    normal:{bg:"rgba(91,101,119,0.10)",fg:"#5b6577",label:"Normal"},
    low:{bg:"#f1efe8",fg:"#5f5e5a",label:"Low"},
  };

  const pending=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done);
  const overdue=pending.filter(t=>t.due_date&&t.due_date<todayStr());
  const todayTasks=pending.filter(t=>t.due_date===todayStr());
  const upcoming=pending.filter(t=>t.due_date&&t.due_date>todayStr());
  const undated=pending.filter(t=>!t.due_date);

  // ── Bulk actions ──
  const isoOf=d=>{const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;};
  const nextMonday=()=>{const d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));return isoOf(d);};
  const nextWorkdays=n=>{const out=[];const d=new Date();while(out.length<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)out.push(isoOf(d));}return out;};
  const flash=m=>{setBulkMsg(m);setTimeout(()=>setBulkMsg(""),3500);};
  const togglePick=id=>setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const bulkRun=async(fn,msg)=>{setBulkBusy(true);await fn();setBulkBusy(false);setSel(new Set());setSelMode(false);flash(msg);load();};
  const moveTo=(ids,date)=>bulkRun(()=>db.from("tasks").update({due_date:date}).in("id",ids),`Moved ${ids.length} task${ids.length!==1?"s":""} to ${new Date(date+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}`);
  const markDone=ids=>bulkRun(()=>db.from("tasks").update({done:true}).in("id",ids),`Marked ${ids.length} task${ids.length!==1?"s":""} done`);
  const delTasks=ids=>{if(!confirm(`Delete ${ids.length} task${ids.length!==1?"s":""}? This can't be undone.`))return;bulkRun(()=>db.from("tasks").delete().in("id",ids),`Deleted ${ids.length} task${ids.length!==1?"s":""}`);};
  // Share tasks evenly over the next 5 working days, most urgent first
  const spread=ids=>{
    const days=nextWorkdays(5);
    const order=tasks.filter(t=>ids.includes(t.id)).sort((a,b)=>({urgent:0,high:1,normal:2,low:3}[a.priority||"normal"]-{urgent:0,high:1,normal:2,low:3}[b.priority||"normal"])||(a.due_date||"").localeCompare(b.due_date||""));
    const groups=days.map(()=>[]);
    order.forEach((t,i)=>groups[Math.floor(i*days.length/order.length)].push(t.id));
    bulkRun(()=>Promise.all(groups.map((g,i)=>g.length?db.from("tasks").update({due_date:days[i]}).in("id",g):null)),`Spread ${ids.length} tasks across ${new Date(days[0]+"T00:00").toLocaleDateString("en-GB",{weekday:"short"})}–${new Date(days[4]+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}`);
  };

  const renderTask=(t)=>{
    const dl=dueLabel(t.due_date,t.due_time);
    const ps=PRIORITY_STYLES[t.priority||"normal"];
    return <div key={t.id} onClick={selMode?()=>togglePick(t.id):undefined} style={{position:"relative",display:"flex",alignItems:"center",gap:10,padding:"11px 14px",borderBottom:"0.5px solid var(--br)",background:selMode&&sel.has(t.id)?"rgba(95,169,43,0.12)":dl?.overdue?"rgba(226,75,74,0.05)":"transparent",cursor:selMode?"pointer":"default"}}>
      {selMode&&<input type="checkbox" checked={sel.has(t.id)} onChange={()=>togglePick(t.id)} onClick={e=>e.stopPropagation()} style={{width:16,height:16,accentColor:ACCENT,flexShrink:0,cursor:"pointer"}}/>}
      <div onClick={selMode?undefined:()=>toggle(t)} style={{width:18,height:18,borderRadius:4,border:"0.5px solid var(--brm)",cursor:selMode?"inherit":"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:t.done?"#1d9e75":"transparent",opacity:selMode?0.5:1}}>
        {t.done&&<span style={{color:"#fff",fontSize:11}}>✓</span>}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,color:t.done?"var(--t3)":"var(--t1)",textDecoration:t.done?"line-through":"none",marginBottom:2}}>{t.title}</div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {dl&&<span style={{fontSize:11,fontWeight:500,color:dl.overdue?"#a32d2d":dl.today?"#854f0b":"var(--t3)",background:dl.overdue?"rgba(226,75,74,0.12)":dl.today?"rgba(186,117,23,0.14)":"transparent",padding:dl.overdue||dl.today?"1px 6px":"0",borderRadius:8}}>
            {dl.overdue?"⚠️ ":dl.today?"📅 ":""}{dl.label}{t.due_time?" · "+t.due_time:""}
          </span>}
          <span style={{fontSize:11,background:ps.bg,color:ps.fg,padding:"1px 6px",borderRadius:8}}>{ps.label}</span>
          {t.candidate_id&&<span onClick={()=>openCandidateById(t.candidate_id)} title="Open candidate record"
            style={{fontSize:11,background:"rgba(95,169,43,0.14)",color:"#2e7a2c",padding:"1px 7px",borderRadius:8,cursor:"pointer"}}>👤 {t.candidate_name||"Candidate"} →</span>}
        </div>
      </div>
      <div style={{display:"flex",gap:4,flexShrink:0}}>
        {!t.done&&!selMode&&<button className="btn-o" title="Contact later — pick a new date" style={{padding:"3px 8px",fontSize:11,whiteSpace:"nowrap"}} onClick={e=>{e.stopPropagation();openLater(t);}}>📅 Contact later</button>}
        {!t.done&&!selMode&&t.due_date&&<button className="btn-o" title="Add to Outlook calendar (untimed tasks go in at 8:00am)" style={{padding:"3px 8px",fontSize:11,whiteSpace:"nowrap"}} onClick={e=>{e.stopPropagation();window.open(outlookLink(t),"_blank","noopener");}}>📆 Outlook</button>}
        {!t.done&&<button className="btn-o" title="Snooze for a few minutes" style={{padding:"3px 7px",fontSize:11}} onClick={()=>setSnoozeId(snoozeId===t.id?null:t.id)}>⏰</button>}
        <button className="btn-d" style={{padding:"3px 8px"}} onClick={()=>del(t.id)}>×</button>
      </div>
      {snoozeId===t.id&&<div style={{position:"absolute",right:14,top:"100%",background:"var(--bg)",border:"0.5px solid var(--brm)",borderRadius:8,padding:10,zIndex:20,boxShadow:"0 4px 16px rgba(0,0,0,0.12)",minWidth:130}}>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:6,fontWeight:500}}>Snooze for…</div>
        {[[15,"15 min"],[30,"30 min"],[60,"1 hour"],[120,"2 hours"]].map(([m,l])=>(
          <div key={m} onClick={()=>snooze(t,m)} style={{fontSize:12,padding:"5px 10px",cursor:"pointer",borderRadius:6,color:"var(--t1)"}} onMouseOver={e=>e.target.style.background="var(--bg2)"} onMouseOut={e=>e.target.style.background="transparent"}>{l}</div>
        ))}
      </div>}
    </div>;
  };

  const Section=({title,items,emptyMsg})=>items.length===0?null:<>
    <div style={{fontSize:11,fontWeight:500,color:"var(--t3)",padding:"10px 14px 4px",textTransform:"uppercase",letterSpacing:"0.5px",background:"var(--bg2)",borderBottom:"0.5px solid var(--br)"}}>{title} ({items.length})</div>
    <div style={{position:"relative"}}>{items.map(renderTask)}</div>
  </>;

  return <div>
    {/* Toast notification */}
    {toast&&<div style={{position:"fixed",top:20,right:20,zIndex:9999,background:"var(--bg)",border:"2px solid "+ACCENT,borderRadius:10,padding:"14px 16px",maxWidth:320,boxShadow:"0 8px 32px rgba(0,0,0,0.15)"}}>
      <div style={{fontSize:12,color:ACCENT,fontWeight:500,marginBottom:4}}>⏰ Reminder</div>
      <div style={{fontSize:13,color:"var(--t1)",marginBottom:10}}>{toast.title}</div>
      <div style={{display:"flex",gap:6}}>
        <button className="btn-o" style={{fontSize:11,padding:"4px 10px"}} onClick={()=>snooze(toast,15)}>Snooze 15m</button>
        <button className="btn-a" style={{fontSize:11,padding:"4px 10px"}} onClick={()=>{toggle(toast);setToast(null);}}>Mark done</button>
        <button onClick={()=>setToast(null)} style={{background:"none",border:"none",cursor:"pointer",color:"var(--t3)",fontSize:16,lineHeight:1}}>×</button>
      </div>
    </div>}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>Tasks & reminders</span>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {notifStatus==="default"&&<button className="btn-o" style={{fontSize:11}} onClick={enableNotifs}>🔔 Enable reminders</button>}
        {notifStatus==="granted"&&<span style={{fontSize:11,color:"#1d9e75"}}>🔔 Reminders on</span>}
        {notifStatus==="denied"&&<span style={{fontSize:11,color:"#a32d2d"}}>🔕 Reminders blocked</span>}
        <span style={{fontSize:12,color:"var(--t3)"}}>{pending.length} pending · {overdue.length} overdue</span>
      </div>
    </div>

    {/* Overdue alert banner with one-click clean-up */}
    {overdue.length>0&&!selMode&&<div style={{background:"rgba(226,75,74,0.12)",border:"0.5px solid #f09595",borderRadius:8,padding:"10px 14px",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:16}}>⚠️</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:500,color:"#a32d2d"}}>{overdue.length} overdue task{overdue.length!==1?"s":""}</div>
          <div style={{fontSize:12,color:"#c53030"}}>{overdue.map(t=>t.title).slice(0,2).join(" · ")}{overdue.length>2?` + ${overdue.length-2} more`:""}</div>
        </div>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
        <button className="btn-a" style={{fontSize:12,padding:"5px 12px"}} disabled={bulkBusy} onClick={()=>spread(overdue.map(t=>t.id))} title="Shares them evenly over the next 5 working days, urgent ones first">📆 Spread over next 5 working days</button>
        <button className="btn-o" style={{fontSize:12,background:"var(--bg)"}} disabled={bulkBusy} onClick={()=>moveTo(overdue.map(t=>t.id),todayStr())}>Move all to today</button>
        <button className="btn-o" style={{fontSize:12,background:"var(--bg)"}} disabled={bulkBusy} onClick={()=>moveTo(overdue.map(t=>t.id),nextMonday())}>Move all to next Monday</button>
        <button className="btn-o" style={{fontSize:12,background:"var(--bg)"}} onClick={()=>{setFilter("overdue");setSelMode(true);setSel(new Set());}}>Pick which ones…</button>
      </div>
    </div>}

    {laterTask&&(()=>{
      const z=n=>String(n).padStart(2,"0");
      const iso=d=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
      const plus=(days,months)=>{const d=new Date();d.setDate(d.getDate()+(days||0));if(months)d.setMonth(d.getMonth()+months);return iso(d);};
      const mon=()=>{const d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));return iso(d);};
      const picks=[["Tomorrow",plus(1)],["Next Monday",mon()],["1 week",plus(7)],["2 weeks",plus(14)],["1 month",plus(0,1)],["3 months",plus(0,3)],["6 months",plus(0,6)]];
      return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setLaterTask(null);}}>
        <div className="modal" style={{maxWidth:400}}>
          <h3>📅 Contact later</h3>
          <div style={{fontSize:12,color:"var(--t2)",marginBottom:12}}>Move <strong>{laterTask.title}</strong> to a new date.</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            {picks.map(([l,v])=><button key={l} className={laterD===v?"btn-a":"btn-o"} style={{fontSize:11,padding:"4px 10px"}} onClick={()=>setLaterD(v)}>{l}</button>)}
          </div>
          <div className="fr2">
            <div><label>Date</label><input ref={laterDateRef} type="date" min={todayStr()} value={laterD} onChange={e=>setLaterD(e.target.value)} onClick={e=>{try{e.target.showPicker&&e.target.showPicker();}catch(x){}}}/></div>
            <div><label>Time (optional)</label><input type="time" value={laterT} onChange={e=>setLaterT(e.target.value)}/></div>
          </div>
          {laterD&&<div style={{fontSize:12,color:"var(--t2)",marginTop:10}}>New date: <strong>{new Date(laterD+"T00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</strong>{laterT?` at ${laterT}`:""}</div>}
          <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
            <button className="btn-o" onClick={()=>setLaterTask(null)}>Cancel</button>
            <button className="btn-a" onClick={saveLaterTask} disabled={!laterD}>Save</button>
          </div>
        </div>
      </div>;
    })()}
    {bulkMsg&&<div style={{background:"rgba(95,169,43,0.16)",border:"0.5px solid #97c459",color:"#3b6d11",borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:10}}>✓ {bulkMsg}</div>}

    {/* Bulk action bar */}
    {selMode&&<div style={{position:"sticky",top:0,zIndex:30,background:"var(--bg)",border:"1px solid "+ACCENT,borderRadius:10,padding:"10px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",boxShadow:"0 4px 16px rgba(0,0,0,0.08)"}}>
      <span style={{fontSize:13,fontWeight:600,color:ACCENT}}>{sel.size} selected</span>
      <button onClick={()=>{const vis=filter==="done"?done:filter==="today"?todayTasks:filter==="overdue"?overdue:filter==="upcoming"?upcoming:pending;setSel(new Set(vis.map(t=>t.id)));}} style={{background:"none",border:"none",color:ACCENT,cursor:"pointer",fontSize:12,fontFamily:"inherit",textDecoration:"underline"}}>Select all shown</button>
      <span style={{flex:1}}/>
      <input type="date" value={bulkDate} onChange={e=>setBulkDate(e.target.value)} style={{width:"auto",fontSize:12}}/>
      <button className="btn-a" style={{fontSize:12,padding:"5px 10px"}} disabled={!sel.size||bulkBusy} onClick={()=>moveTo([...sel],bulkDate)}>Move to date</button>
      <button className="btn-o" style={{fontSize:12}} disabled={!sel.size||bulkBusy} onClick={()=>spread([...sel])}>Spread over week</button>
      <button className="btn-o" style={{fontSize:12}} disabled={!sel.size||bulkBusy} onClick={()=>markDone([...sel])}>✓ Mark done</button>
      <button className="btn-d" style={{fontSize:12,padding:"5px 10px"}} disabled={!sel.size||bulkBusy} onClick={()=>delTasks([...sel])}>Delete</button>
      <button onClick={()=>{setSelMode(false);setSel(new Set());}} style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>✕ Cancel</button>
    </div>}

    {/* Add task */}
    <Panel title="Add task or reminder" style={{marginBottom:12}}>
      <div style={{padding:14,display:"flex",flexDirection:"column",gap:10}}>
        <input type="text" value={text} onChange={e=>setText(e.target.value)} placeholder="What needs doing? e.g. Follow up with Barclays re: Sophie Archer" onKeyDown={e=>e.key==="Enter"&&add()}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <div style={{display:"flex",flexDirection:"column",gap:3,flex:1,minWidth:120}}>
            <label style={{fontSize:11,color:"var(--t2)"}}>Due date</label>
            <input type="date" value={due} onChange={e=>setDue(e.target.value)}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:3,width:120}}>
            <label style={{fontSize:11,color:"var(--t2)"}}>Remind me at</label>
            <input type="time" value={dueTime} onChange={e=>setDueTime(e.target.value)} style={{width:"100%",padding:"7px 10px",border:"0.5px solid var(--brm)",borderRadius:7,fontSize:13,color:"var(--t1)",background:"var(--bg)",outline:"none"}}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:3,width:120}}>
            <label style={{fontSize:11,color:"var(--t2)"}}>Priority</label>
            <select value={priority} onChange={e=>setPriority(e.target.value)}>
              <option value="urgent">🔴 Urgent</option>
              <option value="high">🟠 High</option>
              <option value="normal">🔵 Normal</option>
              <option value="low">⚪ Low</option>
            </select>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:3,justifyContent:"flex-end"}}>
            <label style={{fontSize:11,color:"transparent"}}>.</label>
            <button className="btn-a" onClick={add} disabled={adding||!text.trim()}>{adding?<><span className="spin"></span>Adding…</>:"Add task"}</button>
          </div>
        </div>
        {/* Quick date shortcuts */}
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:"var(--t3)"}}>Quick:</span>
          {[["Today",todayStr()],["Tomorrow",tomorrowStr()],["Next week",(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10)})()]].map(([l,v])=>(
            <span key={l} onClick={()=>setDue(v)} style={{fontSize:11,color:ACCENT,cursor:"pointer",textDecoration:"underline"}}>{l}</span>
          ))}
          <span onClick={()=>setDue("")} style={{fontSize:11,color:"var(--t3)",cursor:"pointer",textDecoration:"underline"}}>No date</span>
        </div>
        <Err msg={err}/>
      </div>
    </Panel>

    {/* Filter tabs */}
    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
      {!selMode&&<button onClick={()=>{setSelMode(true);setSel(new Set());}} style={{fontSize:12,padding:"5px 12px",borderRadius:20,border:"0.5px dashed var(--brm)",cursor:"pointer",background:"transparent",color:"var(--t2)",fontFamily:"inherit",order:99}}>☑ Select…</button>}
      {[["pending","Pending"],["today","Today"],["overdue","Overdue"],["upcoming","Upcoming"],["done","Completed"]].map(([k,l])=>(
        <button key={k} onClick={()=>setFilter(k)} style={{fontSize:12,padding:"5px 12px",borderRadius:20,border:"0.5px solid var(--brm)",cursor:"pointer",background:filter===k?ACCENT:"transparent",color:filter===k?"#fff":"var(--t2)",fontFamily:"inherit"}}>
          {l} {k==="overdue"&&overdue.length>0?`(${overdue.length})`:k==="today"?`(${todayTasks.length})`:k==="pending"?`(${pending.length})`:k==="done"?`(${done.length})`:k==="upcoming"?`(${upcoming.length})`:""}
        </button>
      ))}
    </div>

    <Panel title={filter==="done"?"Completed tasks":filter==="today"?"Today's tasks":filter==="overdue"?"Overdue tasks":filter==="upcoming"?"Upcoming":"All pending tasks"}>
      {loading?<Spin/>:<div style={{position:"relative"}}>
        {filter==="pending"&&<>
          <Section title="Overdue" items={overdue}/>
          <Section title="Today" items={todayTasks}/>
          <Section title="Upcoming" items={upcoming}/>
          <Section title="No due date" items={undated}/>
          {pending.length===0&&<div style={{padding:"30px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>All done! 🎉</div>}
        </>}
        {filter==="today"&&(todayTasks.length===0?<div style={{padding:"30px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>Nothing due today.</div>:<div>{todayTasks.map(renderTask)}</div>)}
        {filter==="overdue"&&(overdue.length===0?<div style={{padding:"30px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>No overdue tasks! 🎉</div>:<div>{overdue.map(renderTask)}</div>)}
        {filter==="upcoming"&&(upcoming.length===0?<div style={{padding:"30px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>Nothing upcoming.</div>:<div>{upcoming.map(renderTask)}</div>)}
        {filter==="done"&&(done.length===0?<div style={{padding:"30px 0",textAlign:"center",color:"var(--t3)",fontSize:13}}>No completed tasks yet.</div>:<div>{done.map(renderTask)}</div>)}
      </div>}
    </Panel>
  </div>;
}

function EmptyState({icon,title,sub,action,onAction}){
  return <div style={{padding:"48px 20px",textAlign:"center",color:"var(--t3)"}}>
    <div style={{display:"flex",justifyContent:"center",marginBottom:12,color:"var(--g-green)"}}>{ICON_PATHS[icon]?<Icon n={icon} size={34} stroke={1.3}/>:<span style={{fontSize:34}}>{icon}</span>}</div>
    <div style={{fontSize:14,fontWeight:500,color:"var(--t1)",marginBottom:6}}>{title}</div>
    <div style={{fontSize:13,color:"var(--t2)",marginBottom:16,maxWidth:300,margin:"0 auto 16px"}}>{sub}</div>
    {action&&<button className="btn-a" onClick={onAction}>{action}</button>}
  </div>;
}

function CVParserPage(){
  const [mode,setMode]=useState("existing"); // "existing" | "upload"
  const [cands,setCands]=useState([]);const [sel,setSel]=useState(null);
  const [summary,setSummary]=useState("");const [loading,setLoading]=useState(false);const [listLoading,setListLoading]=useState(true);const [err,setErr]=useState("");
  // upload mode state
  const [cvText,setCvText]=useState("");const [parsed,setParsed]=useState(null);const [saving,setSaving]=useState(false);const [saved,setSaved]=useState(false);
  useEffect(()=>{allRows(()=>db.from("candidates").select("*").order("created_at",{ascending:false}).order("id")).then(({data})=>{setCands(data||[]);if(data&&data.length)setSel(data[0]);setListLoading(false);});},[]);
  const run=useCallback(async()=>{
    if(!sel)return;setSummary("");setLoading(true);setErr("");
    try{await claude("You are a recruitment AI. Write a concise 3-sentence recruiter summary highlighting the candidate's strongest selling points. Professional, no bullet points.",`Candidate: ${sel.name}, ${sel.role||"?"}, ${sel.experience||"?"} experience, ${sel.location||"?"}, ${sel.salary||"?"}, notice ${sel.notice||"?"}. Skills: ${(sel.skills||[]).join(", ")||"not listed"}. Notes: ${sel.notes||"none"}.`,chunk=>setSummary(s=>s+chunk));}
    catch(e){setErr(e.message);}setLoading(false);
  },[sel]);

  const parseCV=async()=>{
    if(!cvText.trim()){setErr("Paste a CV first");return;}
    setParsed(null);setLoading(true);setErr("");setSaved(false);
    try{
      let raw="";
      await claude(
        `You are a CV parser. Extract structured data from the CV text. Respond ONLY with a JSON object (no markdown, no explanation) with these keys: name, role, email, phone, location, experience, salary, notice, skills (array of strings), notes (2-sentence summary). If a field is unknown use null.`,
        `CV TEXT:\n${cvText.slice(0,4000)}`,
        chunk=>{raw+=chunk;}
      );
      const clean=raw.replace(/```json|```/g,"").trim();
      const obj=JSON.parse(clean);
      setParsed(obj);
    }catch(e){setErr("Parse failed: "+e.message);}
    setLoading(false);
  };

  const saveCandidate=async()=>{
    if(!parsed||!parsed.name)return;
    setSaving(true);setErr("");
    const payload={...parsed,skills:Array.isArray(parsed.skills)?parsed.skills:[],status:"New",initials:ini(parsed.name)};
    const{error}=await db.from("candidates").insert(payload);
    if(error){setErr(error.message);}else{setSaved(true);allRows(()=>db.from("candidates").select("*").order("created_at",{ascending:false}).order("id")).then(({data})=>setCands(data||[]));}
    setSaving(false);
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>

const CRM_FIELDS = [
  {key:"name",      label:"Full name",    required:true},
  {key:"role",      label:"Job title / role"},
  {key:"email",     label:"Email"},
  {key:"phone",     label:"Phone"},
  {key:"location",  label:"Location"},
  {key:"experience",label:"Experience"},
  {key:"salary",    label:"Current salary"},
  {key:"notice",    label:"Notice period"},
  {key:"skills",    label:"Skills"},
  {key:"status",    label:"Status"},
  {key:"notes",     label:"Notes"},
];

// Auto-detect which CSV column maps to which CRM field
function autoMap(headers) {
  const map = {};
  const rules = {
    name:       ["name","full name","candidate","firstname","first name","candidate name"],
    role:       ["role","job title","title","position","job","current role","current position"],
    email:      ["email","e-mail","email address"],
    phone:      ["phone","mobile","telephone","tel","contact number","phone number"],
    location:   ["location","city","area","region","address","country"],
    experience: ["experience","years","exp","years experience","yrs"],
    salary:     ["salary","current salary","pay","compensation","ctc","package"],
    notice:     ["notice","notice period","availability","available"],
    skills:     ["skills","skill set","technologies","tech stack","competencies","expertise"],
    status:     ["status","stage","pipeline stage"],
    notes:      ["notes","comments","additional info","summary","about"],
  };
  for (const [field, keywords] of Object.entries(rules)) {
    for (const h of headers) {
      if (keywords.some(k => h.toLowerCase().trim().includes(k))) {
        if (!Object.values(map).includes(h)) { map[field] = h; break; }
      }
    }
  }
  return map;
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { headers: [], rows: [] };
  const parseRow = line => {
    const cells = []; let cur = ""; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    cells.push(cur.trim());
    return cells;
  };
  const headers = parseRow(lines[0]);
  const rows = lines.slice(1).map(l => {
    const cells = parseRow(l);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = cells[i] || ""; });
    return obj;
  });
  return { headers, rows };
}

function CSVImportPage() {
  const [step, setStep] = useState(1); // 1=upload, 2=map, 3=preview, 4=done
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [importing, setImporting] = useState(false);
  const [progress, setProgress] = useState(0);
  const [imported, setImported] = useState(0);
  const [skipped, setSkipped] = useState(0);
  const [err, setErr] = useState("");
  const fileRef = React.useRef();

  const onFile = e => {
    const file = e.target.files[0];
    if (!file) return;
    setErr("");
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const { headers: h, rows: r } = parseCSV(ev.target.result);
        if (!h.length) { setErr("Could not read CSV — make sure it has a header row."); return; }
        setHeaders(h);
        setRows(r);
        setMapping(autoMap(h));
        setStep(2);
      } catch(ex) { setErr("Failed to parse file: " + ex.message); }
    };
    reader.readAsText(file);
  };

  const setMap = (field, col) => setMapping(m => ({ ...m, [field]: col === "" ? undefined : col }));

  const preview = rows.slice(0, 5).map(row => {
    const rec = {};
    for (const [field, col] of Object.entries(mapping)) {
      if (col) rec[field] = row[col] || "";
    }
    return rec;
  });

  const doImport = async () => {
    setImporting(true); setProgress(0); setImported(0); setSkipped(0); setErr("");
    const records = rows.map(row => {
      const rec = { status: "New" };
      for (const [field, col] of Object.entries(mapping)) {
        if (col && row[col]) rec[field] = row[col].trim();
      }
      // split skills by comma/semicolon
      if (rec.skills) rec.skills = rec.skills.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
      if (rec.name) rec.initials = ini(rec.name);
      return rec;
    }).filter(r => r.name && r.name.trim());

    let imp = 0, skip = rows.length - records.length;
    const BATCH = 50;
    for (let i = 0; i < records.length; i += BATCH) {
      const batch = records.slice(i, i + BATCH);
      const { error } = await db.from("candidates").insert(batch);
      if (error) { setErr("Import error: " + error.message); setImporting(false); return; }
      imp += batch.length;
      setImported(imp);
      setProgress(Math.round((imp / records.length) * 100));
    }
    setSkipped(skip);
    setImporting(false);
    setStep(4);
  };

  const reset = () => { setStep(1); setHeaders([]); setRows([]); setMapping({}); setProgress(0); setImported(0); setSkipped(0); setErr(""); if(fileRef.current) fileRef.current.value=""; };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <span style={{fontSize:14,fontWeight:500,color:"var(--t1)"}}>CSV import</span>
      <div style={{display:"flex",gap:8}}>
        {[["1","Upload"],["2","Map columns"],["3","Preview"],["4","Done"]].map(([n,l],i)=>(
          <span key={n} style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:step>i?"var(--t1)":"var(--t3)",fontWeight:step===i+1?500:400}}>
            <span style={{width:20,height:20,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,background:step>i+1?"#1d9e75":step===i+1?ACCENT:"var(--bg2)",color:step>=i+1?"#fff":"var(--t3)",fontWeight:500}}>{step>i+1?"✓":n}</span>
            {l}{i<3&&<span style={{color:"var(--t3)",margin:"0 2px"}}>›</span>}
          </span>
        ))}
      </div>
    </div>

    {step===1&&<div>
      <Panel title="Upload your CSV file">
        <div style={{padding:24}}>
          <div style={{border:"1.5px dashed var(--brm)",borderRadius:8,padding:"36px 20px",textAlign:"center",cursor:"pointer"}} onClick={()=>fileRef.current?.click()}>
            <div style={{fontSize:32,marginBottom:10}}>📂</div>
            <div style={{fontWeight:500,fontSize:14,color:"var(--t1)",marginBottom:6}}>Click to upload a CSV file</div>
            <div style={{fontSize:12,color:"var(--t3)"}}>Exported from Bullhorn, Vincere, JobAdder, LinkedIn, Excel, Google Sheets, or any other CRM</div>
            <input ref={fileRef} type="file" accept=".csv,.txt" style={{display:"none"}} onChange={onFile}/>
          </div>
          <Err msg={err}/>
          <div style={{marginTop:20,background:"var(--bg2)",borderRadius:8,padding:"14px 16px"}}>
            <div style={{fontSize:12,fontWeight:500,color:"var(--t1)",marginBottom:8}}>How to export from popular CRMs</div>
            {[["Bullhorn","Reports → Candidate Search → Export to CSV"],["Vincere","Candidates → Bulk Actions → Export"],["JobAdder","Candidates → Export → CSV"],["LinkedIn Recruiter","Pipeline → Export → CSV"],["Excel / Google Sheets","File → Download → CSV"]].map(([crm,steps])=>(
              <div key={crm} style={{display:"flex",gap:8,marginBottom:6,fontSize:12}}>
                <span style={{fontWeight:500,color:"var(--t1)",minWidth:110}}>{crm}</span>
                <span style={{color:"var(--t2)"}}>{steps}</span>
              </div>
            ))}
          </div>
        </div>
      </Panel>
    </div>}

    {step===2&&<div>
      <Panel title={`Map columns — ${rows.length} candidates found in CSV`} actions={<button className="btn-o" style={{fontSize:11}} onClick={reset}>← Start over</button>}>
        <div style={{padding:14}}>
          <div style={{fontSize:12,color:"var(--t2)",marginBottom:12}}>Match your CSV columns to the correct CRM fields. We've auto-detected what we can — check and adjust any that look wrong.</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {CRM_FIELDS.map(f=>(
              <div key={f.key} style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:130,fontSize:12,color:"var(--t1)",fontWeight:f.required?500:400,flexShrink:0}}>
                  {f.label}{f.required&&<span style={{color:"#e24b4a",marginLeft:2}}>*</span>}
                </div>
                <select value={mapping[f.key]||""} onChange={e=>setMap(f.key,e.target.value)} style={{fontSize:12}}>
                  <option value="">— skip this field —</option>
                  {headers.map(h=><option key={h} value={h}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          {!mapping.name&&<div className="err" style={{marginBottom:12}}>⚠️ You must map the "Full name" field to continue.</div>}
          <div style={{display:"flex",gap:8}}>
            <button className="btn-o" onClick={reset}>← Back</button>
            <button className="btn-a" onClick={()=>setStep(3)} disabled={!mapping.name}>Preview import →</button>
          </div>
        </div>
      </Panel>
    </div>}

    {step===3&&<div>
      <Panel title={`Preview — first 5 of ${rows.length} candidates`} actions={<button className="btn-o" style={{fontSize:11}} onClick={()=>setStep(2)}>← Edit mapping</button>}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:500}}>
            <thead><tr>
              {["Name","Role","Email","Location","Skills","Status"].map(h=><th key={h} className="th">{h}</th>)}
            </tr></thead>
            <tbody>{preview.map((r,i)=><tr key={i} style={{borderBottom:"0.5px solid var(--br)"}}>
              <td className="td"><div style={{display:"flex",alignItems:"center",gap:8}}>{r.name&&<Av name={r.name}/>}<span style={{fontWeight:500}}>{r.name||"—"}</span></div></td>
              <td className="td" style={{color:"var(--t2)"}}>{r.role||"—"}</td>
              <td className="td" style={{color:ACCENT,fontSize:12}}>{r.email||"—"}</td>
              <td className="td" style={{color:"var(--t2)"}}>{r.location||"—"}</td>
              <td className="td"><div style={{display:"flex",flexWrap:"wrap",gap:3}}>{(Array.isArray(r.skills)?r.skills:r.skills?r.skills.split(","):[]).slice(0,3).map((s,j)=><span key={j} style={{background:"rgba(95,169,43,0.14)",color:"#2e7a2c",fontSize:10,borderRadius:8,padding:"1px 6px"}}>{s.trim()}</span>)}</div></td>
              <td className="td"><Pill label={r.status||"New"}/></td>
            </tr>)}</tbody>
          </table>
        </div>
        <div style={{padding:14,borderTop:"0.5px solid var(--br)",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div style={{flex:1,fontSize:13,color:"var(--t2)"}}>
            Ready to import <strong style={{color:"var(--t1)"}}>{rows.filter(r=>r[mapping.name]).length} candidates</strong> into Supabase.
            {rows.length-rows.filter(r=>r[mapping.name]).length>0&&<span style={{color:"#e24b4a"}}> {rows.length-rows.filter(r=>r[mapping.name]).length} rows will be skipped (no name).</span>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn-o" onClick={()=>setStep(2)}>← Back</button>
            <button className="btn-a" onClick={doImport} disabled={importing}>{importing?<><span className="spin"></span>Importing…</>:"Import all candidates"}</button>
          </div>
        </div>
        {importing&&<div style={{padding:"0 14px 14px"}}>
          <div style={{height:6,background:"var(--bg2)",borderRadius:10,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${progress}%`,background:ACCENT,borderRadius:10,transition:"width 0.3s"}}/>
          </div>
          <div style={{fontSize:12,color:"var(--t2)",marginTop:6}}>{imported} of {rows.filter(r=>r[mapping.name]).length} imported…</div>
        </div>}
        <Err msg={err}/>
      </Panel>
    </div>}

    {step===4&&<div>
      <Panel title="Import complete!">
        <div style={{padding:32,textAlign:"center"}}>
          <div style={{fontSize:48,marginBottom:16}}>🎉</div>
          <div style={{fontSize:18,fontWeight:500,color:"var(--t1)",marginBottom:8}}>
            {imported} candidate{imported!==1?"s":""} imported successfully
          </div>
          {skipped>0&&<div style={{fontSize:13,color:"var(--t3)",marginBottom:16}}>{skipped} rows skipped (missing name)</div>}
          <div style={{fontSize:13,color:"var(--t2)",marginBottom:24}}>All candidates are now in your Supabase database and ready to use.</div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="btn-a" onClick={()=>window.dispatchEvent(new CustomEvent("nav",{detail:"candidates"}))}>View candidates →</button>
            <button className="btn-o" onClick={reset}>Import another file</button>
          </div>
        </div>
      </Panel>
    </div>}
  </div>;
}

// FEATURE 1: BD PIPELINE (Client pipeline board)
// ============================================================
const BD_STAGES=["Prospect","Qualified","Proposal Sent","Terms Agreed","Live Client","Cold"];
const BD_COLORS={"Prospect":"rgba(91,101,119,0.10)","Qualified":"rgba(186,117,23,0.14)","Proposal Sent":"rgba(55,138,221,0.14)","Terms Agreed":"rgba(212,83,126,0.12)","Live Client":"rgba(95,169,43,0.16)","Cold":"#f1efe8"};
const BD_FG={"Prospect":"#5b6577","Qualified":"#854f0b","Proposal Sent":"#185fa5","Terms Agreed":"#993556","Live Client":"#3b6d11","Cold":"#5f5e5a"};

function BDPipelinePage(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const blank={company_name:"",contact_name:"",contact_email:"",contact_phone:"",stage:"Prospect",notes:"",next_action:"",next_action_date:"",value:""};
  const [f,setF]=useState(blank);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const load=useCallback(async()=>{
    setLoading(true);
    const{data}=await db.from("client_pipeline").select("*").order("created_at",{ascending:false});
    setRows(data||[]);setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const save=async()=>{
    if(!f.company_name.trim())return setErr("Company name required");
    setSaving(true);setErr("");
    const payload={...f,value:f.value?parseFloat(f.value):null};
    const{error}=editing
      ?await db.from("client_pipeline").update(payload).eq("id",editing.id)
      :await db.from("client_pipeline").insert(payload);
    if(error)setErr(error.message);else{setModal(false);setEditing(null);setF(blank);load();}
    setSaving(false);
  };

  const updateStage=async(id,stage)=>{
    await db.from("client_pipeline").update({stage}).eq("id",id);load();
  };

  const del=async id=>{if(!confirm("Delete this lead?"))return;await db.from("client_pipeline").delete().eq("id",id);load();};

  const openEdit=r=>{setEditing(r);setF({...r,value:r.value||""});setModal(true);};

  const byStage=BD_STAGES.reduce((a,s)=>{a[s]=(rows||[]).filter(r=>r.stage===s);return a;},{});

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:15,fontWeight:500}}>BD Pipeline</div>
      <button className="btn-a" onClick={()=>{setEditing(null);setF(blank);setModal(true);}}>+ Add Lead</button>
    </div>
    {loading?<Spin/>:
    <div style={{overflowX:"auto",paddingBottom:8}}>
      <div style={{display:"flex",gap:10,minWidth:900}}>
      {BD_STAGES.map(stage=><div key={stage} style={{flex:1,minWidth:148,background:"var(--bg)",borderRadius:10,border:"0.5px solid var(--br)",overflow:"hidden"}}>
        <div style={{background:BD_COLORS[stage],color:BD_FG[stage],padding:"8px 12px",fontSize:11,fontWeight:600,display:"flex",justifyContent:"space-between"}}>
          <span>{stage}</span><span>{byStage[stage].length}</span>
        </div>
        <div style={{padding:8,minHeight:60}}>
          {byStage[stage].map(r=><div key={r.id} style={{background:"var(--bg2)",borderRadius:8,padding:"10px 12px",marginBottom:8,border:"0.5px solid var(--br)"}}>
            <div style={{fontWeight:500,fontSize:13,marginBottom:2}}>{r.company_name}</div>
            {r.contact_name&&<div style={{fontSize:11,color:"var(--t2)"}}>{r.contact_name}</div>}
            {r.next_action&&<div style={{fontSize:11,color:"var(--t3)",marginTop:4}}>→ {r.next_action}</div>}
            {r.value&&<div style={{fontSize:11,color:"#3b6d11",marginTop:2}}>£{parseFloat(r.value).toLocaleString()}</div>}
            <div style={{display:"flex",gap:4,marginTop:8,flexWrap:"wrap"}}>
              <select value={r.stage} onChange={e=>updateStage(r.id,e.target.value)} style={{fontSize:10,padding:"2px 6px",width:"auto",flex:1}}>
                {BD_STAGES.map(s=><option key={s}>{s}</option>)}
              </select>
              <button className="btn-o" style={{fontSize:10,padding:"2px 7px"}} onClick={()=>openEdit(r)}>Edit</button>
              <button className="btn-d" style={{fontSize:10,padding:"2px 7px"}} onClick={()=>del(r.id)}>✕</button>
            </div>
          </div>)}
        </div>
      </div>)}
      </div>
    </div>}
    {modal&&<div className="modal-overlay" onClick={()=>setModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>{editing?"Edit Lead":"Add BD Lead"}</h3>
        <div className="fr"><label>Company Name *</label><input value={f.company_name} onChange={s("company_name")} placeholder="Company name"/></div>
        <div className="fr2">
          <div className="fr" style={{margin:0}}><label>Contact Name</label><input value={f.contact_name} onChange={s("contact_name")}/></div>
          <div className="fr" style={{margin:0}}><label>Stage</label><select value={f.stage} onChange={s("stage")}>{BD_STAGES.map(x=><option key={x}>{x}</option>)}</select></div>
        </div>
        <div className="fr2">
          <div className="fr" style={{margin:0}}><label>Email</label><input value={f.contact_email} onChange={s("contact_email")}/></div>
          <div className="fr" style={{margin:0}}><label>Phone</label><input value={f.contact_phone} onChange={s("contact_phone")}/></div>
        </div>
        <div className="fr2">
          <div className="fr" style={{margin:0}}><label>Next Action</label><input value={f.next_action} onChange={s("next_action")}/></div>
          <div className="fr" style={{margin:0}}><label>Action Date</label><input type="date" value={f.next_action_date} onChange={s("next_action_date")}/></div>
        </div>
        <div className="fr"><label>Est. Value (£)</label><input value={f.value} onChange={s("value")} placeholder="10000"/></div>
        <div className="fr"><label>Notes</label><textarea value={f.notes} onChange={s("notes")}/></div>
        {err&&<div className="err">{err}</div>}
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
          <button className="btn-o" onClick={()=>setModal(false)}>Cancel</button>
          <button className="btn-a" onClick={save} disabled={saving}>{saving?"Saving…":"Save"}</button>
        </div>
      </div>
    </div>}
  </div>;
}

const SUBMITTAL_STATUSES=["Submitted","Shortlisted","Interview Booked","Offer Made","Placed","Rejected"];

function SubmittalsPage(){
  const [rows,setRows]=useState([]);

  const [modal,setModal]=useState(false);
  const [candidates,setCandidates]=useState([]);
  const [jobs,setJobs]=useState([]);

  const [f,setF]=useState(blank);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const load=useCallback(async()=>{
    setLoading(true);
    const[{data:sub},{data:cands},{data:js}]=await Promise.all([
      db.from("submittals").select("*,candidates(name,role),jobs(title,companies(name))").order("created_at",{ascending:false}),
      allRows(()=>db.from("candidates").select("id,name,role").order("name").order("id")),

    setRows(sub||[]);setCandidates(cands||[]);setJobs(js||[]);setLoading(false);

    setSaving(false);

  const updateStatus=async(id,status)=>{

    "Submitted":"rgba(91,101,119,0.10)","Shortlisted":"rgba(186,117,23,0.14)","Interview Booked":"rgba(55,138,221,0.14)",
    "Offer Made":"rgba(212,83,126,0.12)","Placed":"rgba(95,169,43,0.16)","Rejected":"rgba(226,75,74,0.12)"
  }[st]||"#f1efe8");

  return <div>

    <div className="tbl-scroll"><table style={{width:"100%",minWidth:760,borderCollapse:"collapse",background:"var(--bg)",borderRadius:10,overflow:"hidden",border:"0.5px solid var(--br)",tableLayout:"fixed"}}>
      <colgroup>
        <col style={{width:"18%"}}/><col style={{width:"22%"}}/><col style={{width:"16%"}}/>
        <col style={{width:"11%"}}/><col style={{width:"14%"}}/><col style={{width:"19%"}}/>
      </colgroup>
      <thead><tr>
        <th className="th">Candidate</th><th className="th">Role</th><th className="th">Company</th>

      <tbody>{rows.map(r=><tr key={r.id}>
        <td className="td" style={{fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.candidates?.name||"—"}</td>
        <td className="td" style={{color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={noteField(r.notes,"Role")||""}>{r.jobs?.title||noteField(r.notes,"Role")||"—"}{!r.job_id&&noteField(r.notes,"Company")&&<span className="g-pill" style={{marginLeft:6,fontSize:8,padding:"1px 6px",background:"rgba(17,17,17,0.06)",color:"var(--t3)"}}>Spec</span>}</td>
        <td className="td" style={{color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.jobs?.companies?.name||noteField(r.notes,"Company")||"—"}</td>
        <td className="td" style={{color:"var(--t3)",whiteSpace:"nowrap"}}>{fmtDate(r.submitted_date)||"—"}</td>
        <td className="td">
          <select value={r.status} onChange={e=>updateStatus(r.id,e.target.value)} style={{fontSize:11,padding:"2px 6px",background:statusColor(r.status),border:"none",borderRadius:6,fontWeight:500}}>
            {SUBMITTAL_STATUSES.map(x=><option key={x}>{x}</option>)}
          </select>
        </td>
        <td className="td" style={{fontSize:11,color:"var(--t2)",maxWidth:200}}>{r.client_feedback||"—"}</td>
      </tr>)}</tbody>
    </table></div>}
    {modal&&<div className="modal-overlay" onClick={()=>setModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>New Submittal</h3>
        <div className="fr"><label>Candidate *</label>
          <select value={f.candidate_id} onChange={s("candidate_id")}>
            <option value="">Select candidate…</option>
            {candidates.map(c=><option key={c.id} value={c.id}>{c.name} — {c.role}</option>)}
          </select>
        </div>
        <div className="fr"><label>Job *</label>
          <select value={f.job_id} onChange={s("job_id")}>
            <option value="">Select job…</option>
            {jobs.map(j=><option key={j.id} value={j.id}>{j.title} — {j.companies?.name||""}</option>)}
          </select>
        </div>
        <div className="fr2">
          <div className="fr" style={{margin:0}}><label>Status</label><select value={f.status} onChange={s("status")}>{SUBMITTAL_STATUSES.map(x=><option key={x}>{x}</option>)}</select></div>
          <div className="fr" style={{margin:0}}><label>Submitted Date</label><input type="date" value={f.submitted_date} onChange={s("submitted_date")}/></div>
        </div>
        <div className="fr"><label>Interview Date (if booked)</label><input type="datetime-local" value={f.interview_date} onChange={s("interview_date")}/></div>
        <div className="fr"><label>Client Feedback</label><textarea value={f.client_feedback} onChange={s("client_feedback")} placeholder="Client's response…"/></div>
        <div className="fr"><label>Notes</label><textarea value={f.notes} onChange={s("notes")}/></div>
        {err&&<div className="err">{err}</div>}
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
          <button className="btn-o" onClick={()=>setModal(false)}>Cancel</button>
          <button className="btn-a" onClick={save} disabled={saving}>{saving?"Saving…":"Submit"}</button>
        </div>
      </div>
    </div>}
  </div>;
}

// FEATURE 3: EMAIL SEQUENCES
